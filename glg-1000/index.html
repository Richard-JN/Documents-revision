<!doctype html>
<html lang="fr-CA">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Révision GLG-1000</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Mise en page : carnet d'étude — bande d'en-tête, notions empilées (animation | texte), outil interactif pleine largeur, puis « Teste-toi » */
:root{
  --bg:#ecdfc0; --surface:#f6edd6; --ink:#2a2016; --muted:#65543d; --line:#c7b089; --steel:#23605f; --rebar:#974019; --sage:#4d6a2c; --alert:#9c2b20; --water:#9cc0c4; --hydrate:#8c8372; --grain:#463a2c; --sand:#c49a52; --stone:#85775f; --magma:#bf431b; --ice:#d6e4df; --sea:#33698a; --veg:#587a30; --clay:#9c7a52;
  --display:"Barlow Condensed","Arial Narrow",sans-serif;
  --body:"IBM Plex Sans",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#1e1913;--surface:#29221a;--ink:#ede2c8;--muted:#b9a888;--line:#4a3e2f;--steel:#77bdb4;--rebar:#e38c5e;--sage:#a0c178;--alert:#ec8274;--water:#2e5560;--hydrate:#918a7c;--grain:#dbcfb5;--sand:#b8955a;--stone:#8f826d;--magma:#f07a4e;--ice:#3b5450;--sea:#72a5c4;--veg:#92b866;--clay:#ae8f69;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1e1913;--surface:#29221a;--ink:#ede2c8;--muted:#b9a888;--line:#4a3e2f;--steel:#77bdb4;--rebar:#e38c5e;--sage:#a0c178;--alert:#ec8274;--water:#2e5560;--hydrate:#918a7c;--grain:#dbcfb5;--sand:#b8955a;--stone:#8f826d;--magma:#f07a4e;--ice:#3b5450;--sea:#72a5c4;--veg:#92b866;--clay:#ae8f69;color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.6 var(--body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 56px}
.wrap{max-width:1040px;margin:0 auto}
h1,h2,h3{font-family:var(--display);font-weight:600;line-height:1.1;text-wrap:balance;margin:0}
h1{font-size:clamp(2.2rem,6vw,3.4rem);letter-spacing:.01em}
h2{font-size:1.75rem}
h3{font-size:1.25rem}
p{margin:0}
.eyebrow{font:500 .72rem/1.2 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
a{color:var(--steel)}
button,input,select{font:inherit}
:focus-visible{outline:2px solid var(--steel);outline-offset:2px}

.masthead{padding-block:36px 24px;border-bottom:2px solid var(--ink);display:grid;gap:10px}
.masthead p{color:var(--muted);max-width:62ch}
.masthead .src{font:.75rem var(--mono);color:var(--muted)}

/* Accueil */
.part{margin-top:34px;display:grid;gap:14px}
.part-head{display:flex;align-items:baseline;gap:12px;border-bottom:1px solid var(--line);padding-bottom:6px}
.part-head h2{font-size:1.4rem}
.part-head span{font:.75rem var(--mono);color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.card{display:grid;gap:8px;align-content:start;text-align:left;cursor:pointer;position:relative;
  background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:18px;color:var(--ink);transition:border-color .15s,transform .15s}
.card:hover{border-color:var(--steel);transform:translateY(-2px)}
.card .code{font:500 .75rem var(--mono);color:var(--rebar)}
.card h3{font-size:1.4rem}
.card p{color:var(--muted);font-size:.9rem}
.card .meta{font:.72rem var(--mono);color:var(--muted);display:flex;gap:12px;flex-wrap:wrap}
.card .done{position:absolute;top:14px;right:14px;font:500 .68rem var(--mono);color:var(--sage);border:1px solid var(--sage);border-radius:999px;padding:1px 8px}
.progress{font:.8rem var(--mono);color:var(--muted)}
.progress b{color:var(--sage);font-weight:500}

/* Module */
.topbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:24px;flex-wrap:wrap}
.link{background:none;border:0;padding:0;color:var(--steel);cursor:pointer;font:500 .85rem var(--mono)}
.toggle-done{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px 12px;font:.78rem var(--mono);color:var(--ink);cursor:pointer}
.toggle-done[aria-pressed="true"]{border-color:var(--sage);color:var(--sage)}
.toc{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}
.toc button{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-size:.82rem;color:var(--ink);cursor:pointer}
.toc button:hover{border-color:var(--steel)}
.sec{padding-block:40px;border-bottom:1px solid var(--line);display:grid;gap:24px}
.sec-head{display:flex;gap:14px;align-items:baseline}
.sec-num{font:600 2.4rem/1 var(--display);color:var(--rebar);font-variant-numeric:tabular-nums}
.duo{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:28px;align-items:start}
@media (max-width:760px){.duo{grid-template-columns:1fr}}
.stage{background:var(--surface);border:1px solid var(--line);border-radius:4px;overflow:hidden;position:relative;display:grid}
.stage canvas{display:block;width:100%;height:auto}
.stage .play{justify-self:end;margin:0 8px 8px;background:var(--bg);border:1px solid var(--line);border-radius:3px;padding:2px 10px;font:.72rem var(--mono);color:var(--ink);cursor:pointer;opacity:.85}
.text{display:grid;gap:12px;min-width:0}
.text p{max-width:62ch}
.key{border-left:3px solid var(--steel);padding:8px 12px;background:var(--surface);font-size:.9rem}
.key b{display:block;font:500 .7rem var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--steel);margin-bottom:2px}
.key ul{margin:4px 0 0;padding-left:18px}
.formula{font-family:var(--mono);font-size:.86rem}
.next{margin-top:28px;display:flex;justify-content:flex-end}
.next button{background:var(--ink);color:var(--bg);border:0;border-radius:3px;padding:10px 16px;font:500 .9rem var(--body);cursor:pointer}

/* Graphique */
.chart{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:18px;display:grid;gap:14px;min-width:0}
.chart-top{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:baseline}
.chart-top h3{font-size:1.15rem}
.readout{font:.8rem var(--mono);color:var(--ink);font-variant-numeric:tabular-nums;display:flex;gap:6px 14px;flex-wrap:wrap}
.readout span b{color:var(--rebar);font-weight:500}
.readout span.ok b{color:var(--sage)}
.readout span.bad b{color:var(--alert)}
.chart-body{display:grid;grid-template-columns:minmax(0,1fr) 240px;gap:20px}
@media (max-width:720px){.chart-body{grid-template-columns:1fr}}
.plot{min-width:0;position:relative}
.plot svg{width:100%;height:auto;display:block;overflow:visible;touch-action:pan-y}
.ctrls{display:grid;gap:14px;align-content:start;min-width:0}
.ctrl{display:grid;gap:4px}
.ctrl label,.ctrl .lab{font-size:.82rem;display:flex;justify-content:space-between;gap:8px}
.ctrl output{font:.8rem var(--mono);color:var(--steel);font-variant-numeric:tabular-nums;white-space:nowrap}
.ctrl input[type=range]{width:100%;accent-color:var(--steel)}
.seg{display:flex;flex-wrap:wrap;gap:4px}
.seg button{background:var(--bg);border:1px solid var(--line);border-radius:3px;padding:3px 9px;font-size:.78rem;color:var(--ink);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--steel);border-color:var(--steel);color:var(--surface)}
.legend{display:flex;gap:6px 14px;flex-wrap:wrap;font-size:.78rem;color:var(--muted)}
.legend i{display:inline-block;width:18px;height:0;border-top:2.5px solid var(--steel);vertical-align:middle;margin-right:6px}
.legend i.ref{border-top:2px dashed var(--muted)}
.legend i.alt{border-top-color:var(--rebar)}
.legend i.c3{border-top-color:var(--sage)}
.legend i.band{border-top:8px solid var(--steel);opacity:.25}
.note{font-size:.8rem;color:var(--muted);max-width:78ch}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--bg);font:.75rem var(--mono);padding:3px 7px;border-radius:3px;white-space:nowrap;transform:translate(-50%,-130%)}
svg text{fill:var(--muted);font:11px var(--mono)}
svg .ax{stroke:var(--ink);stroke-width:1}
svg .gr{stroke:var(--line);stroke-width:1}
svg .c-main{stroke:var(--steel);stroke-width:2.5;fill:none}
svg .c-alt{stroke:var(--rebar);stroke-width:2.2;fill:none}
svg .c-c3{stroke:var(--sage);stroke-width:2.2;fill:none}
svg .c-ref{stroke:var(--muted);stroke-width:1.5;fill:none;stroke-dasharray:5 4}
svg .area{fill:var(--steel);opacity:.08}
svg .band{fill:var(--steel);opacity:.16}
svg .band-alt{fill:var(--rebar);opacity:.16}
svg .mk{fill:var(--rebar);stroke:var(--surface);stroke-width:2}
svg .mk-line{stroke:var(--rebar);stroke-width:1;stroke-dasharray:3 3}
svg .seuil{stroke:var(--alert);stroke-width:1.2;stroke-dasharray:6 3}
svg .seuil-t{fill:var(--alert);font-size:10.5px}
svg .lbl{fill:var(--ink);font-size:11px}
svg .bar{fill:var(--steel);opacity:.75}
svg .bar-alt{fill:var(--rebar);opacity:.85}
svg .bar-ref{fill:var(--muted);opacity:.35}
svg .bar-c3{fill:var(--sage);opacity:.8}

/* Widgets maison */
.calc-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px}
.steps{display:grid;gap:0;border:1px solid var(--line);border-radius:4px;overflow:hidden}
.step{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:10px;padding:9px 12px;border-top:1px solid var(--line);align-items:baseline;font-size:.88rem}
.step:first-child{border-top:0}
.step .n{font:600 1.1rem var(--display);color:var(--rebar)}
.step .why{color:var(--muted);font-size:.8rem;display:block}
.step .val{font:500 .86rem var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap;text-align:right}
.stack{display:flex;height:34px;border-radius:3px;overflow:hidden;border:1px solid var(--line)}
.stack div{display:grid;place-items:center;font:.68rem var(--mono);color:#fff;min-width:0;overflow:hidden;white-space:nowrap}
.stack-legend{display:flex;flex-wrap:wrap;gap:6px 14px;font:.75rem var(--mono);color:var(--muted)}
.stack-legend i{display:inline-block;width:10px;height:10px;margin-right:5px;vertical-align:-1px;border-radius:2px}
.checks{display:grid;gap:8px}
.checks label{display:flex;gap:10px;align-items:center;font-size:.9rem;cursor:pointer}
.checks input{width:18px;height:18px;accent-color:var(--steel)}
.verdict{font:600 1.3rem var(--display);padding:10px 14px;border-radius:3px;border:1px solid var(--line)}
.verdict.ok{color:var(--sage);border-color:var(--sage)}
.verdict.bad{color:var(--alert);border-color:var(--alert)}
.tbl-wrap{overflow-x:auto}
table.res{border-collapse:collapse;font:.8rem var(--mono);font-variant-numeric:tabular-nums;min-width:100%}
table.res th,table.res td{border-bottom:1px solid var(--line);padding:5px 8px;text-align:right;white-space:nowrap}
table.res th:first-child,table.res td:first-child{text-align:left}
table.res th{font-weight:500;color:var(--muted)}
table.res td.bad{color:var(--alert)}
table.res td.ok{color:var(--sage)}
.btn{background:var(--bg);border:1px solid var(--line);border-radius:3px;padding:5px 12px;font-size:.82rem;color:var(--ink);cursor:pointer}
.btn:hover{border-color:var(--steel)}
@media (max-width:640px){svg text{font-size:12px}}

/* Badges de source des graphiques */
.badge{display:inline-block;font:500 .66rem/1.5 var(--mono);letter-spacing:.06em;text-transform:uppercase;padding:1px 8px;border-radius:999px;border:1px solid currentColor;white-space:nowrap}
.badge.cours{color:var(--sage)}
.badge.calcul{color:var(--steel)}
.badge.modele{color:var(--rebar);border-style:dashed}
.chart-top .titre{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
/* Pour aller plus loin */
details.plus{border-top:1px dashed var(--line);padding-top:8px}
details.plus summary{cursor:pointer;font:500 .8rem var(--mono);color:var(--steel)}
details.plus p{margin-top:8px;font-size:.92rem;color:var(--ink);max-width:62ch}
/* Teste-toi */
.test{border:1px solid var(--line);border-left:4px solid var(--rebar);border-radius:4px;background:var(--surface);padding:14px 16px;display:grid;gap:14px}
.test-head{display:flex;justify-content:space-between;gap:10px;align-items:baseline;flex-wrap:wrap}
.test-head h3{font-size:1.1rem}
.q{display:grid;gap:8px}
.q-text{font-weight:500;font-size:.95rem}
.q-opts{display:grid;gap:6px}
.q-opts button{text-align:left;background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:7px 10px;font-size:.88rem;color:var(--ink);cursor:pointer}
.q-opts button:hover:not(:disabled){border-color:var(--steel)}
.q-opts button.good{border-color:var(--sage);background:color-mix(in srgb,var(--sage) 14%,var(--bg))}
.q-opts button.bad{border-color:var(--alert);background:color-mix(in srgb,var(--alert) 12%,var(--bg))}
.q-opts button:disabled{cursor:default}
.q-fb{font-size:.86rem;color:var(--ink);max-width:70ch}
.q-fb b.ok{color:var(--sage)}
.q-fb b.no{color:var(--alert)}
.q-row{display:flex;gap:8px;flex-wrap:wrap}
/* Accueil : actions et progression */
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}
.action{background:var(--ink);color:var(--bg);border:0;border-radius:3px;padding:9px 14px;font:500 .9rem var(--body);cursor:pointer}
.action.alt{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.card .qprog{font:.72rem var(--mono);color:var(--steel)}
/* Fiche de synthèse */
.fiche{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px;margin-top:24px}
.fiche-bloc{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:14px 16px;display:grid;gap:8px;align-content:start;min-width:0}
.fiche-bloc h3{font-size:1.2rem}
.fiche-bloc dl{display:grid;grid-template-columns:minmax(0,1fr);gap:6px;margin:0}
.fiche-bloc dt{font:500 .72rem var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.fiche-bloc dd{margin:0 0 4px;font-size:.92rem}
/* Quiz aléatoire */
.quiz-page{display:grid;gap:16px;margin-top:20px;max-width:760px}
.quiz-meta{font:.8rem var(--mono);color:var(--muted);display:flex;gap:14px;flex-wrap:wrap}
.quiz-meta b{color:var(--ink);font-weight:500}
[hidden]{display:none!important}
/* Confiance et maîtrise des notions */
.q-opts button.pick{border-color:var(--steel);box-shadow:inset 0 0 0 1px var(--steel)}
.conf{display:grid;gap:6px;max-width:460px;padding:10px 12px;border:1px solid var(--line);border-radius:4px;background:var(--surface)}
.conf > label{font:500 .72rem var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.conf output{font:500 .95rem var(--mono);font-variant-numeric:tabular-nums;color:var(--steel)}
.conf-ligne{display:flex;gap:8px;align-items:center}
.conf-ligne input{flex:1;min-width:0;accent-color:var(--steel)}
.conf-bout{font:.7rem var(--mono);color:var(--muted)}
.conf-ok{justify-self:start;background:var(--ink);color:var(--bg);border:0;border-radius:3px;padding:6px 14px;font:500 .85rem var(--body);cursor:pointer}
.q-fb .piege{display:block;margin-top:6px;padding-left:10px;border-left:2px solid var(--alert);color:var(--muted)}
.q-fb .cas{display:block;font:500 .72rem var(--mono);letter-spacing:.06em;text-transform:uppercase;margin-bottom:2px}
.q-type{font:500 .7rem var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--steel)}
.q-rappel,.q-a{padding:10px 12px;border:1px dashed var(--steel);border-radius:4px}
.q-consigne{margin:0;max-width:70ch;padding-left:10px;border-left:2px solid var(--steel);font-size:.84rem;color:var(--muted)}
.q-ecrit{width:100%;max-width:460px;box-sizing:border-box;font:inherit;font-size:.9rem;padding:7px 10px;border:1px solid var(--line);border-radius:4px;background:var(--bg);color:var(--ink);resize:vertical}
.q-ecrit[readonly]{border-style:dashed;color:var(--muted)}
.q-insiste{margin:0;font-size:.84rem;color:var(--alert)}
.q-fb .q-corrige{display:block;font:500 .72rem var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:2px}
.q-assoc{display:grid;gap:6px;max-width:620px}
.q-paire{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:4px 10px;align-items:center;padding:6px 8px;border:1px solid var(--line);border-radius:4px;background:var(--bg);font-size:.88rem}
.q-paire select{width:100%;min-width:0;font:inherit;font-size:.85rem;padding:5px 6px;border:1px solid var(--line);border-radius:3px;background:var(--surface);color:var(--ink)}
.q-paire.good{border-color:var(--sage);background:color-mix(in srgb,var(--sage) 10%,var(--bg))}
.q-paire.bad{border-color:var(--alert);background:color-mix(in srgb,var(--alert) 8%,var(--bg))}
.q-corr{grid-column:2;font-size:.8rem;color:var(--sage);font-weight:500}
.q-liste{display:grid;gap:8px}
.q-liste-ok{justify-self:start}
.q-liste-res{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:6px}
.q-item{border:1px solid var(--line);border-radius:3px;padding:4px 9px;font:inherit;font-size:.84rem;background:var(--bg);color:var(--ink);cursor:pointer}
.q-item.good{border-color:var(--sage);background:color-mix(in srgb,var(--sage) 12%,var(--bg))}
.q-item.bad{border-color:var(--alert);background:color-mix(in srgb,var(--alert) 8%,var(--bg))}
.q-liste-bilan b.ok{color:var(--sage)}.q-liste-bilan b.no{color:var(--alert)}
.q-multi,.q-vf{padding:10px 12px;border:1px dashed var(--steel);border-radius:4px}
.q-opts.multi button{display:grid;grid-template-columns:auto 1fr;column-gap:8px}
.q-opts.multi button::before{content:"";width:13px;height:13px;margin-top:2px;border:1.5px solid var(--muted);border-radius:2px;grid-row:span 2}
.q-opts.multi button.pick::before{background:var(--steel);border-color:var(--steel);box-shadow:inset 0 0 0 2px var(--bg)}
.q-opts.multi button.good::before{background:var(--sage);border-color:var(--sage);box-shadow:inset 0 0 0 2px var(--bg)}
.q-opts.multi button.bad::before{background:var(--alert);border-color:var(--alert);box-shadow:inset 0 0 0 2px var(--bg)}
.q-opts button.manque{border-color:var(--sage);border-style:dashed}
.q-opts button.neutre{opacity:.85}
.q-oe{display:block;grid-column:2;margin-top:3px;font-size:.8rem;color:var(--muted)}
.q-oe b{color:var(--ink);font-weight:600}
.q-vf-liste{display:grid;gap:6px;max-width:680px}
.q-vfl{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;align-items:center;padding:6px 8px;border:1px solid var(--line);border-radius:4px;background:var(--bg);font-size:.88rem}
.q-vfl.good{border-color:var(--sage);background:color-mix(in srgb,var(--sage) 10%,var(--bg))}
.q-vfl.bad{border-color:var(--alert);background:color-mix(in srgb,var(--alert) 8%,var(--bg))}
.q-vfl .q-corr{grid-column:1 / -1;color:var(--muted);font-weight:400}
.q-vfl.bad .q-corr{color:var(--ink)}
.q-vf-b{display:flex;gap:4px}
.q-vf-b button{min-width:38px;min-height:32px;border:1px solid var(--line);border-radius:3px;background:var(--surface);color:var(--ink);font:600 .85rem var(--mono);cursor:pointer}
.q-vf-b button.pick{background:var(--steel);border-color:var(--steel);color:var(--bg)}
.q-vf-b button:disabled{cursor:default}
.q-vf-b button.juste{outline:2px solid var(--sage);outline-offset:1px}
@media (max-width:520px){.q-paire{grid-template-columns:1fr}.q-corr{grid-column:1}}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;border:1.5px solid var(--line);vertical-align:-1px;flex:none}

<script>
const COURSE = {
  code: "GLG-1000",
  nom: "Planète Terre",
  storageKey: "glg1000",
  diagAvant: true,                 // à l'entrée d'un sujet, seul le diagnostic s'affiche ; le contenu apparaît après (ou si on le passe)
  footer: "Contenu tiré des présentations et des notes de cours GLG-1000, modules 4 à 7.",
  parties: [
    { id: "m4", titre: "Module 4 · Les minéraux" },
    { id: "m5", titre: "Module 5 · Les roches" },
    { id: "m6", titre: "Module 6 · Les ressources" },
    { id: "m7", titre: "Module 7 · Les continents" }
  ],
  examenIntro: "La liste « Je retiens quoi dans tout ça ! » du prof, point par point. Chaque ligne t'amène à la notion qui la couvre ; la pastille montre où tu en es. Ce qui n'est pas sur la liste est marqué 💤 survol dans les sujets.",
  ponderation: {
    "atome-mineral": {
      0: { niveau: "survol" },
      1: { niveau: "examen", examen: "Définir l'<b>état cristallin</b> : atomes ordonnés selon un motif (la maille) répété dans les trois directions. Savoir ce qu'est un <b>polymorphe</b> (même composition, structures différentes)." },
      2: { niveau: "examen", examen: "Les critères de la définition : <b>solide, naturel, inorganique, cristallin, composition chimique définie</b>. « Définie » mais variable dans des limites : c'est la <b>substitution</b> (ions de taille et de charge semblables)." }
    },
    "proprietes-mineraux": {
      0: { niveau: "examen", examen: "Expliquer la couleur : les <b>chromophores</b> (éléments qui colorent, même en traces) et les <b>pseudo-couleurs</b> (colorations pseudochromatiques : effets optiques entre la lumière et la structure interne, pas la composition : dispersion, le « feu » du diamant ; chatoiement, l'œil-de-tigre ; diffraction, l'opale ; labradorescence)." },
      1: { niveau: "examen", examen: "Expliquer et comprendre la propriété : ce que mesure la dureté et pourquoi l'échelle de Mohs est relative." },
      2: { niveau: "examen", examen: "<b>Expliquer le clivage</b> : rupture selon des plans de liens faibles de la structure cristalline, toujours les mêmes ; à distinguer de la cassure (quartz, conchoïdale)." },
      3: { niveau: "examen" }
    },
    "classification-silicates": {
      0: { niveau: "examen", prof: "Classification de Strunz : connaître les <b>catégories</b>. <b>Pas besoin d'exemples de noms de minéraux.</b> L'exercice « Dans quelle classe ? » sert à reconnaître l'anion, pas à mémoriser les noms." },
      1: { niveau: "examen", prof: "Structure des silicates : <b>pas besoin d'exemples</b>. Retiens le tétraèdre SiO₄⁴⁻ et la façon dont il s'assemble (isolé, chaînes, feuillets, charpente 3D)." },
      2: { niveau: "survol" }
    },
    "formation-mineraux": {
      0: { niveau: "examen" },
      1: { niveau: "examen", examen: "Une <b>solution sursaturée</b> contient plus de matière dissoute qu'elle ne peut en garder : le surplus précipite en cristaux. Trois cas au programme : la <b>séquence évaporitique</b>, la cristallisation dans les <b>veines ou géodes</b>, les <b>dépôts de cavernes</b>." },
      2: { niveau: "examen" },
      3: { niveau: "examen", examen: "Transformation de minéraux préexistants : le <b>métamorphisme</b> et l'<b>altération chimique</b>. Le diagramme de phases de l'eau n'est pas sur la liste : survol." }
    },
    "cycle-roches": {
      0: { niveau: "examen", prof: "Cycle des roches : <b>compléter le diagramme</b>. Exerce-toi avec la notion 2." },
      1: { niveau: "examen", prof: "À l'examen : <b>compléter le diagramme</b> du cycle des roches." }
    },
    "roches-ignees": {

    },
    "magmatisme-volcans": {
      0: { niveau: "examen", examen: "<b>Modes de formation d'un magma primaire</b> (fusion partielle du manteau, la péridotite ultramafique) : 2 modes.<ul><li><b>Fusion adiabatique</b> : relâchement de pression quand le manteau remonte (dorsales, points chauds).</li><li><b>Fusion par ajout de volatiles</b> : l'eau abaisse la température de fusion (zones de subduction, arcs insulaires et continentaux).</li></ul>À ne pas confondre : la fusion partielle de la croûte continentale (épaississement lors d'une collision) produit aussi des magmas, mais ce ne sont pas des magmas primaires. Expliquer les caractéristiques de chaque <b>lieu du volcanisme</b> : dorsale, point chaud, subduction." },

      1: { niveau: "examen", examen: "Les <b>3 fractions</b> de la sédimentation : terrigène, allochimique, orthochimique." },
      2: { niveau: "examen", examen: "<b>Nomenclature générale</b> des roches sédimentaires : conglomérat, grès, siltstone, shale (selon la taille des grains) ; calcaire ; évaporites (gypse, halite)." }

/* ==========================================================================
   TROUSSE DE RÉVISION — moteur commun (voir la compétence « revision-interactive »)
   COURSE = { code, nom, accroche, footer, storageKey, parties:[{id,titre}], fiche:[…],          (course.js, chargé avant)
              diagAvant, diagnostic, seuilSur, textes, niveaux, examen, ponderation }        options : voir LISEZMOI.md
   diagAvant: true → à l'entrée d'un sujet, seul le quiz diagnostique s'affiche ; le contenu apparaît après (ou si on le passe)
   Un module = { id, partie, titre, resume, sources, sections:[...] }
   Une section = {
     titre,
     anim: { ratio, alt, draw(ctx, t, w, h) },      // t en secondes, w et h en px CSS
     texte: ["…", "…"],                             // 2 paragraphes affichés ; les suivants vont dans « Pour aller plus loin »
     plus: ["…"],                                   // facultatif : détails repliés
     cle: { label, html },                          // encadré « à retenir »
     graphique: { titre, source, x, y, params, calc(p), note }  // source : "cours" | "calcul" | "modele"
     widget: (conteneur) => { … },                  // ou outil sur mesure
     quiz: [{ q, o:[…], r, e, p }]                  // « Teste-toi » ; sans o = question de rappel ; p = pièges (facultatif)
     diag: { q, o:[…], r, e, p }                    // facultatif : question du quiz diagnostique (sinon diag.js, sinon 1re Teste-toi)
   }
   Pièges : p = ["…", null, …] aligné sur o ; pour chaque mauvais choix, pourquoi il est tentant (affiché si on le choisit).
   Graphique : calc(p) renvoie { courbes, bandes, seuils, marqueurs, barres, lecture }
   ========================================================================== */
const MODULES = [];
const PARTIES = COURSE.parties;
const QUIZ = typeof QUIZ_DATA === "undefined" ? {} : QUIZ_DATA;
/* QUIZ_PLUS (facultatif, même forme que QUIZ_DATA) : questions ajoutées après coup, placées APRÈS celles de la notion (y compris section.quiz) pour garder la progression.
   Plusieurs vagues d'ajouts : QUIZ_PLUS = [vague1, vague2, …] ; chaque vague se place après la précédente (n'insérer une vague qu'à la fin). */
const QUIZ_EN_PLUS = (typeof QUIZ_PLUS === "undefined" ? [] : [].concat(QUIZ_PLUS)).reduce((tout, vague) => {
  for (const [id, secs] of Object.entries(vague)) for (const [i, qs] of Object.entries(secs)) ((tout[id] = tout[id] || {})[i] = (tout[id][i] || []).concat(qs));
  return tout;
}, {});
const DIAG = typeof DIAG_DATA === "undefined" ? {} : DIAG_DATA;

/* ---------- utilitaires ---------- */
const range = (a, b, n) => { const o = []; for (let i = 0; i <= n; i++) o.push(a + (b - a) * i / n); return o; };
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, u) => a + (b - a) * u;
const ease = x => x < 0.5 ? 2 * x * x : 1 - Math.pow(-2 * x + 2, 2) / 2;
const fr = (v, d = 1) => (+v).toLocaleString("fr-CA", { minimumFractionDigits: d, maximumFractionDigits: d });
const fx = v => fr(v, Math.abs(v) >= 100 ? 0 : 1);
function interp(xs, ys, x) {
  if (x <= xs[0]) return ys[0];
  for (let i = 1; i < xs.length; i++) if (x <= xs[i]) return lerp(ys[i - 1], ys[i], (x - xs[i - 1]) / (xs[i] - xs[i - 1]));
  return ys[ys.length - 1];
}
function el(tag, attrs = {}, html) {
  const e = document.createElement(tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (html != null) e.innerHTML = html;
  return e;
}
function seeded(seed) { return () => (seed = (seed * 16807) % 2147483647) / 2147483647; }
function niceTicks(min, max, n = 5) {
  const span = max - min, step0 = span / n, mag = Math.pow(10, Math.floor(Math.log10(step0)));
  const step = [1, 2, 2.5, 5, 10].map(m => m * mag).find(s => span / s <= n) || 10 * mag;
  const out = []; for (let v = Math.ceil(min / step - 1e-9) * step; v <= max + 1e-9; v += step) out.push(+v.toFixed(10));
  return out;
}
const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
};
let uid = 0;

/* ---------- couleurs du thème pour les canvas ---------- */
const C = {};
function readColors() {
  const cs = getComputedStyle(document.documentElement);
  ["bg", "surface", "ink", "muted", "line", "steel", "rebar", "sage", "alert", "water", "hydrate", "grain", "sand", "stone", "magma", "ice", "sea", "veg", "clay"]
    .forEach(k => C[k] = cs.getPropertyValue("--" + k).trim());
}
readColors();
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", readColors);
new MutationObserver(readColors).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });

/* ---------- contrôles (curseurs et choix) ---------- */
function buildControls(params, p, onChange, box) {
  params.forEach(par => {
    p[par.id] = par.value;
    const c = el("div", { class: "ctrl" });
    const id = "c" + (++uid) + "-" + par.id;
    if (par.type === "choix") {
      c.append(el("span", { class: "lab" }, par.label));
      const seg = el("div", { class: "seg", role: "group", "aria-label": par.label });
      par.options.forEach(o => {
        const b = el("button", { type: "button", id: id + "-" + String(o.v).replace(/\W/g, ""), "aria-pressed": String(o.v === par.value) }, o.label);
        b.addEventListener("click", () => {
          p[par.id] = o.v;
          seg.querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", String(x === b)));
          onChange();
        });
        seg.append(b);
      });
      c.append(seg);
    } else {
      const out = el("output", { for: id });
      const lab = el("label", { for: id }); lab.append(document.createTextNode(par.label), out);
      const inp = el("input", { type: "range", id, min: par.min, max: par.max, step: par.step, value: par.value });
      const dec = String(par.step).includes(".") ? String(par.step).split(".")[1].length : 0;
      const show = () => out.textContent = fr(p[par.id], dec) + (par.unit || "");
      inp.addEventListener("input", () => { p[par.id] = +inp.value; show(); onChange(); });
      show(); c.append(lab, inp);
    }
    box.append(c);
  });
}

/* ---------- badge de source ---------- */
const BADGES = {
  cours: ["Données du cours", "Valeurs et exemples tirés des notes : à connaître."],
  calcul: ["Calcul exact", "Formule exacte : les valeurs calculées sont fiables."],
  modele: ["Modèle illustratif", "Courbe schématique pour voir la tendance : ne mémorise pas les valeurs."]
};
function badge(k) { const b = BADGES[k] || BADGES.modele; return el("span", { class: "badge " + k, title: b[1] }, b[0]); }

/* ---------- graphique interactif ---------- */
function buildChart(cfg) {
  const box = el("div", { class: "chart" });
  const top = el("div", { class: "chart-top" });
  const ro = el("div", { class: "readout", "aria-live": "polite" });
  const tt = el("div", { class: "titre" }); tt.append(el("h3", {}, cfg.titre));
  if (cfg.source) tt.append(badge(cfg.source));
  top.append(tt, ro);
  const body = el("div", { class: "chart-body" });
  const plot = el("div", { class: "plot" });
  const ctrls = el("div", { class: "ctrls" });
  body.append(plot);
  if (cfg.params && cfg.params.length) body.append(ctrls); else body.style.gridTemplateColumns = "1fr";
  const legend = el("div", { class: "legend" });
  box.append(top, body, legend);
  if (cfg.note) box.append(el("p", { class: "note" }, cfg.note));

  const p = {};
  buildControls(cfg.params || [], p, () => draw(), ctrls);

  const small = innerWidth < 640, W = small ? 400 : 600, H = small ? 300 : 340, m = { l: 50, r: 14, t: 16, b: 46 };
  const ns = "http://www.w3.org/2000/svg";
  const svg = document.createElementNS(ns, "svg");
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`); svg.setAttribute("role", "img"); svg.setAttribute("aria-label", cfg.titre);
  plot.append(svg);
  const tip = el("div", { class: "tip", hidden: "" }); plot.append(tip);
  let last = null, X, Y, sx, sy;

  function scales() {
    X = typeof cfg.x === "function" ? cfg.x(p) : cfg.x;
    Y = typeof cfg.y === "function" ? cfg.y(p) : cfg.y;
    const lx = v => X.log ? Math.log10(v) : v;
    sx = v => m.l + (lx(v) - lx(X.min)) / (lx(X.max) - lx(X.min)) * (W - m.l - m.r);
    sy = v => H - m.b - (v - Y.min) / (Y.max - Y.min) * (H - m.t - m.b);
  }
  const cx = v => clamp(v, X.min, X.max), cy = v => clamp(v, Y.min, Y.max);
  const path = pts => pts.map((q, i) => (i ? "L" : "M") + sx(cx(q[0])).toFixed(1) + " " + sy(cy(q[1])).toFixed(1)).join("");
  const ft = v => Math.abs(v) >= 1000 ? Math.round(v).toLocaleString("fr-CA") : (+v.toFixed(4)).toLocaleString("fr-CA");

  function draw() {
    scales();
    const r = cfg.calc(p); last = r;
    let s = "";
    (Y.ticks || niceTicks(Y.min, Y.max)).forEach(v => s += `<line class="gr" x1="${m.l}" x2="${W - m.r}" y1="${sy(v)}" y2="${sy(v)}"/><text x="${m.l - 8}" y="${sy(v) + 4}" text-anchor="end">${Y.tickFmt ? Y.tickFmt(v) : ft(v)}</text>`);
    if (r.barres) {
      const n = r.barres.length, slot = (W - m.l - m.r) / n, bw = Math.min(56, slot * 0.62);
      r.barres.forEach((b, i) => {
        const x = m.l + slot * (i + 0.5), y0 = sy(Math.max(Y.min, 0)), y1 = sy(cy(b.val));
        s += `<rect class="bar${b.style ? "-" + b.style : ""}" x="${x - bw / 2}" y="${Math.min(y0, y1)}" width="${bw}" height="${Math.abs(y0 - y1)}" rx="2"><title>${b.nom} : ${b.txt || fx(b.val)}</title></rect>`;
        s += `<text class="lbl" x="${x}" y="${y1 - 6}" text-anchor="middle">${b.txt || fx(b.val)}</text>`;
        s += `<text x="${x}" y="${H - m.b + 18}" text-anchor="middle" style="${n > 6 ? "font-size:" + (W < 500 ? 8.5 : 10) + "px" : ""}">${b.nom}</text>`;
        if (b.sous) s += `<text x="${x}" y="${H - m.b + 32}" text-anchor="middle" font-size="10">${b.sous}</text>`;
      });
    } else {
      (X.ticks || niceTicks(X.min, X.max, 6)).forEach(v => s += `<line class="gr" y1="${m.t}" y2="${H - m.b}" x1="${sx(v)}" x2="${sx(v)}" opacity=".5"/><text x="${sx(v)}" y="${H - m.b + 18}" text-anchor="middle">${X.tickFmt ? X.tickFmt(v) : ft(v)}</text>`);
      s += `<text x="${(W + m.l) / 2}" y="${H - 6}" text-anchor="middle">${X.label}</text>`;
    }
    s += `<line class="ax" x1="${m.l}" x2="${W - m.r}" y1="${sy(Math.max(Y.min, Math.min(0, Y.max)))}" y2="${sy(Math.max(Y.min, Math.min(0, Y.max)))}"/><line class="ax" x1="${m.l}" x2="${m.l}" y1="${m.t}" y2="${H - m.b}"/>`;
    s += `<text transform="translate(13 ${(H - m.b + m.t) / 2}) rotate(-90)" text-anchor="middle">${Y.label}</text>`;
    (r.bandes || []).forEach(b => {
      const d = path(b.haut) + b.bas.slice().reverse().map(q => "L" + sx(cx(q[0])).toFixed(1) + " " + sy(cy(q[1])).toFixed(1)).join("") + "Z";
      s += `<path class="${b.style || "band"}" d="${d}"/>`;
    });
    (r.courbes || []).forEach(c => {
      if (c.style === "main" && !r.bandes && c.aire !== false) {
        const base = sy(Math.max(Y.min, 0));
        s += `<path class="area" d="${path(c.pts)}L${sx(cx(c.pts.at(-1)[0]))} ${base}L${sx(cx(c.pts[0][0]))} ${base}Z"/>`;
      }
      s += `<path class="c-${c.style}" d="${path(c.pts)}"/>`;
    });
    (r.seuils || []).forEach(t => {
      if (t.axe === "x") { const x = sx(cx(t.v)); s += `<line class="seuil" x1="${x}" x2="${x}" y1="${m.t}" y2="${H - m.b}"/><text class="seuil-t" x="${x + 4}" y="${m.t + 10 + (t.dy || 0)}">${t.nom}</text>`; }
      else { const y = sy(cy(t.v)); s += `<line class="seuil" x1="${m.l}" x2="${W - m.r}" y1="${y}" y2="${y}"/><text class="seuil-t" x="${W - m.r - 4}" y="${y - 5}" text-anchor="end">${t.nom}</text>`; }
    });
    (r.marqueurs || []).forEach(k => {
      const x = sx(cx(k.x)), y = sy(cy(k.y));
      s += `<line class="mk-line" x1="${x}" x2="${x}" y1="${y}" y2="${sy(Math.max(Y.min, 0))}"/><circle class="mk" cx="${x}" cy="${y}" r="5"/>`;
      if (k.nom) s += `<text class="lbl" x="${x + (k.gauche ? -8 : 8)}" y="${y - 8}" text-anchor="${k.gauche ? "end" : "start"}">${k.nom}</text>`;

/* ---------- scènes animées ---------- */
const stages = [];
function buildStage(anim) {
  const wrap = el("div", { class: "stage" });
  const cv = el("canvas", { role: "img", "aria-label": anim.alt || "Animation" }); wrap.append(cv);
  const btn = el("button", { class: "play", type: "button" }); wrap.append(btn);
  const st = { cv, anim, visible: true, playing: !reduceMotion, t0: performance.now(), tPause: reduceMotion ? (anim.still || 5) : 0 };
  btn.textContent = st.playing ? "Pause" : "Lecture";
  btn.addEventListener("click", () => {
    st.playing = !st.playing;
    if (st.playing) st.t0 = performance.now() - st.tPause * 1000;
    btn.textContent = st.playing ? "Pause" : "Lecture";
  });
  stages.push(st);
  new IntersectionObserver(es => es.forEach(e => st.visible = e.isIntersecting)).observe(wrap);
  return wrap;
}
function frame(now) {
  stages.forEach(st => {
    if (!st.cv.isConnected || (!st.visible && st.drawn)) return;
    if (!st.playing && st.drawn && st.drawnW === st.cv.clientWidth) return;
    const w = st.cv.clientWidth || 400, h = Math.round(w * st.anim.ratio), dpr = Math.min(2, devicePixelRatio || 1);
    if (st.cv.width !== Math.round(w * dpr)) { st.cv.width = Math.round(w * dpr); st.cv.height = Math.round(h * dpr); st.cv.style.height = h + "px"; }
    const t = Math.max(0, st.playing ? (now - st.t0) / 1000 : st.tPause);
    if (st.playing) st.tPause = t;
    const ctx = st.cv.getContext("2d");
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, w, h);
    D._q = [];
    try { st.anim.draw(ctx, t, w, h); D.flushText(ctx); } catch (err) { console.error(err); st.playing = false; D._q = null; }
    st.drawn = true; st.drawnW = w;
  });
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
/* redessiner les scènes en pause quand le thème change */
function invalidateStages() { stages.forEach(s => s.drawn = false); }
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", invalidateStages);
new MutationObserver(invalidateStages).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });

/* ---------- aides au dessin ---------- */
const D = {
  font(sz = 11, w = 400) { return `${w} ${sz}px 'IBM Plex Mono', ui-monospace, monospace`; },
  /* Texte : pendant une image d'animation, les étiquettes sont mises en file puis dessinées
     ensemble à la fin (flushText) : celles qui se chevauchent sur une même ligne sont réduites,
     et toutes restent dans la largeur du canevas. Hors animation, dessin immédiat. */
  text(ctx, s, x, y, o = {}) {
    const lab = { s: String(s), x, y, size: o.size || 11, color: o.color || C.muted, weight: o.weight || 400, align: o.align || "left", base: o.base || "alphabetic" };
    if (D._q) { lab.alpha = ctx.globalAlpha; lab.tf = ctx.getTransform ? ctx.getTransform() : null; D._q.push(lab); return; }
    D._fit(ctx, [lab]); D._draw(ctx, lab);
  },
  _draw(ctx, l) {
    ctx.fillStyle = l.color; ctx.font = D.font(l.size, l.weight);
    ctx.textAlign = l.align; ctx.textBaseline = l.base; ctx.fillText(l.s, l.x, l.y);
  },
  _fit(ctx, labs) {
    const tr = ctx.getTransform && ctx.getTransform(), dpr = (tr && tr.a) || 1, W = (ctx.canvas && ctx.canvas.width || 0) / dpr;
    const kR = { left: 1, center: .5, right: 0 }, kL = { left: 0, center: .5, right: 1 };
    labs.forEach(l => {   // position en px CSS (translation et échelle simples seulement)
      const m = l.tf, ok = !m || (Math.abs(m.b) < 1e-6 && Math.abs(m.c) < 1e-6);
      l.sc = m && ok ? m.a / dpr : 1; l.ax = m && ok ? (m.a * l.x + m.e) / dpr : l.x; l.ay = m && ok ? (m.d * l.y + m.f) / dpr : l.y; l.free = !ok;
      ctx.font = D.font(l.size, l.weight); l.w = ctx.measureText(l.s).width * l.sc;
    });
    for (let pass = 0; pass < 3; pass++) for (let i = 0; i < labs.length; i++) for (let j = 0; j < labs.length; j++) {
      const a = labs[i], b = labs[j];
      if (i === j || a.free || b.free || a.ax >= b.ax || a.base !== b.base) continue;
      const hgt = Math.min(a.size, b.size) * Math.min(a.sc, b.sc);
      if (Math.abs(a.ay - b.ay) > hgt * .9) continue;
      const room = b.ax - a.ax - 6, need = a.w * kR[a.align] + b.w * kL[b.align];
      if (need <= room || room < 12) continue;
      const f = room / need;
      [a, b].forEach(l => { if (kR[l.align] + kL[l.align] === 0) return; const ns = Math.max(7, l.size * f); l.w *= ns / l.size; l.size = ns; });
    }
    labs.forEach(l => {   // rester dans le canevas
      if (!W || l.free) return;
      const avail = l.align === "left" ? W - l.ax - 4 : l.align === "right" ? l.ax - 4 : 2 * Math.min(l.ax, W - l.ax) - 8;
      if (l.w > avail && avail > 24) { const ns = Math.max(7, l.size * avail / l.w); l.w *= ns / l.size; l.size = ns; }
    });
  },
  flushText(ctx) {
    const q = D._q; D._q = null; if (!q || !q.length) return;
    D._fit(ctx, q);
    const keep = ctx.getTransform && ctx.getTransform(), ga = ctx.globalAlpha;
    q.forEach(l => { if (l.tf) ctx.setTransform(l.tf); ctx.globalAlpha = l.alpha; D._draw(ctx, l); });
    if (keep) ctx.setTransform(keep); ctx.globalAlpha = ga;
  },
  arrow(ctx, x1, y1, x2, y2, color, wdt = 2, head = 7) {
    ctx.strokeStyle = color; ctx.fillStyle = color; ctx.lineWidth = wdt;
    ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
    const a = Math.atan2(y2 - y1, x2 - x1);
    ctx.beginPath(); ctx.moveTo(x2, y2);
    ctx.lineTo(x2 - head * Math.cos(a - 0.45), y2 - head * Math.sin(a - 0.45));
    ctx.lineTo(x2 - head * Math.cos(a + 0.45), y2 - head * Math.sin(a + 0.45)); ctx.closePath(); ctx.fill();
  },
  circle(ctx, x, y, r, fill, stroke, lw = 1) {
    ctx.beginPath(); ctx.arc(x, y, Math.max(0, r), 0, Math.PI * 2);
    if (fill) { ctx.fillStyle = fill; ctx.fill(); }
    if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = lw; ctx.stroke(); }
  },
  rect(ctx, x, y, w, h, fill, stroke, lw = 1) {
    if (fill) { ctx.fillStyle = fill; ctx.fillRect(x, y, w, h); }
    if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = lw; ctx.strokeRect(x, y, w, h); }
  },
  line(ctx, pts, color, lw = 1.5, dash) {
    ctx.strokeStyle = color; ctx.lineWidth = lw; ctx.setLineDash(dash || []);
    ctx.beginPath(); pts.forEach((q, i) => ctx[i ? "lineTo" : "moveTo"](q[0], q[1])); ctx.stroke(); ctx.setLineDash([]);
  },
  poly(ctx, pts, fill, stroke, lw = 1) {
    ctx.beginPath(); pts.forEach((q, i) => ctx[i ? "lineTo" : "moveTo"](q[0], q[1])); ctx.closePath();
    if (fill) { ctx.fillStyle = fill; ctx.fill(); }
    if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = lw; ctx.stroke(); }
  },
  rock(ctx, x, y, r, seed, fill, stroke, angular = 0.25) {
    const rnd = seeded(seed), n = 9, pts = [];
    for (let i = 0; i < n; i++) { const a = i / n * Math.PI * 2 + rnd() * 0.3; const rr = r * (1 - angular / 2 + rnd() * angular); pts.push([x + Math.cos(a) * rr, y + Math.sin(a) * rr]); }
    D.poly(ctx, pts, fill, stroke, 1);
  },
  alpha(ctx, a, fn) { ctx.save(); ctx.globalAlpha = a; fn(); ctx.restore(); },
  legend(ctx, items, x, y, gap = 100) {
    items.forEach(([c, l], i) => { ctx.fillStyle = c; ctx.fillRect(x + i * gap, y - 9, 10, 10); D.text(ctx, l, x + 14 + i * gap, y, { color: C.ink }); });
  },
  /* mini-graphe dans un canvas */
  axes(ctx, x, y, w, h, lx, ly) {
    D.line(ctx, [[x, y], [x, y + h], [x + w, y + h]], C.muted, 1);
    if (ly) D.text(ctx, ly, x - 4, y - 6, { align: "left" });
    if (lx) D.text(ctx, lx, x + w, y + h + 14, { align: "right" });
  }
};
const cyc = (t, T) => (t % T) / T;                 // phase 0→1
const seg = (u, a, b) => clamp((u - a) / (b - a), 0, 1); // sous-phase

/* Barres de plages (utilisées dans plusieurs modules) */

/* Exercice de tri : chaque élément se classe dans une catégorie, correction immédiate */
function triWidget(box, cfg) {
  box.append(el("div", { class: "chart-top" }, `<h3>${cfg.titre}</h3>`));

  const list = el("div", { style: "display:grid;gap:8px" });
  const st = cfg.items.map(() => null);
  cfg.items.forEach((it, i) => {
    const row = el("div", { style: "display:grid;grid-template-columns:minmax(0,1fr);gap:6px;padding:8px 10px;border:1px solid var(--line);border-radius:4px;background:var(--bg)" });
    const lab = el("div", { style: "font-size:.9rem" }, it.nom);
    const seg = el("div", { class: "seg" });
    const fb = el("div", { class: "note", hidden: "" });
    cfg.cats.forEach(c => {
      const b = el("button", { type: "button", "aria-pressed": "false" }, c);
      b.addEventListener("click", () => {
        st[i] = c;
        seg.querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", String(x === b)));
        const ok = c === it.rep;
        fb.hidden = false;
        fb.innerHTML = `<b style="color:var(${ok ? "--sage" : "--alert"})">${ok ? "Exact." : "Non : " + it.rep + "."}</b> ${it.pourquoi || ""}`;
        upd();

      seg.append(b);
    });
    row.append(lab, seg, fb); list.append(row);
  });
  function upd() {
    const done = st.filter(x => x != null).length, good = st.filter((x, i) => x === cfg.items[i].rep).length;
    score.innerHTML = `<span>répondu <b>${done} / ${cfg.items.length}</b></span><span class="${good === done ? "ok" : "bad"}">bonnes réponses <b>${good}</b></span>`;
  }
  const reset = el("button", { class: "btn", type: "button" }, "Recommencer");
  reset.addEventListener("click", () => { box.innerHTML = ""; triWidget(box, cfg); });
  box.append(list, el("div", {}, ""), reset); upd();
}

/* ===================== Sujet 4 — Modes de formation des minéraux ===================== */
const BOWEN = [
  { n: "Olivine", t0: 1250, t1: 1100, serie: "d" },
  { n: "Pyroxène", t0: 1150, t1: 950, serie: "d" },
  { n: "Amphibole", t0: 1000, t1: 800, serie: "d" },
  { n: "Biotite", t0: 900, t1: 700, serie: "d" },
  { n: "Plagioclase calcique → sodique", t0: 1200, t1: 750, serie: "c" },
  { n: "Feldspath potassique", t0: 750, t1: 600, serie: "f" },
  { n: "Muscovite", t0: 720, t1: 600, serie: "f" },
  { n: "Quartz", t0: 700, t1: 600, serie: "f" }
];
const assemblage = T => T > 1100 ? "ultramafique" : T > 950 ? "mafique" : T > 800 ? "intermédiaire" : "felsique";
/* pression de vapeur saturante de l'eau (atm) */
const PV_T = [0.01, 25, 50, 100, 150, 200, 250, 300, 350, 374];
const PV_P = [0.006, 0.031, 0.122, 1, 4.7, 15.3, 39, 84.8, 163, 218];
const pvap = T => Math.pow(10, interp(PV_T, PV_P.map(Math.log10), T));
const psub = T => Math.pow(10, interp([-60, -40, -20, 0.01], [Math.log10(1.07e-5), Math.log10(1.27e-4), Math.log10(1.02e-3), Math.log10(0.006)], T));
const tfus = P => 0.01 - 0.0074 * (P - 0.006);
function etatEau(T, P) {
  if (T >= 374 && P >= 218) return "fluide supercritique";
  if (T < 0.01) {
    if (P < psub(T)) return "vapeur";
    return T < tfus(P) ? "solide (glace)" : "liquide";
  }
  if (T >= 374) return "vapeur";
  return P >= pvap(T) ? "liquide" : "vapeur";
}

/* Diagramme du cycle des roches à compléter : cases A–E (familles) et flèches 1–8 (processus) */
function cycleWidget(box) {
  const N = { A: [300, 30, "Sédiments"], B: [515, 160, "Roches sédimentaires"], C: [440, 350, "Roches métamorphiques"], D: [160, 350, "Magma"], E: [85, 160, "Roches ignées"] };
  const F = [["D", "E", 1, "Cristallisation"], ["E", "A", 2, "Altération et érosion"], ["A", "B", 3, "Diagenèse"], ["B", "C", 4, "Métamorphisme"],
    ["C", "D", 5, "Fusion"], ["E", "C", 6, "Métamorphisme"], ["C", "A", 7, "Altération et érosion"], ["B", "A", 8, "Altération et érosion"]];
  let rep = false;
  box.append(el("div", { class: "chart-top" }, `<div class="titre"><h3>Le cycle des roches à compléter</h3>${badge("cours").outerHTML}</div>`));
  box.append(el("p", { class: "note" }, "Nomme les cases A à E, puis les processus 1 à 8. Vérifie ensuite avec « Afficher les réponses »."));
  const ns = "http://www.w3.org/2000/svg", svg = document.createElementNS(ns, "svg");
  svg.setAttribute("viewBox", "0 0 600 380"); svg.style.fontSize = "16px"; svg.setAttribute("role", "img"); svg.setAttribute("aria-label", "Diagramme du cycle des roches avec cases à compléter");
  const wrap = el("div", { class: "plot" }); wrap.append(svg); box.append(wrap);
  const cle = el("ol", { class: "note", style: "margin:0;padding-left:22px;columns:2 180px" }, F.map(([a, b, n, nom]) => `<li>${nom}</li>`).join(""));
  box.append(cle);
  function draw() {
    let s = `<defs><marker id="pt-cyc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L10,5L0,10z" fill="currentColor"/></marker></defs>`;
    F.forEach(([a, b, n, nom]) => {
      const [x1, y1] = N[a], [x2, y2] = N[b], dx = x2 - x1, dy = y2 - y1, L = Math.hypot(dx, dy), ux = dx / L, uy = dy / L;
      const off = (n === 3 || n === 8) ? -14 : 0, px = -uy * off, py = ux * off, r0 = Math.min(80 / Math.max(Math.abs(ux), 1e-3), 24 / Math.max(Math.abs(uy), 1e-3)) + 6;
      const ax = x1 + ux * r0 + px, ay = y1 + uy * r0 + py, bx = x2 - ux * r0 + px, by = y2 - uy * r0 + py;
      const mx = (ax + bx) / 2 + px * 1.6, my = (ay + by) / 2 + py * 1.6;
      s += `<line x1="${ax.toFixed(1)}" y1="${ay.toFixed(1)}" x2="${bx.toFixed(1)}" y2="${by.toFixed(1)}" style="color:var(--muted)" stroke="currentColor" stroke-width="1.6" marker-end="url(#pt-cyc)"/>`;
      s += `<circle cx="${mx.toFixed(1)}" cy="${my.toFixed(1)}" r="14" fill="var(--surface)" stroke="var(--rebar)" stroke-width="1.5"/><text x="${mx.toFixed(1)}" y="${(my + 6).toFixed(1)}" text-anchor="middle" style="fill:var(--rebar);font-size:17px;font-weight:600">${n}</text>`;
    });
    Object.entries(N).forEach(([k, [x, y, nom]]) => {
      s += `<rect x="${x - 78}" y="${y - 22}" width="156" height="44" rx="5" fill="var(--bg)" stroke="var(--ink)" stroke-width="1.5"/>`;
      s += `<text class="lbl" x="${x}" y="${y + 6}" text-anchor="middle" style="font-size:${rep ? (nom.length > 14 ? 13 : 16) : 22}px;font-weight:600">${rep ? nom : k}</text>`;
    });
    svg.innerHTML = s;
    cle.hidden = !rep;
  }
  const tg = el("button", { class: "btn", type: "button" }, "Afficher les réponses");
  tg.addEventListener("click", () => { rep = !rep; tg.textContent = rep ? "Masquer les réponses" : "Afficher les réponses"; draw(); });
  box.append(tg);
  const b1 = el("div", { style: "display:grid;gap:10px;margin-top:6px" }), b2 = el("div", { style: "display:grid;gap:10px;margin-top:6px" });
  triWidget(b1, { titre: "Les cases", cats: ["Magma", "Roches ignées", "Sédiments", "Roches sédimentaires", "Roches métamorphiques"], items: Object.entries(N).map(([k, v]) => ({ nom: "Case " + k, rep: v[2] })) });
  triWidget(b2, { titre: "Les flèches", cats: ["Cristallisation", "Altération et érosion", "Diagenèse", "Métamorphisme", "Fusion"], items: F.map(([a, b, n, nom]) => ({ nom: `Flèche ${n} : case ${a} → case ${b}`, rep: nom })) });
  box.append(b1, b2);
  draw();
}

function facies(T, P) {
  if (P > 12 + (T - 500) / 60 && T >= 400) return "éclogite";
  if (T < 500 && P > 5 + (T - 200) / 40) return "schiste bleu";
  if (T < 250) return "zéolite";
  if (P < 2 && T >= 350) return "cornéenne (contact)";
  if (T < 500) return "schiste vert";
  if (T < 700) return "amphibolite";
  return "granulite";
}

function drawCarte(ctx, w, h, f, mer, age) {
  D.rect(ctx, 0, 0, w, h, C.veg + "33");
  const sl = x => h * (0.78 - 0.5 * x);
  D.alpha(ctx, 0.8, () => D.poly(ctx, [[w * 0.86, 0], [w, 0], [w, h * 0.5], [w * 0.9, h * 0.4]], C.sea));
  if (f > 0.3) { D.alpha(ctx, 0.75, () => { [[0.12, 0.88, 26], [0.22, 0.8, 18], [0.05, 0.75, 16]].forEach(([x, y, r]) => { ctx.beginPath(); ctx.ellipse(w * x, h * y, r * 1.6, r * 0.7, -0.3, 0, Math.PI * 2); ctx.fillStyle = C.water; ctx.fill(); }); }); }
  if (mer > 0) { D.alpha(ctx, 0.75 * Math.min(1, mer), () => { const pts = []; for (let i = 0; i <= 20; i++) { const x = 0.3 + i / 20 * 0.6; pts.push([w * x, sl(x) - 16 * Math.min(1, mer)]); } for (let i = 20; i >= 0; i--) { const x = 0.3 + i / 20 * 0.6; pts.push([w * x, sl(x) + 16 * Math.min(1, mer)]); } D.poly(ctx, pts, C.sea); }); if (mer >= 2) D.alpha(ctx, 0.75, () => D.poly(ctx, [[w * 0.66, sl(0.66) - 6], [w * 0.6, h * 0.28], [w * 0.52, h * 0.26], [w * 0.55, h * 0.32], [w * 0.62, sl(0.62) - 8]], C.sea)); }
  else if (f > 0.85) D.line(ctx, range(0.3, 0.9, 20).map(x => [w * x, sl(x)]), C.sea, 3);
  if (f < 1.1) { ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(w, 0); for (let i = 20; i >= 0; i--) { const x = i / 20; ctx.lineTo(x * w, h * (1 - f) + Math.sin(i * 1.3) * 6 - x * h * 0.08); } ctx.closePath(); ctx.fillStyle = C.ice; ctx.fill(); ctx.strokeStyle = C.sea; ctx.lineWidth = 1; ctx.stroke(); }
  D.text(ctx, "il y a " + fr(age, 1).replace(",0", "") + " ka", 10, h - 10, { color: C.ink, weight: 500, size: 12 });
  if (mer >= 1) D.text(ctx, mer >= 2 ? "mer de Champlain + golfe de Laflamme" : "mer de Champlain", w * 0.6, sl(0.6) + 32, { align: "center", size: 10, color: C.ink, weight: 500 });
  if (w > 520) D.text(ctx, "schéma : glace en bleu pâle, eaux salées en bleu", w - 8, h - 10, { align: "right", size: 9.5 });
}

/* ---------- confiance × justesse ---------- */
const CONF = ["Je devine", "Pas sûr", "Sûr"];

const SEUIL_SUR = COURSE.seuilSur || 70;

  const qs = quizOf(mod, i), k = Math.max(0, qs.findIndex(q => q.o));
  return qs[k] ? { q: qs[k], id: `${mod.id}:${i}:${k}`, mod, sec: i } : null;
}

/* ---------- une question : réponse, puis confiance, puis correction ---------- */
/* Types de questions : à choix { o, r } (r = tableau → « cochez la ou les réponses exactes »), vrai/faux par énoncé { vf },
   association { a }, rappel { e seul }. L'étiquette « une seule réponse » n'apparaît que si le cours a aussi des choix multiples. */
let avecMulti = null;
const aDesMulti = () => avecMulti != null ? avecMulti : (avecMulti = allQuestions().some(x => Array.isArray(x.q.r) || (x.q.vf && x.q.forme && x.q.forme !== "vrai")) || Object.values(DIAG).some(m => Object.values(m).some(d => Array.isArray(d.r))));
/* Série d'énoncés { vf, forme } posée comme le prof : forme "faux" → « le(s)quel(s) est (sont) faux ? » (choix multiple) ;
   forme "vrai" → « lequel est vrai ? » (un vrai tiré au hasard parmi les vrais + tous les faux, réponse unique) ;
   forme "vrais" → « le(s)quel(s) est (sont) vrai(s) ? » (choix multiple). Sans forme : boutons V/F énoncé par énoncé. */
function vfEnChoix(q) {
  const L = q.vf.map(([t, v, pq]) => ({ t, v: !!v, pq: pq ? pq.charAt(0).toUpperCase() + pq.slice(1) : "" }));
  const sujet = q.q ? q.q + " : d" : "D";
  if (q.forme === "vrai") {
    const vrais = L.filter(x => x.v), un = vrais[Math.floor(Math.random() * vrais.length)];
    const o = [un, ...L.filter(x => !x.v)];
    return Object.assign({}, q, { vf: null, q: `${sujet}ans les énoncés suivants, <b>lequel est vrai</b> ?`, o: o.map(x => x.t), r: 0, oe: o.map(x => x.pq) });
  }
  const cherche = q.forme === "faux" ? false : true;
  return Object.assign({}, q, { vf: null, q: `${sujet}ans les énoncés suivants, <b>${cherche ? "le(s)quel(s) est (sont) vrai(s)" : "le(s)quel(s) est (sont) faux"}</b> ?`,
    o: L.map(x => x.t), r: L.map((x, j) => x.v === cherche ? j : -1).filter(j => j >= 0), oe: L.map(x => x.pq), cible: cherche ? "vrai" : "faux" });
}
function questionEl(item, onDone) {

        if (!row) { row = confRow(valider); box.insertBefore(row, fb); }

    function valider(p, r) {

      opts.querySelectorAll("button").forEach(x => { x.disabled = true; x.classList.remove("pick"); if (+x.dataset.j === q.r) x.classList.add("good"); if (+x.dataset.j === choix && !ok) x.classList.add("bad");

      fb.innerHTML = `${verdict(ok, p)}<b class="${ok ? "ok" : "no"}">${ok ? "Exact." : "Non."}</b> ${q.e || ""}${piege}<span class="note"> · Confiance : ${p} % (${confMot(p)})</span>`;
      record(ok, p);
    }
    box.append(opts, fb);
  } else if (q.vf) {
    /* vrai ou faux par énoncé : { vf: [[énoncé, true|false, "pourquoi (facultatif)"], …] } ; juste si chaque énoncé est bien jugé */
    const lignes = q.vf.map(([t, v, pq]) => ({ t, v: !!v, pq }));
    if (!q.fixe) lignes.sort(() => Math.random() - .5);
    const liste = el("div", { class: "q-vf-liste" }), choix = lignes.map(() => null);
    let row = null;
    lignes.forEach((L, k) => {
      const li = el("div", { class: "q-vfl" }, `<span class="q-vf-t">${L.t}</span>`);
      const seg = el("div", { class: "q-vf-b", role: "group", "aria-label": "Vrai ou faux" });
      [["V", true, "Vrai"], ["F", false, "Faux"]].forEach(([lab, v, titre]) => {
        const b = el("button", { type: "button", title: titre, "aria-label": titre, "data-v": v ? "1" : "0" }, lab);

        });
        seg.append(b);
      });
      li.append(seg); liste.append(li);
    });
    function valider(p, r) {
      r.remove();
      let n = 0;
      [...liste.children].forEach((li, k) => {
        const L = lignes[k], bon = choix[k] === L.v;
        if (bon) n++;
        li.classList.add(bon ? "good" : "bad");
        li.querySelectorAll("button").forEach(x => { x.disabled = true; if ((x.dataset.v === "1") === L.v) x.classList.add("juste"); });
        li.append(el("span", { class: "q-corr" }, `${bon ? "✓" : "✗"} ${L.v ? "Vrai" : "Faux"}${L.pq ? " : " + L.pq : "."}`));
      });
      const ok = n === lignes.length;
      fb.hidden = false;
      fb.innerHTML = `${verdict(ok, p)}<b class="${ok ? "ok" : "no"}">${n} / ${lignes.length} énoncés bien jugés.</b> ${q.e || ""}<span class="note"> · Confiance : ${p} % (${confMot(p)})</span>`;

  } else if (q.a) {

    const reps = [...new Set([...q.a.map(x => x[1]), ...(q.x || [])])].sort((a, b) => a.localeCompare(b, "fr", { numeric: true }));
    const tab = el("div", { class: "q-assoc" });
    let row = null;
    const sels = lignes.map(L => {
      const sid = "as-" + (++uid), li = el("div", { class: "q-paire" }, `<label for="${sid}">${L.g}</label>`);
      const s = el("select", { id: sid });

    function valider(p, r) {
      r.remove();
      let n = 0;
      lignes.forEach((L, k) => {
        const s = sels[k], bon = s.value === L.d, li = s.parentNode;

        if (!bon) { const c = el("span", { class: "q-corr" }); c.textContent = "→ " + L.d; li.append(c); }
      });
      const memoire = rappel ? rappel() : null, ok = n === lignes.length && (!memoire || memoire.n === memoire.N);
      fb.hidden = false;
      fb.innerHTML = `${verdict(ok, p)}${memoire ? `<b class="${memoire.n === memoire.N ? "ok" : "no"}">De mémoire : ${memoire.n} / ${memoire.N}.</b> ` : ""}<b class="${n === lignes.length ? "ok" : "no"}">${n} / ${lignes.length} bonnes associations.</b> ${q.e || ""}<span class="note"> · Confiance : ${p} % (${confMot(p)})</span>`;
      record(ok, p);
    }
    const partieAssoc = [el("p", { class: "q-consigne" }, TXT.assocConsigne), tab];
    let rappel = null;
    if (q.liste) {
      /* liste de mémoire d'abord : { liste: { q, items: ["Nom" | ["Nom", "mot-clé", …]] } } ; l'association n'apparaît qu'après */
      const norm = t => t.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
      const items = q.liste.items.map(it => { const [nom, ...cles] = [].concat(it); return { nom, cles: (cles.length ? cles : [nom]).map(norm) }; });
      const ecrit = el("textarea", { class: "q-ecrit", rows: Math.min(items.length, 5), placeholder: TXT.listePlace, "aria-label": "Ta liste" });
      const insiste = el("p", { class: "q-insiste", hidden: "" }, TXT.rappelInsiste.replace("« Voir la réponse »", "« Vérifier ma liste »"));
      const go = el("button", { type: "button", class: "conf-ok q-liste-ok" }, "Vérifier ma liste");
      const etape1 = el("div", { class: "q-liste" });
      etape1.append(el("p", { class: "q-consigne" }, TXT.listeConsigne), ecrit, insiste, go);
      let averti = false;

        if (!ecrit.value.trim() && !averti && COURSE.rappelInsiste !== false) { averti = true; insiste.hidden = false; ecrit.focus(); return; }
        const txt = norm(ecrit.value);
        insiste.remove(); go.remove(); ecrit.readOnly = true;
        const ul = el("ul", { class: "q-liste-res" });
        const etats = items.map(it => it.cles.some(c => new RegExp("(^|[^a-z0-9])" + c.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")).test(txt)));   // mot-clé en début de mot
        const compte = el("b");
        const maj = () => { const n = etats.filter(Boolean).length; compte.className = n === items.length ? "ok" : "no"; compte.textContent = `De mémoire : ${n} / ${items.length}`; };
        items.forEach((it, k) => {
          const b = el("button", { type: "button", class: "q-item" });
          const peint = () => { b.className = "q-item " + (etats[k] ? "good" : "bad"); b.textContent = (etats[k] ? "✓ " : "✗ ") + it.nom; };
          b.addEventListener("click", () => { if (!rappel || !fb.hidden) return; etats[k] = !etats[k]; peint(); maj(); });
          peint(); const li = el("li"); li.append(b); ul.append(li);

        etape1.append(el("div", { class: "q-liste-bilan" }), ul, el("p", { class: "note" }, TXT.listeNote));
        etape1.querySelector(".q-liste-bilan").append(compte);
        partieAssoc[0].textContent = TXT.assocApres;
        box.insertBefore(el("div", { class: "q-text" }, q.q), fb);
        partieAssoc.forEach(x => box.insertBefore(x, fb));
      });
      box.append(etape1, fb);
    } else box.append(...partieAssoc, fb);
  } else {
    /* rappel libre : formuler une réponse (même une supposition), confiance, réponse, puis auto-évaluation */
    const ecrit = el("textarea", { class: "q-ecrit", rows: 2, placeholder: TXT.rappelPlace, "aria-label": "Ta réponse" });
    const insiste = el("p", { class: "q-insiste", hidden: "" }, TXT.rappelInsiste);
    let averti = false;
    const row = confRow((c, r) => {
      if (!ecrit.value.trim() && !averti && COURSE.rappelInsiste !== false) { averti = true; insiste.hidden = false; ecrit.focus(); return; }
      insiste.remove(); r.remove(); ecrit.readOnly = true;
      if (!ecrit.value.trim()) ecrit.remove();
      fb.hidden = false; fb.innerHTML = `<span class="q-corrige">Réponse attendue</span>` + q.e + `<span class="note"> · Confiance : ${c} %</span>`;
      const ev = el("div", { class: "q-row" });
      const y = el("button", { class: "btn", type: "button" }, "Je le savais"), n = el("button", { class: "btn", type: "button" }, "Je ne le savais pas");
      const fin = ok => { record(ok, c); ev.innerHTML = verdict(ok, c); };
      y.addEventListener("click", () => fin(true)); n.addEventListener("click", () => fin(false));
      ev.append(y, n); box.append(ev);

  }

}

/* ---------- quiz diagnostique en tête de sujet ---------- */
function diagPanel(mod, secs, onFin) {
  if (COURSE.diagnostic === false) return null;      // diagnostic désactivé pour ce cours
  const items = mod.sections.map((s, i) => s.niveau === "survol" ? null : diagOf(mod, i)).filter(Boolean);
  if (!items.length) return null;
  const box = el("div", { class: "diag" });
  const accueil = () => {
    box.innerHTML = "";
    box.append(el("h3", {}, "Quiz diagnostique"),
      el("p", {}, `Avant d'étudier : ${items.length} question${items.length > 1 ? "s" : ""}, une par notion. Pour chacune, dis aussi à quel point tu es sûr. On verra ensuite par où commencer.`
        + (COURSE.diagAvant ? " Le contenu du sujet s'affiche une fois le diagnostic terminé ou passé." : "")));
    const row = el("div", { class: "q-row" });
    const go1 = el("button", { class: "action", type: "button" }, "Commencer"), skip = el("button", { class: "btn", type: "button" }, "Passer");
    go1.addEventListener("click", () => questionN(0));
    skip.addEventListener("click", () => { diagFait[mod.id] = "passe"; saveDiag(); bilan(); });
    row.append(go1, skip); box.append(row);
  };
  const questionN = k => {
    box.innerHTML = "";
    const it = items[k];
    box.append(el("span", { class: "eyebrow" }, `Diagnostic · ${k + 1} / ${items.length} · ${mod.sections[it.sec].titre}`));
    const next = el("button", { class: "action", type: "button", hidden: "" }, k + 1 < items.length ? "Suivante →" : "Voir mon bilan");
    next.addEventListener("click", () => k + 1 < items.length ? questionN(k + 1) : (diagFait[mod.id] = "fait", saveDiag(), bilan()));
    box.append(questionEl(it, () => { next.hidden = false; refreshEtats(mod); }), next);
  };
  const bilan = () => {
    if (onFin) onFin();
    box.innerHTML = "";
    const evals = mod.sections.map((s, i) => ({ i, s, e: etatNotion(mod, i) }));
    const vus = evals.filter(x => x.e);
    box.append(el("h3", {}, vus.length ? "Ton bilan pour ce sujet" : "Diagnostic passé"));
    if (vus.length) {
      const ordre = evals.slice().sort((a, b) => poidsNiv(mod, a.i) - poidsNiv(mod, b.i) || (a.e ? ETATS[a.e].rang : 1.5) - (b.e ? ETATS[b.e].rang : 1.5) || a.i - b.i);
      const prem = ordre.find(x => x.e !== "vert");
      box.append(el("p", { class: "note" }, prem ? (avecNiveaux() ? "Étudie dans cet ordre : les notions d'examen d'abord (idées à corriger, puis lacunes, puis ce qui est fragile), le survol à la fin." : "Étudie dans cet ordre : les idées à corriger d'abord, puis les lacunes, puis ce qui est fragile.") : "Tout est juste et sûr. Survole les notions et fais les Teste-toi pour confirmer."));
      const ul = el("ul", { class: "diag-list" });
      ordre.forEach(x => {
        const li = el("li"); li.innerHTML = dot(x.e);
        const a = el("button", { class: "link", type: "button" }, `${x.i + 1}. ${x.s.titre} ${x.s.niveau ? NIVEAUX[x.s.niveau].ic : ""}`);
        a.addEventListener("click", () => secs[x.i].scrollIntoView({ behavior: reduceMotion ? "auto" : "smooth" }));
        li.append(a, el("small", {}, x.e ? ETATS[x.e].label : "pas évalué")); ul.append(li);
      });
      box.append(ul);
      if (prem) { const b = el("button", { class: "action", type: "button" }, `Commencer par : ${prem.s.titre} →`); b.addEventListener("click", () => secs[prem.i].scrollIntoView({ behavior: reduceMotion ? "auto" : "smooth" })); box.append(b); }
    } else box.append(el("p", { class: "note" }, "Les pastilles apparaîtront au fil de tes réponses aux Teste-toi."));
    const redo = el("button", { class: "link", type: "button" }, "Refaire le diagnostic");
    redo.addEventListener("click", () => questionN(0));
    box.append(legendeEtats(), redo);
  };
  diagFait[mod.id] ? bilan() : accueil();
  return box;
}

/* ---------- calibration : la confiance est-elle justifiée ? ---------- */
function calibration() {
  const rep = Object.values(conf).filter(x => x && x.ok != null);
  if (rep.length < 8) return null;
  const moy = Math.round(rep.reduce((a, x) => a + pctDe(x), 0) / rep.length), reussi = Math.round(100 * rep.filter(x => x.ok).length / rep.length);
  const sur = rep.filter(x => pctDe(x) >= SEUIL_SUR), ecart = moy - reussi;
  let txt = `Confiance moyenne <b>${moy} %</b>, réussite réelle <b>${reussi} %</b> (${rep.length} réponses).`;
  txt += ecart > 10 ? " Tu te surestimes : reprends en priorité les idées à corriger (faux, mais confiance élevée)." : ecart < -10 ? " Tu te sous-estimes : tu en sais plus que tu le crois." : " Ta confiance est bien calibrée.";
  if (sur.length >= 5) txt += ` Quand tu te dis sûr (≥ ${SEUIL_SUR} %), tu as raison ${Math.round(100 * sur.filter(x => x.ok).length / sur.length)} % du temps.`;
  return el("p", { class: "calib" }, txt);
}

    if (s.prof) sec.append(el("div", { class: "prof" }, `<span class="lab">${TXT.prof}</span>${s.prof}`));
    if (s.examen) sec.append(el("div", { class: "exam" }, `<span class="lab">${TXT.examen}</span>${s.examen}`));
    if (s.ajout) sec.append(el("p", { class: "note ajout" }, TXT.ajout));
    const duo = el("div", { class: "duo" });
    const text = el("div", { class: "text" });
    s.texte.slice(0, 2).forEach(t => text.append(el("p", {}, t)));
    const plus = (s.texte.slice(2)).concat(s.plus || []);
    if (s.cle) text.append(el("div", { class: "key" }, `<b>${s.cle.label}</b>${s.cle.html}`));
    if (plus.length) { const d = el("details", { class: "plus" }); d.append(el("summary", {}, "Pour aller plus loin")); plus.forEach(t => d.append(el("p", {}, t))); text.append(d); }
    if (s.anim) duo.append(buildStage(s.anim)); else duo.style.gridTemplateColumns = "1fr";
    duo.append(text);
    sec.append(duo);
    if (s.graphique) sec.append(buildChart(s.graphique));
    if (s.widget) { const w = el("div", { class: "chart" }); s.widget(w); sec.append(w); }
    const tb = testBlock(mod, i); if (tb) sec.append(tb);
    app.append(sec); secs.push(sec); contenu.push(sec);
    const b = el("button", { type: "button", class: s.niveau ? "t-" + s.niveau : "" }, `<span class="dot${e0 ? " s-" + e0 : ""}" data-etat="${i}"></span>${i + 1}. ${s.titre}${s.niveau && s.niveau !== "utile" ? " " + NIVEAUX[s.niveau].ic : ""}`);
    b.addEventListener("click", () => sec.scrollIntoView({ behavior: reduceMotion ? "auto" : "smooth" }));
    toc.append(b);
  });
  if (MODULES[idx + 1]) {
    const nx = el("div", { class: "next" });
    const b = el("button", { type: "button" }, `Sujet ${idx + 2} : ${MODULES[idx + 1].titre} →`);
    b.addEventListener("click", () => go(MODULES[idx + 1].id));
    nx.append(b); app.append(nx); contenu.push(nx);
  }
  if (cible != null && secs[cible]) { requestAnimationFrame(() => secs[cible].scrollIntoView()); return; }   // arrivée depuis la liste du prof : contenu visible
  if (COURSE.diagAvant && dp && !diagFait[mod.id]) contenu.forEach(x => x.hidden = true);
  scrollTo(0, 0);
}

/* ---------- fiche de synthèse ---------- */
function renderFiche() {
  stages.length = 0;
  app.innerHTML = "";
  const back = el("button", { class: "link", type: "button" }, "← Tous les sujets");
  back.addEventListener("click", () => go(""));
  const bar = el("div", { class: "topbar" }); bar.append(back);
  const head = el("header", { class: "masthead" });
  head.append(el("span", { class: "eyebrow" }, `${COURSE.code} · fiche de synthèse`), el("h1", {}, "L'essentiel à retenir"),
    el("p", {}, "Les formules, les seuils et les chiffres du cours sur une seule page. Relis-la la veille de l'examen."));
  if (COURSE.fiche.some(b => b.items.some(x => x[2]))) head.append(el("p", { class: "note" }, TXT.ficheLegende));
  const grid = el("div", { class: "fiche" });
  COURSE.fiche.forEach(b => {
    const bloc = el("div", { class: "fiche-bloc" });
    bloc.append(el("h3", {}, b.titre));
    const dl = el("dl");
    b.items.forEach(([k, v, n]) => { dl.append(el("dt", { class: n ? "f-" + n : "" }, k + (n ? " " + NIVEAUX[n].ic : "")), el("dd", { class: n ? "f-" + n : "" }, v)); });
    bloc.append(dl); grid.append(bloc);
  });
  ton(null); decor("page", head, "fiche");
  app.append(bar, head, grid);
  scrollTo(0, 0);
}

/* ---------- liste d'examen du prof ---------- */
const cibles = it => (it.cible ? (Array.isArray(it.cible[0]) ? it.cible : [it.cible]) : []).map(([id, i]) => ({ mod: MODULES.find(m => m.id === id), i })).filter(x => x.mod && x.mod.sections[x.i]);
function renderExamen() {
  stages.length = 0;
  app.innerHTML = "";
  const back = el("button", { class: "link", type: "button" }, "← Tous les sujets");
  back.addEventListener("click", () => go(""));
  const bar = el("div", { class: "topbar" }); bar.append(back);
  const head = el("header", { class: "masthead" });
  const tous = COURSE.examen.flatMap(b => b.items), avec = tous.filter(it => cibles(it).length);
  const etatItem = it => { const es = cibles(it).map(c => etatNotion(c.mod, c.i)); return es.some(e => !e) ? null : es.reduce((a, e) => ETATS[e].rang < ETATS[a].rang ? e : a, "vert"); };
  const nv = avec.filter(it => etatItem(it) === "vert").length;
  head.append(el("span", { class: "eyebrow" }, `${COURSE.code} · ${TXT.listeEyebrow}`), el("h1", {}, TXT.listeTitre),
    el("p", {}, COURSE.examenIntro || TXT.listeIntro),
    el("span", { class: "progress" }, `<b>${nv}</b> / ${avec.length} points maîtrisés (juste et sûr)`), legendeEtats());
  const grid = el("div", { class: "fiche" });
  COURSE.examen.forEach(b => {
    const bloc = el("div", { class: "fiche-bloc" });
    bloc.append(el("h3", {}, b.titre));
    const ul = el("ul", { class: "diag-list exam-list" });
    b.items.forEach(it => {
      const li = el("li"), cs = cibles(it), e = cs.length ? etatItem(it) : null;
      li.innerHTML = cs.length ? dot(e) : `<span class="dot" style="visibility:hidden"></span>`;
      const corps = el("div", { class: "exam-item" }, `<span>${it.t}</span>` + (it.sous ? `<span class="note">${it.sous.join(" · ")}</span>` : "") + (it.note ? `<span class="exam-note">${it.note}</span>` : ""));
      const liens = el("span", { class: "exam-liens" });
      cs.forEach(c => { const a = el("button", { class: "link", type: "button" }, `→ ${MODULES.indexOf(c.mod) + 1}.${c.i + 1} ${c.mod.sections[c.i].titre}`); a.addEventListener("click", () => go(`${c.mod.id}/${c.i}`)); liens.append(a); });
      corps.append(liens); li.append(corps); ul.append(li);
    });
    bloc.append(ul); grid.append(bloc);
  });
  ton(null); decor("page", head, "examen");
  app.append(bar, head, grid);
  scrollTo(0, 0);
}

/* ---------- quiz aléatoire ---------- */
function shuffle(a, seed) { const r = seeded(seed); const b = a.slice(); for (let i = b.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [b[i], b[j]] = [b[j], b[i]]; } return b; }
function renderQuiz() {
  stages.length = 0;
  app.innerHTML = "";
  const back = el("button", { class: "link", type: "button" }, "← Tous les sujets");
  back.addEventListener("click", () => go(""));
  const bar = el("div", { class: "topbar" }); bar.append(back);
  const head = el("header", { class: "masthead" });
  head.append(el("span", { class: "eyebrow" }, `${COURSE.code} · quiz aléatoire`), el("h1", {}, "Quiz aléatoire"),
    el("p", {}, "Des questions tirées de tous les sujets, une à la fois. « À travailler » reprend d'abord tes idées à corriger, puis tes lacunes, puis ce qui est fragile."));
  const page = el("div", { class: "quiz-page" });
  const p = {}, ctrls = el("div", { class: "ctrls" });
  const opts = [{ v: "tout", label: "Tout" }].concat(avecNiveaux() ? [{ v: "examen", label: TXT.liste }] : []).concat(PARTIES.map(x => ({ v: x.id, label: x.titre.split("·")[0].trim() || x.titre }))).concat([{ v: "travail", label: "À travailler" }]);
  buildControls([{ id: "f", label: "Questions", type: "choix", value: "tout", options: opts }, { id: "n", label: "Nombre", type: "choix", value: 15, options: [10, 15, 25].map(v => ({ v, label: String(v) })) }], p, start, ctrls);
  const meta = el("div", { class: "quiz-meta" }), zone = el("div", {});
  page.append(ctrls, meta, zone);
  ton(null); decor("page", head, "quiz");
  app.append(bar, head, page);
  let list = [], k = 0, ok = 0, missed = [];
  function start() {
    const rang = x => { const e = etatNotion(x.mod, x.sec); return e && e !== "vert" ? ETATS[e].rang : results[x.id] === false ? 1 : 9; };
    const pool = allQuestions().filter(x => p.f === "tout" ? true : p.f === "examen" ? nivDe(x.mod, x.sec) === "examen" : p.f === "travail" ? rang(x) < 9 && nivDe(x.mod, x.sec) !== "survol" : x.mod.partie === p.f);
    list = shuffle(pool, Date.now() % 100000 + 1);
    if (p.f === "travail") list.sort((a, b) => poidsNiv(a.mod, a.sec) - poidsNiv(b.mod, b.sec) || rang(a) - rang(b));   // tri stable : priorité, puis hasard
    list = list.slice(0, p.n); k = 0; ok = 0; missed = [];
    show();
  }
  function show() {
    zone.innerHTML = "";
    if (!list.length) { meta.innerHTML = ""; zone.append(el("p", { class: "note" }, p.f === "travail" ? "Rien à travailler pour l'instant. Bravo, ou fais d'abord le diagnostic d'un sujet." : "Aucune question pour ce choix.")); return; }
    if (k >= list.length) {
      meta.innerHTML = `<span>Terminé : <b>${ok} / ${list.length}</b> (${Math.round(100 * ok / list.length)} %)</span>`;
      if (missed.length) { zone.append(el("p", { class: "q-text" }, "À revoir :")); const ul = el("ul"); missed.forEach(x => { const li = el("li"); const a = el("button", { class: "link", type: "button" }, `${x.mod.titre} › ${x.mod.sections[x.sec].titre}`); a.addEventListener("click", () => go(x.mod.id)); li.append(a); ul.append(li); }); zone.append(ul); }
      const again = el("button", { class: "action", type: "button" }, "Nouveau tirage"); again.addEventListener("click", start); zone.append(again);
      return;
    }
    const item = list[k];
    meta.innerHTML = `<span>Question <b>${k + 1} / ${list.length}</b></span><span>score <b>${ok}</b></span><span>${item.mod.titre}</span>`;
    const next = el("button", { class: "action", type: "button", hidden: "" }, k + 1 < list.length ? "Suivante →" : "Voir le résultat");
    next.addEventListener("click", () => { k++; show(); });
    zone.append(questionEl(item, good => { if (good) ok++; else missed.push(item); next.hidden = false; meta.querySelector("b:nth-of-type(2)") && (meta.innerHTML = `<span>Question <b>${k + 1} / ${list.length}</b></span><span>score <b>${ok}</b></span><span>${item.mod.titre}</span>`); }), next);
  }
  start();
  scrollTo(0, 0);
}

function go(id) { try { history.replaceState(null, "", id ? "#" + id : location.pathname + location.search); } catch (e) {} route(id); }
function route(id) {
  if (id === "fiche" && COURSE.fiche) return renderFiche();
  if (id === "quiz") return renderQuiz();
  if (id === "examen" && COURSE.examen) return renderExamen();
  const [mid, si] = id.split("/");
  const mod = MODULES.find(m => m.id === mid); mod ? renderModule(mod, si != null && si !== "" ? +si : null) : renderHome();
}
window.addEventListener("hashchange", () => route(location.hash.slice(1)));
route(location.hash.slice(1));

</script>
