<!doctype html>
<html lang="fr-CA">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>GCI-1000 : document indisponible</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{--bg:#eceae5;--surface:#f7f6f3;--ink:#1f2328;--muted:#5d6168;--line:#c9c6bf;--accent:#2f5d8a;color-scheme:light dark}
@media (prefers-color-scheme:dark){:root{--bg:#17191c;--surface:#202327;--ink:#e6e4df;--muted:#a1a5ab;--line:#3a3e44;--accent:#7fb0de}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "IBM Plex Sans",system-ui,sans-serif}
.wrap{max-width:560px;margin:0 auto;padding:64px 16px}
.boite{background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--line);border-radius:8px;padding:24px}
.code{font:700 1.4rem/1 "Barlow Condensed",sans-serif;color:var(--muted)}
h1{font:700 2rem/1.1 "Barlow Condensed",sans-serif;margin:8px 0 12px}
p{margin:0 0 18px;color:var(--muted)}
a{color:var(--accent);font-weight:500}
</style>
</head>
<body>
<div class="wrap"><div class="boite">
<div class="code">GCI-1000 · Matériaux de construction</div>
<h1>Document indisponible</h1>

</div></div>
</body>
</html>
