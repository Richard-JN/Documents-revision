<!doctype html>
<html lang="fr-CA">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Révision GCI-1000</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Mise en page : carnet d'étude — bande d'en-tête, notions empilées (animation | texte), outil interactif pleine largeur, puis « Teste-toi » */
:root{
  --bg:#eceae5; --surface:#f7f6f3; --ink:#1f2328; --muted:#5d6168; --line:#c9c6bf; --steel:#2f5d8a; --rebar:#b4652a; --sage:#4f7d57; --alert:#b23a3a; --water:#9cc3e0; --hydrate:#8a8f96; --grain:#4a4e55; --sand:#c8a96a; --stone:#8d8478; --magma:#c8502e; --ice:#d6e8f0; --sea:#3d7ea6; --veg:#5f8a3c; --clay:#a68a6a;
  --display:"Barlow Condensed","Arial Narrow",sans-serif;
  --body:"IBM Plex Sans",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#17191c;--surface:#202327;--ink:#e6e4df;--muted:#a1a5ab;--line:#3a3e44;--steel:#7fb0de;--rebar:#e0915a;--sage:#82b88a;--alert:#e07070;--water:#2d5674;--hydrate:#8d939b;--grain:#c9ccd1;--sand:#b0925a;--stone:#8a8277;--magma:#f07450;--ice:#3a5763;--sea:#5b9ec6;--veg:#86b45f;--clay:#a88d6d;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#17191c;--surface:#202327;--ink:#e6e4df;--muted:#a1a5ab;--line:#3a3e44;--steel:#7fb0de;--rebar:#e0915a;--sage:#82b88a;--alert:#e07070;--water:#2d5674;--hydrate:#8d939b;--grain:#c9ccd1;--sand:#b0925a;--stone:#8a8277;--magma:#f07450;--ice:#3a5763;--sea:#5b9ec6;--veg:#86b45f;--clay:#a88d6d;color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.6 var(--body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 56px}
.wrap{max-width:1040px;margin:0 auto}
h1,h2,h3{font-family:var(--display);font-weight:600;line-height:1.1;text-wrap:balance;margin:0}
h1{font-size:clamp(2.2rem,6vw,3.4rem);letter-spacing:.01em}
h2{font-size:1.75rem}
h3{font-size:1.25rem}
p{margin:0}
.eyebrow{font:500 .72rem/1.2 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
a{color:var(--steel)}
button,input,select{font:inherit}
:focus-visible{outline:2px solid var(--steel);outline-offset:2px}

.masthead{padding-block:36px 24px;border-bottom:2px solid var(--ink);display:grid;gap:10px}
.masthead p{color:var(--muted);max-width:62ch}
.masthead .src{font:.75rem var(--mono);color:var(--muted)}

/* Accueil */
.part{margin-top:34px;display:grid;gap:14px}
.part-head{display:flex;align-items:baseline;gap:12px;border-bottom:1px solid var(--line);padding-bottom:6px}
.part-head h2{font-size:1.4rem}
.part-head span{font:.75rem var(--mono);color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.card{display:grid;gap:8px;align-content:start;text-align:left;cursor:pointer;position:relative;
  background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:18px;color:var(--ink);transition:border-color .15s,transform .15s}
.card:hover{border-color:var(--steel);transform:translateY(-2px)}
.card .code{font:500 .75rem var(--mono);color:var(--rebar)}
.card h3{font-size:1.4rem}
.card p{color:var(--muted);font-size:.9rem}
.card .meta{font:.72rem var(--mono);color:var(--muted);display:flex;gap:12px;flex-wrap:wrap}
.card .done{position:absolute;top:14px;right:14px;font:500 .68rem var(--mono);color:var(--sage);border:1px solid var(--sage);border-radius:999px;padding:1px 8px}
.progress{font:.8rem var(--mono);color:var(--muted)}
.progress b{color:var(--sage);font-weight:500}

/* Module */
.topbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:24px;flex-wrap:wrap}
.link{background:none;border:0;padding:0;color:var(--steel);cursor:pointer;font:500 .85rem var(--mono)}
.toggle-done{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px 12px;font:.78rem var(--mono);color:var(--ink);cursor:pointer}
.toggle-done[aria-pressed="true"]{border-color:var(--sage);color:var(--sage)}
.toc{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}
.toc button{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-size:.82rem;color:var(--ink);cursor:pointer}
.toc button:hover{border-color:var(--steel)}
.sec{padding-block:40px;border-bottom:1px solid var(--line);display:grid;gap:24px}
.sec-head{display:flex;gap:14px;align-items:baseline}
.sec-num{font:600 2.4rem/1 var(--display);color:var(--rebar);font-variant-numeric:tabular-nums}
.duo{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:28px;align-items:start}
@media (max-width:760px){.duo{grid-template-columns:1fr}}
.stage{background:var(--surface);border:1px solid var(--line);border-radius:4px;overflow:hidden;position:relative;display:grid}
.stage canvas{display:block;width:100%;height:auto}
.stage .play{justify-self:end;margin:0 8px 8px;background:var(--bg);border:1px solid var(--line);border-radius:3px;padding:2px 10px;font:.72rem var(--mono);color:var(--ink);cursor:pointer;opacity:.85}
.text{display:grid;gap:12px;min-width:0}
.text p{max-width:62ch}
.key{border-left:3px solid var(--steel);padding:8px 12px;background:var(--surface);font-size:.9rem}
.key b{display:block;font:500 .7rem var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--steel);margin-bottom:2px}
.key ul{margin:4px 0 0;padding-left:18px}
.formula{font-family:var(--mono);font-size:.86rem}
.next{margin-top:28px;display:flex;justify-content:flex-end}
.next button{background:var(--ink);color:var(--bg);border:0;border-radius:3px;padding:10px 16px;font:500 .9rem var(--body);cursor:pointer}

/* Graphique */
.chart{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:18px;display:grid;gap:14px;min-width:0}
.chart-top{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:baseline}
.chart-top h3{font-size:1.15rem}
.readout{font:.8rem var(--mono);color:var(--ink);font-variant-numeric:tabular-nums;display:flex;gap:6px 14px;flex-wrap:wrap}
.readout span b{color:var(--rebar);font-weight:500}
.readout span.ok b{color:var(--sage)}
.readout span.bad b{color:var(--alert)}
.chart-body{display:grid;grid-template-columns:minmax(0,1fr) 240px;gap:20px}
@media (max-width:720px){.chart-body{grid-template-columns:1fr}}
.plot{min-width:0;position:relative}
.plot svg{width:100%;height:auto;display:block;overflow:visible;touch-action:pan-y}
.ctrls{display:grid;gap:14px;align-content:start;min-width:0}
.ctrl{display:grid;gap:4px}
.ctrl label,.ctrl .lab{font-size:.82rem;display:flex;justify-content:space-between;gap:8px}
.ctrl output{font:.8rem var(--mono);color:var(--steel);font-variant-numeric:tabular-nums;white-space:nowrap}
.ctrl input[type=range]{width:100%;accent-color:var(--steel)}
.seg{display:flex;flex-wrap:wrap;gap:4px}
.seg button{background:var(--bg);border:1px solid var(--line);border-radius:3px;padding:3px 9px;font-size:.78rem;color:var(--ink);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--steel);border-color:var(--steel);color:var(--surface)}
.legend{display:flex;gap:6px 14px;flex-wrap:wrap;font-size:.78rem;color:var(--muted)}
.legend i{display:inline-block;width:18px;height:0;border-top:2.5px solid var(--steel);vertical-align:middle;margin-right:6px}
.legend i.ref{border-top:2px dashed var(--muted)}
.legend i.alt{border-top-color:var(--rebar)}
.legend i.c3{border-top-color:var(--sage)}
.legend i.band{border-top:8px solid var(--steel);opacity:.25}
.note{font-size:.8rem;color:var(--muted);max-width:78ch}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--bg);font:.75rem var(--mono);padding:3px 7px;border-radius:3px;white-space:nowrap;transform:translate(-50%,-130%)}
svg text{fill:var(--muted);font:11px var(--mono)}
svg .ax{stroke:var(--ink);stroke-width:1}
svg .gr{stroke:var(--line);stroke-width:1}
svg .c-main{stroke:var(--steel);stroke-width:2.5;fill:none}
svg .c-alt{stroke:var(--rebar);stroke-width:2.2;fill:none}
svg .c-c3{stroke:var(--sage);stroke-width:2.2;fill:none}
svg .c-ref{stroke:var(--muted);stroke-width:1.5;fill:none;stroke-dasharray:5 4}
svg .area{fill:var(--steel);opacity:.08}
svg .band{fill:var(--steel);opacity:.16}
svg .band-alt{fill:var(--rebar);opacity:.16}
svg .mk{fill:var(--rebar);stroke:var(--surface);stroke-width:2}
svg .mk-line{stroke:var(--rebar);stroke-width:1;stroke-dasharray:3 3}
svg .seuil{stroke:var(--alert);stroke-width:1.2;stroke-dasharray:6 3}
svg .seuil-t{fill:var(--alert);font-size:10.5px}
svg .lbl{fill:var(--ink);font-size:11px}
svg .bar{fill:var(--steel);opacity:.75}
svg .bar-alt{fill:var(--rebar);opacity:.85}
svg .bar-ref{fill:var(--muted);opacity:.35}
svg .bar-c3{fill:var(--sage);opacity:.8}

/* Widgets maison */
.calc-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px}
.steps{display:grid;gap:0;border:1px solid var(--line);border-radius:4px;overflow:hidden}
.step{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:10px;padding:9px 12px;border-top:1px solid var(--line);align-items:baseline;font-size:.88rem}
.step:first-child{border-top:0}
.step .n{font:600 1.1rem var(--display);color:var(--rebar)}
.step .why{color:var(--muted);font-size:.8rem;display:block}
.step .val{font:500 .86rem var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap;text-align:right}
.stack{display:flex;height:34px;border-radius:3px;overflow:hidden;border:1px solid var(--line)}
.stack div{display:grid;place-items:center;font:.68rem var(--mono);color:#fff;min-width:0;overflow:hidden;white-space:nowrap}
.stack-legend{display:flex;flex-wrap:wrap;gap:6px 14px;font:.75rem var(--mono);color:var(--muted)}
.stack-legend i{display:inline-block;width:10px;height:10px;margin-right:5px;vertical-align:-1px;border-radius:2px}
.checks{display:grid;gap:8px}
.checks label{display:flex;gap:10px;align-items:center;font-size:.9rem;cursor:pointer}
.checks input{width:18px;height:18px;accent-color:var(--steel)}
.verdict{font:600 1.3rem var(--display);padding:10px 14px;border-radius:3px;border:1px solid var(--line)}
.verdict.ok{color:var(--sage);border-color:var(--sage)}
.verdict.bad{color:var(--alert);border-color:var(--alert)}
.tbl-wrap{overflow-x:auto}
table.res{border-collapse:collapse;font:.8rem var(--mono);font-variant-numeric:tabular-nums;min-width:100%}
table.res th,table.res td{border-bottom:1px solid var(--line);padding:5px 8px;text-align:right;white-space:nowrap}
table.res th:first-child,table.res td:first-child{text-align:left}
table.res th{font-weight:500;color:var(--muted)}
table.res td.bad{color:var(--alert)}
table.res td.ok{color:var(--sage)}
.btn{background:var(--bg);border:1px solid var(--line);border-radius:3px;padding:5px 12px;font-size:.82rem;color:var(--ink);cursor:pointer}
.btn:hover{border-color:var(--steel)}
@media (max-width:640px){svg text{font-size:12px}}

/* Badges de source des graphiques */
.badge{display:inline-block;font:500 .66rem/1.5 var(--mono);letter-spacing:.06em;text-transform:uppercase;padding:1px 8px;border-radius:999px;border:1px solid currentColor;white-space:nowrap}
.badge.cours{color:var(--sage)}
.badge.calcul{color:var(--steel)}
.badge.modele{color:var(--rebar);border-style:dashed}
.chart-top .titre{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
/* Pour aller plus loin */
details.plus{border-top:1px dashed var(--line);padding-top:8px}
details.plus summary{cursor:pointer;font:500 .8rem var(--mono);color:var(--steel)}
details.plus p{margin-top:8px;font-size:.92rem;color:var(--ink);max-width:62ch}
/* Teste-toi */
.test{border:1px solid var(--line);border-left:4px solid var(--rebar);border-radius:4px;background:var(--surface);padding:14px 16px;display:grid;gap:14px}
.test-head{display:flex;justify-content:space-between;gap:10px;align-items:baseline;flex-wrap:wrap}
.test-head h3{font-size:1.1rem}
.q{display:grid;gap:8px}
.q-text{font-weight:500;font-size:.95rem}
.q-opts{display:grid;gap:6px}
.q-opts button{text-align:left;background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:7px 10px;font-size:.88rem;color:var(--ink);cursor:pointer}
.q-opts button:hover:not(:disabled){border-color:var(--steel)}
.q-opts button.good{border-color:var(--sage);background:color-mix(in srgb,var(--sage) 14%,var(--bg))}
.q-opts button.bad{border-color:var(--alert);background:color-mix(in srgb,var(--alert) 12%,var(--bg))}
.q-opts button:disabled{cursor:default}
.q-fb{font-size:.86rem;color:var(--ink);max-width:70ch}
.q-fb b.ok{color:var(--sage)}
.q-fb b.no{color:var(--alert)}
.q-row{display:flex;gap:8px;flex-wrap:wrap}
/* Accueil : actions et progression */
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}
.action{background:var(--ink);color:var(--bg);border:0;border-radius:3px;padding:9px 14px;font:500 .9rem var(--body);cursor:pointer}
.action.alt{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.card .qprog{font:.72rem var(--mono);color:var(--steel)}
/* Fiche de synthèse */
.fiche{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px;margin-top:24px}
.fiche-bloc{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:14px 16px;display:grid;gap:8px;align-content:start;min-width:0}
.fiche-bloc h3{font-size:1.2rem}
.fiche-bloc dl{display:grid;grid-template-columns:minmax(0,1fr);gap:6px;margin:0}
.fiche-bloc dt{font:500 .72rem var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.fiche-bloc dd{margin:0 0 4px;font-size:.92rem}
/* Quiz aléatoire */
.quiz-page{display:grid;gap:16px;margin-top:20px;max-width:760px}
.quiz-meta{font:.8rem var(--mono);color:var(--muted);display:flex;gap:14px;flex-wrap:wrap}
.quiz-meta b{color:var(--ink);font-weight:500}
[hidden]{display:none!important}
/* Confiance et maîtrise des notions */
.q-opts button.pick{border-color:var(--steel);box-shadow:inset 0 0 0 1px var(--steel)}
.conf{display:grid;gap:6px;max-width:460px;padding:10px 12px;border:1px solid var(--line);border-radius:4px;background:var(--surface)}
.conf > label{font:500 .72rem var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.conf output{font:500 .95rem var(--mono);font-variant-numeric:tabular-nums;color:var(--steel)}
.conf-ligne{display:flex;gap:8px;align-items:center}
.conf-ligne input{flex:1;min-width:0;accent-color:var(--steel)}
.conf-bout{font:.7rem var(--mono);color:var(--muted)}
.conf-ok{justify-self:start;background:var(--ink);color:var(--bg);border:0;border-radius:3px;padding:6px 14px;font:500 .85rem var(--body);cursor:pointer}
.q-fb .piege{display:block;margin-top:6px;padding-left:10px;border-left:2px solid var(--alert);color:var(--muted)}
.q-fb .cas{display:block;font:500 .72rem var(--mono);letter-spacing:.06em;text-transform:uppercase;margin-bottom:2px}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;border:1.5px solid var(--line);vertical-align:-1px;flex:none}
.dot.s-rouge{background:var(--alert);border-color:var(--alert)} .dot.s-orange{background:var(--rebar);border-color:var(--rebar)}
.dot.s-jaune{background:none;border:3px solid var(--sand)} .dot.s-vert{background:var(--sage);border-color:var(--sage)}
.cas.s-rouge,.etat.s-rouge{color:var(--alert);background:none} .cas.s-orange,.etat.s-orange{color:var(--rebar);background:none}
.cas.s-jaune,.etat.s-jaune{color:color-mix(in srgb,var(--sand) 70%,var(--ink));background:none} .cas.s-vert,.etat.s-vert{color:var(--sage);background:none}
.etat{font:500 .7rem var(--mono);letter-spacing:.06em;text-transform:uppercase;border:1px solid currentColor;border-radius:999px;padding:1px 8px;white-space:nowrap;margin-left:auto}
.sec-head{flex-wrap:wrap}
.toc button{display:inline-flex;align-items:center;gap:6px}
.dots{display:flex;gap:4px;flex-wrap:wrap}
.diag{border:1px solid var(--line);border-left:4px solid var(--steel);border-radius:4px;background:var(--surface);padding:14px 16px;display:grid;gap:12px;margin-top:20px}
.diag h3{font-size:1.2rem}
.diag-list{display:grid;gap:6px;margin:0;padding:0;list-style:none}
.diag-list li{display:flex;gap:10px;align-items:center;font-size:.9rem}
.diag-list li .link{text-align:left;font:inherit;font-size:.9rem}
.diag-list li small{color:var(--muted);font:.72rem var(--mono);margin-left:auto;white-space:nowrap}
.calib{font-size:.88rem;color:var(--ink);max-width:70ch;border-left:3px solid var(--steel);padding:6px 12px;background:var(--surface)}
.calib b{font-weight:600}
.legende-etats{display:flex;gap:6px 14px;flex-wrap:wrap;font:.75rem var(--mono);color:var(--muted)}
.legende-etats span{display:inline-flex;gap:6px;align-items:center}
.niv{display:inline-block;vertical-align:middle;margin-left:6px;font:500 .66rem/1.5 var(--mono);letter-spacing:.06em;text-transform:uppercase;padding:1px 8px;border-radius:999px;border:1px solid currentColor;white-space:nowrap}
.niv.n-examen{color:var(--rebar)} .niv.n-utile{color:var(--steel)} .niv.n-survol{color:var(--muted);border-style:dashed}
.sec.survol .sec-num,.sec.survol h2{opacity:.6}
.toc button.t-examen{border-color:color-mix(in srgb,var(--rebar) 55%,var(--line))}
.toc button.t-survol{opacity:.7;border-style:dashed}
.prof{border-left:3px solid var(--alert);padding:8px 12px;background:var(--surface);font-size:.9rem;max-width:78ch}
.prof .lab,.exam .lab{display:block;font:500 .7rem var(--mono);letter-spacing:.1em;text-transform:uppercase;margin-bottom:2px}
.prof .lab{color:var(--alert)}
.exam{border-left:3px solid var(--rebar);padding:8px 12px;background:var(--surface);font-size:.9rem;max-width:78ch}
.exam .lab{color:var(--rebar)}
.prof b,.exam b{font-weight:600}
.exam ul,.prof ul{margin:4px 0 0;padding-left:18px}
.exam table{border-collapse:collapse;font-size:.84rem;margin-top:6px;width:100%}
.exam th,.exam td{border-bottom:1px solid var(--line);padding:4px 6px;text-align:left;vertical-align:top}
.exam th{font:500 .72rem var(--mono);color:var(--muted)}
.note.ajout{color:var(--steel)}
.fiche-bloc dt.f-survol,.fiche-bloc dd.f-survol{opacity:.6}
.fiche-bloc dt.f-examen{color:var(--rebar)}
.exam-list li{align-items:flex-start}
.exam-list li .dot{margin-top:6px}
.exam-item{display:grid;gap:2px;min-width:0}
.exam-note{font-size:.8rem;color:var(--alert)}
.exam-liens{display:flex;flex-wrap:wrap;gap:2px 12px}
.exam-liens .link{font-size:.76rem;text-align:left}
footer{margin-top:40px;color:var(--muted);font-size:.8rem}
@media (prefers-reduced-motion:reduce){.card{transition:none}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
const COURSE = {
  code: "GCI-1000",
  nom: "Matériaux de construction",
  storageKey: "gci1000",
  footer: "Contenu tiré des diapos GCI-1000 (M. Jolin, J.-P. Bilodeau) et du manuel Dosage et contrôle des mélanges de béton (DCMB).",
  parties: [
    { id: "base", titre: "Notions de base" },
    { id: "constituants", titre: "Le béton : constituants" },
    { id: "durci", titre: "Le béton durci" },
    { id: "chantier", titre: "Du chantier au contrôle" },

    0: { q: "Quel constituant occupe le plus grand volume dans un béton ?", o: ["Le ciment", "L'eau", "Les granulats", "La pâte de ciment"], r: 2, e: "Les granulats occupent 60 à 75 % du volume ; la pâte (liant, eau, air) seulement 25 à 40 %.", p: ["On confond souvent « ciment » et « béton », mais le ciment n'est qu'une partie de la pâte.", "L'eau est une petite fraction de la pâte.", null, "La pâte n'occupe que 25 à 40 % : on cherche le maximum de granulats et le minimum de colle."] },
    1: { q: "Un béton frais présente une couche d'eau en surface pendant que les solides tassent. C'est…", o: ["La ségrégation", "Le ressuage", "La prise", "Le retrait"], r: 1, e: "Le ressuage, c'est l'eau qui remonte pendant que les solides se tassent. La ségrégation, c'est la séparation des gros granulats et du mortier.", p: ["La ségrégation concerne les gros granulats qui se séparent du mortier, pas l'eau.", null, "La prise est le raidissement de la pâte ; elle n'expulse pas d'eau.", "Le retrait est une diminution de volume du béton, surtout durci."] },
    2: { q: "Pourquoi arme-t-on le béton avec de l'acier ?", o: ["Pour le rendre plus résistant en compression", "Parce que sa résistance en traction est environ 10 fois plus faible qu'en compression", "Pour réduire son poids", "Pour l'empêcher de geler"], r: 1, e: "fc = 10 à 120 MPa, ft = 1 à 7 MPa : environ un dixième. L'acier reprend la traction.", p: ["Le béton est déjà bon en compression ; c'est la traction qui manque.", null, "L'acier est plus dense que le béton : il alourdit plutôt.", "L'acier ne protège pas du gel ; c'est l'air entraîné et un E/C bas qui le font."] }

  "ciment": {
    0: { q: "Le ciment portland durcit…", o: ["En séchant à l'air, comme de la boue", "En réagissant chimiquement avec l'eau (hydratation)", "En refroidissant après la cuisson", "En absorbant le CO₂ de l'air"], r: 1, e: "C'est un liant hydraulique : il durcit par réaction avec l'eau, même sous l'eau. Le séchage arrête plutôt l'hydratation.", p: ["Idée très répandue, mais un béton qui sèche cesse de gagner de la résistance : d'où la cure humide.", null, "La cuisson donne le clinker ; le durcissement vient plus tard, au contact de l'eau.", "La réaction avec le CO₂, c'est la carbonatation : elle abaisse le pH et menace l'acier, elle ne fait pas durcir le béton."] },
    1: { q: "Quel produit de l'hydratation contribue presque pas à la résistance ?", o: ["Le C-S-H", "La portlandite Ca(OH)₂", "Les deux contribuent également", "Ni l'un ni l'autre : c'est le clinker non hydraté qui résiste"], r: 1, e: "Le C-S-H est la colle. La portlandite est libérée en même temps, mais elle apporte peu ; les pouzzolanes la transforment en C-S-H.", p: ["Le C-S-H est justement « la colle » qui donne la résistance.", null, "Leur rôle est très différent.", "Il reste toujours des grains non hydratés, mais ce ne sont pas eux qui lient le béton."] },
    2: { q: "Pourquoi ajoute-t-on du gypse au clinker ?", o: ["Pour accélérer la prise", "Pour retarder la réaction très rapide du C₃A", "Pour augmenter la résistance à long terme", "Pour colorer le ciment"], r: 1, e: "Le gypse forme de l'ettringite qui ralentit le C₃A. Sans lui, prise éclair ; en excès, expansion après la prise.", p: ["C'est l'effet inverse : sans gypse, la prise serait éclair.", null, "Son rôle est de contrôler la prise, pas la résistance finale.", "Il n'a pas de rôle esthétique."] },
    3: { q: "Avec une cure humide, on passe d'un E/C de 0,60 à 0,40. Les pores capillaires…", o: ["Augmentent, car il y a moins d'eau pour hydrater", "Diminuent et deviennent moins continus", "Ne changent pas : seule la cure compte", "Disparaissent complètement dès 0,40"], r: 1, e: "Moins d'eau par rapport au ciment = moins d'espace vide après l'hydratation. Ils deviennent discontinus plus tôt ; ils disparaissent vers 0,36 avec une cure humide.", p: ["L'eau en trop ne sert pas à hydrater : elle laisse des vides.", null, "La cure compte, mais le E/C est le premier levier de la porosité.", "Le seuil du cours est ≈ 0,36, pas 0,40."] },
    4: { q: "Pour une fondation dans un sol riche en sulfates, quel composé du ciment faut-il limiter ?", o: ["Le C₃S", "Le C₂S", "Le C₃A", "Le gypse"], r: 2, e: "C'est le C₃A qui réagit avec les sulfates pour former des produits expansifs : on choisit MS ou HS, à faible C₃A.", p: ["On limite le C₃S pour réduire la chaleur, pas contre les sulfates.", "Le C₂S réagit lentement et n'est pas le problème des sulfates.", null, "Le gypse est un sulfate ajouté en quantité contrôlée ; c'est le C₃A qui réagit avec les sulfates extérieurs."] },
    5: { q: "Le ciment HE gagne sa résistance plus vite surtout parce qu'il…", o: ["Contient plus de gypse", "Est broyé plus finement", "Contient du laitier", "Se gâche avec plus d'eau"], r: 1, e: "Même chimie que le GU, mais environ 50 % plus fin : plus de surface réactive, hydratation plus rapide, plus de chaleur.", p: ["Le gypse contrôle la prise du C₃A, il n'accélère pas la résistance.", null, "Le laitier réagit plus lentement : il retarderait les gains.", "Plus d'eau = E/C plus élevé = résistance plus faible."] },
    6: { q: "Seule, sans ciment, une pouzzolane mélangée à de l'eau…", o: ["Durcit comme un ciment", "Ne durcit pas : elle a besoin de la portlandite libérée par le ciment", "Durcit plus vite qu'un ciment", "Se dissout"], r: 1, e: "La pouzzolane réagit avec Ca(OH)₂ pour former du C-S-H supplémentaire. Sans ciment, pas de portlandite, pas de réaction.", p: ["Elle fait partie du liant, mais elle n'est pas hydraulique par elle-même.", null, "Les ajouts réagissent plus lentement que le ciment, pas plus vite.", "Elle est siliceuse et stable : elle ne se dissout pas dans l'eau."] },
    7: { q: "Une eau non potable peut-elle servir au gâchage ?", o: ["Jamais", "Oui, si elle respecte des critères de résistance, de temps de prise et de contaminants", "Oui, toujours, le ciment neutralise tout", "Seulement pour du béton non armé, sans essai"], r: 1, e: "Une eau douteuse est acceptable si les cubes atteignent au moins 90 % du témoin à 28 jours, avec temps de prise et contaminants conformes.", p: ["Trop strict : la norme prévoit des critères pour l'accepter.", null, "Les chlorures, sulfates, sucres ou huiles peuvent nuire gravement.", "Il faut quand même les essais ; les chlorures sont surtout dangereux pour l'armature."] }

  "granulats": {
    0: { q: "Le module de finesse d'un sable passe de 2,5 à 3,0. Le sable est devenu…", o: ["Plus fin", "Plus grossier", "Plus propre", "Plus absorbant"], r: 1, e: "Le MF additionne les % cumulatifs retenus : plus il est élevé, plus le granulat est gros. Il doit rester stable (± 0,20).", p: ["Le nom « module de finesse » trompe : un MF élevé veut dire un sable plus gros.", null, "La propreté ne se lit pas dans le MF.", "L'absorption est une autre propriété, mesurée à part."] },
    1: { q: "À masse égale, qu'est-ce qui demande le plus de pâte pour être enrobé ?", o: ["De la pierre de 20 mm", "Du sable fin", "Les deux demandent la même pâte", "Ça dépend seulement de la densité"], r: 1, e: "Surface spécifique S = 6/(ρ·d) : diviser d par 10 multiplie la surface par 10. Plus c'est fin, plus il faut de pâte et d'eau.", p: ["Les gros grains ont beaucoup moins de surface pour la même masse.", null, "La surface à couvrir change énormément avec la taille.", "La densité joue, mais la taille des grains domine."] },
    2: { q: "Des mottes d'argile dans les granulats…", o: ["Améliorent la cohésion du béton", "Nuisent à presque toutes les propriétés", "Sont sans effet si on vibre bien", "Accélèrent la prise"], r: 1, e: "Les mottes d'argile figurent dans le tableau des substances nuisibles : elles touchent presque tous les effets (résistance, gel-dégel, mouillage-séchage…).", p: ["L'argile n'est pas un liant dans le béton : elle crée des points faibles.", null, "La vibration ne règle pas un problème de matériau.", "Ce n'est pas un adjuvant : son effet est nuisible."] },
    3: { q: "Un sable humide a une teneur en humidité de 5 % et une absorption de 1 %. Au moment du dosage, il faut…", o: ["Ajouter de l'eau de gâchage", "Retirer de l'eau de gâchage", "Ne rien changer", "Sécher le sable avant usage"], r: 1, e: "TH > absorption : le sable apporte 4 % d'eau libre. On la retire de l'eau de gâchage, et on pèse plus de sable humide.", p: ["Ce serait le cas si TH < absorption : le granulat boirait de l'eau.", null, "Ignorer l'eau libre augmente le E/C réel.", "Inutile : on corrige par calcul."] }

  "adjuvants": {
    0: { q: "Pour bien protéger un béton du gel, qu'est-ce qui compte le plus ?", o: ["Le volume total d'air, peu importe la taille des bulles", "Des petites bulles rapprochées (facteur d'espacement ≤ 200 µm)", "De grosses bulles bien visibles", "Le moins d'air possible"], r: 1, e: "À volume égal, des bulles plus petites sont plus nombreuses et plus rapprochées : l'eau chassée par la glace trouve une bulle à proximité.", p: ["Le volume compte, mais c'est la distance entre les bulles qui protège.", null, "Les gros vides d'air emprisonné ne protègent pas ; on les chasse à la vibration.", "Sans air entraîné, la pâte saturée fissure au gel."] },
    1: { q: "On ajoute un superplastifiant et on réduit l'eau pour garder la même maniabilité. La résistance…", o: ["Baisse, car l'adjuvant affaiblit la pâte", "Augmente, car le E/C diminue", "Ne change pas", "Baisse, car le béton est plus sec"], r: 1, e: "Même fluidité, moins d'eau : E/C plus bas, pâte moins poreuse, béton plus résistant et plus durable.", p: ["C'est l'air entraîné qui affaiblit la pâte, pas le fluidifiant.", null, "Le E/C change, donc la résistance aussi.", "La maniabilité est la même : c'est justement le but de l'adjuvant."] },
    2: { q: "Comment vérifie-t-on que deux adjuvants sont compatibles avec un ciment ?", o: ["Avec un essai normalisé CSA", "Par des essais ad hoc en laboratoire, puis une validation au chantier", "C'est garanti s'ils viennent du même fournisseur", "Ce n'est jamais un problème"], r: 1, e: "Il n'existe pas d'essai normalisé de compatibilité : essais ad hoc, validation au chantier et expérience.", p: ["Il n'y en a justement pas.", null, "Même fournisseur ne veut pas dire compatible avec ton ciment.", "Les cocktails peuvent gêner l'hydratation ou rater les spécifications."] }

  "proprietes-mecaniques": {
    0: { q: "Quel facteur gouverne d'abord la résistance en compression d'un béton ordinaire ?", o: ["La résistance des granulats", "Le rapport E/C de la pâte", "La quantité de sable", "La couleur du ciment"], r: 1, e: "Dans les bétons ordinaires, la pâte est le maillon faible : le E/C et le degré d'hydratation dominent (loi d'Abrams).", p: ["Les granulats sont généralement plus résistants que la pâte ; ils ne deviennent limitants que dans les BHP.", null, "Le sable influence la maniabilité, mais n'est pas le premier facteur.", "Sans effet sur la résistance."] },
    1: { q: "Quel module représente le mieux le béton pour calculer les déformations en service ?", o: ["Le module tangent à l'origine", "Le module sécant (ASTM C469)", "Le module au pic de la courbe", "Le module de Poisson"], r: 1, e: "La courbe n'a pas de zone linéaire nette ; le module sécant, sur la première moitié, est le plus réaliste.", p: ["Il surestime la rigidité dès que la microfissuration commence.", null, "Au pic, la pente est nulle : ce n'est pas un module utile.", "Le coefficient de Poisson n'est pas un module de rigidité."] },
    2: { q: "Deux bétons ont le même E/C, l'un avec du basalte, l'autre avec du calcaire. Lequel est le plus rigide ?", o: ["Celui au calcaire", "Celui au basalte", "Le même module : c'est le E/C qui décide", "Impossible à dire sans essai de compression"], r: 1, e: "Ec dépend beaucoup des granulats : basalte ≈ 90 GPa, calcaire ≈ 30 GPa. Le module est moins sensible au E/C que la résistance.", p: ["Le calcaire est le moins rigide des trois du cours.", null, "C'est vrai pour la résistance, pas pour le module, très dépendant des granulats.", "La tendance est claire : granulat plus rigide, béton plus rigide."] },
    3: { q: "Un même béton est testé sur un cylindre saturé, puis sur un cylindre partiellement sec. Lequel donne la résistance la plus élevée ?", o: ["Le saturé", "Le partiellement sec", "Les deux donnent la même valeur", "Ça dépend du E/C seulement"], r: 1, e: "Un béton partiellement sec est plus résistant qu'un béton saturé : d'où l'importance des procédures normalisées.", p: ["Contre-intuitif : l'eau dans les pores réduit la résistance mesurée.", null, "L'état hygrométrique change le résultat sans changer le béton.", "L'humidité au moment de l'essai joue aussi."] }

  "changements-volume": {
    0: { q: "Ajouter plus de granulats (et moins de pâte) dans un béton fait quoi au retrait de séchage ?", o: ["Il augmente", "Il diminue", "Il ne change pas", "Il devient un gonflement"], r: 1, e: "Le retrait vient de la pâte. Les granulats ne retirent pas et retiennent la pâte : plus il y en a, moins le béton retire.", p: ["On pense parfois que les granulats « bougent » aussi, mais ils sont stables.", null, "La proportion pâte/granulats est un facteur majeur.", "Les granulats limitent le retrait, ils ne font pas gonfler."] },
    1: { q: "Le fluage est…", o: ["Une déformation instantanée, entièrement réversible", "Une déformation différée sous charge soutenue, partiellement réversible", "Un retrait dû au séchage", "Une rupture brutale"], r: 1, e: "Il s'ajoute à la déformation initiale sous charge maintenue. Au déchargement, on récupère l'élastique tout de suite, puis une partie seulement du fluage.", p: ["Ça, c'est l'élasticité.", null, "Le retrait se produit même sans charge ; le fluage exige une charge soutenue.", "Le fluage est lent et progressif."] }

  "durabilite": {
    0: { q: "Qu'est-ce qui menace l'acier quand le béton se carbonate ?", o: ["Le béton devient trop acide (pH < 4)", "Le pH baisse vers 9 et l'acier perd son film passif", "Le CO₂ attaque directement l'acier", "La carbonatation fait gonfler l'acier"], r: 1, e: "Ca(OH)₂ + CO₂ → CaCO₃ : le pH descend de 12–13 vers 9, et le film de passivation n'est plus stable.", p: ["Le pH baisse, mais vers 9, pas jusqu'à l'acidité.", null, "Le CO₂ réagit avec la portlandite de la pâte, pas avec l'acier.", "C'est la rouille qui gonfle, une fois la corrosion amorcée."] },
    1: { q: "Pourquoi l'eau qui gèle endommage-t-elle le béton ?", o: ["La glace dissout le ciment", "L'eau prend ≈ 9 % de volume en gelant, ce qui crée de la traction dans la pâte", "Le froid rend le béton plus rigide", "La glace absorbe les sels"], r: 1, e: "L'expansion de la glace dans les pores met la pâte en traction : fissuration interne, écaillage, éclatement de granulats.", p: ["Aucune dissolution : c'est un phénomène mécanique.", null, "La rigidité ne cause pas de fissuration en soi.", "Les sels aggravent l'écaillage, mais ne sont pas la cause du gel."] },
    2: { q: "Un béton est fait avec des granulats réactifs aux alcalis. Comment éviter la RAG de façon sûre ?", o: ["Augmenter la vibration", "Supprimer au moins une des trois conditions (granulats réactifs, alcalis élevés, HR > 80 %)", "Ajouter plus d'eau", "Utiliser un ciment HE"], r: 1, e: "La RAG exige les trois conditions simultanément : il suffit d'en retirer une.", p: ["La consolidation ne change pas la chimie.", null, "Plus d'eau augmente l'humidité : c'est pire.", "Le HE n'est pas un ciment pour réduire les alcalis."] },
    3: { q: "Une eau douce (pH 7) qui s'écoule sur un béton…", o: ["Est sans danger, puisqu'elle est neutre", "Peut décalcifier la pâte en dissolvant les hydrates", "Renforce le béton en poursuivant l'hydratation", "Ne pénètre jamais le béton"], r: 1, e: "Une eau douce dissout et lessive les hydrates : porosité accrue, affaiblissement, efflorescences.", p: ["Neutre ne veut pas dire inoffensive : le béton est très alcalin.", null, "La cure humide aide au jeune âge ; une eau qui coule à long terme lessive la pâte.", "L'eau transporte justement les ions dans presque tous les scénarios de détérioration."] }

  "mise-en-oeuvre": {
    0: { q: "Pendant le transport, la toupie du camion qui tourne…", o: ["Malaxe le béton", "Agite le béton pour l'empêcher de se ségréger, ce qui n'est pas un malaxage", "Ajoute de l'air entraîné", "Accélère la prise"], r: 1, e: "Le malaxage (2 à 5 min) rend le béton uniforme. L'agitation pendant le transport le maintient, sans le malaxer.", p: ["Erreur courante : l'agitation lente n'est pas un malaxage.", null, "L'air entraîné vient d'un adjuvant introduit au malaxage.", "La rotation ne change pas la prise."] },
    1: { q: "La vibration du béton frais sert à…", o: ["Éliminer les bulles d'air entraîné", "Expulser l'air emprisonné et bien remplir le coffrage", "Accélérer l'hydratation", "Faire remonter l'eau pour faciliter la finition"], r: 1, e: "La consolidation chasse les gros vides d'air emprisonné (nids d'abeilles), pas les petites bulles d'air entraîné.", p: ["On ne veut surtout pas perdre l'air entraîné qui protège du gel.", null, "La vibration ne change pas la chimie.", "La remontée d'eau (ressuage) est à éviter."] },
    2: { q: "Un premier béton s'affaisse de 40 mm, un second de 120 mm. Le second est…", o: ["Plus résistant", "Plus fluide (plus maniable)", "Plus riche en air entraîné", "Plus raide"], r: 1, e: "L'affaissement mesure la consistance : plus il est grand, plus le béton est fluide. Il ne dit rien directement de la résistance ni de l'air, qu'on mesure à part.", p: ["L'affaissement ne mesure pas la résistance ; plus d'eau donnerait même un béton plus faible.", null, "L'air se mesure par un essai distinct (pressiométrique, volumétrique, gravimétrique).", "C'est l'inverse : un faible affaissement indique un béton raide."] },
    3: { q: "De l'eau de ressuage est visible sur la dalle. On…", o: ["Truelle tout de suite pour la faire pénétrer", "Attend qu'elle disparaisse avant le talochage et le truellage", "Ajoute du ciment sec pour l'absorber", "Arrose pour l'uniformiser"], r: 1, e: "Travailler la surface pendant le ressuage l'affaiblit. On arase avant, on attend, puis on taloche et on truelle.", p: ["Ça ramène l'eau dans la surface et l'affaiblit.", null, "Ça crée une couche de surface fragile et mal liée.", "Ajouter de l'eau aggrave le problème."] },
    4: { q: "Une cure humide est interrompue trop tôt. Si on remouille le béton plus tard…", o: ["L'hydratation est définitivement perdue", "L'hydratation peut redémarrer, sans récupérer le temps perdu", "Le béton gonfle et éclate", "La résistance double"], r: 1, e: "Tant qu'il reste du ciment anhydre et que l'HR remonte au-dessus de ≈ 80–85 %, l'hydratation reprend.", p: ["Elle peut repartir si on fournit à nouveau de l'eau.", null, "Le remouillage ne cause pas d'éclatement.", "On relance l'hydratation, on ne rattrape pas plus que ce qui reste à hydrater."] }

    2: { q: "Eau = 160 kg/m³ et E/L = 0,40. Quelle masse de liant ?", o: ["64 kg", "400 kg", "160 kg", "560 kg"], r: 1, e: "Liant = eau / (E/L) = 160 / 0,40 = 400 kg/m³, supérieur au minimum de 335 kg pour les sels.", p: ["C'est 160 × 0,40 : on a multiplié au lieu de diviser.", null, "C'est l'eau, pas le liant.", "C'est 160 + 400 : on a additionné l'eau."] },

    1: { q: "Pourquoi ne dose-t-on pas pour une moyenne égale à f′c ?", o: ["Parce que f′c est une valeur maximale", "Parce que la moitié des essais tomberaient sous f′c, à cause de la variabilité", "Pour utiliser moins de ciment", "Parce que les cylindres surestiment toujours"], r: 1, e: "Les résultats suivent une loi normale. Viser f′cr, plus haut, garde les essais sous f′c à environ 1 %.", p: ["f′c est une valeur minimale spécifiée.", null, "Viser plus haut demande plus de ciment, pas moins.", "Ce n'est pas un biais des cylindres, c'est la dispersion."] },

   TROUSSE DE RÉVISION — moteur commun (voir la compétence « revision-interactive »)
   COURSE = { code, nom, accroche, footer, storageKey, parties:[{id,titre}], fiche:[…],          (course.js, chargé avant)
              diagAvant, diagnostic, seuilSur, textes, niveaux, examen, ponderation }        options : voir LISEZMOI.md
   diagAvant: true → à l'entrée d'un sujet, seul le quiz diagnostique s'affiche ; le contenu apparaît après (ou si on le passe)

   Une section = {
     titre,
     anim: { ratio, alt, draw(ctx, t, w, h) },      // t en secondes, w et h en px CSS
     texte: ["…", "…"],                             // 2 paragraphes affichés ; les suivants vont dans « Pour aller plus loin »
     plus: ["…"],                                   // facultatif : détails repliés
     cle: { label, html },                          // encadré « à retenir »
     graphique: { titre, source, x, y, params, calc(p), note }  // source : "cours" | "calcul" | "modele"
     widget: (conteneur) => { … },                  // ou outil sur mesure
     quiz: [{ q, o:[…], r, e, p }]                  // « Teste-toi » ; sans o = question de rappel ; p = pièges (facultatif)
     diag: { q, o:[…], r, e, p }                    // facultatif : question du quiz diagnostique (sinon diag.js, sinon 1re Teste-toi)
   }
   Pièges : p = ["…", null, …] aligné sur o ; pour chaque mauvais choix, pourquoi il est tentant (affiché si on le choisit).
   Graphique : calc(p) renvoie { courbes, bandes, seuils, marqueurs, barres, lecture }
   ========================================================================== */
const MODULES = [];
const PARTIES = COURSE.parties;
const QUIZ = typeof QUIZ_DATA === "undefined" ? {} : QUIZ_DATA;
const DIAG = typeof DIAG_DATA === "undefined" ? {} : DIAG_DATA;

/* ---------- utilitaires ---------- */
const range = (a, b, n) => { const o = []; for (let i = 0; i <= n; i++) o.push(a + (b - a) * i / n); return o; };
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, u) => a + (b - a) * u;
const ease = x => x < 0.5 ? 2 * x * x : 1 - Math.pow(-2 * x + 2, 2) / 2;
const fr = (v, d = 1) => (+v).toLocaleString("fr-CA", { minimumFractionDigits: d, maximumFractionDigits: d });
const fx = v => fr(v, Math.abs(v) >= 100 ? 0 : 1);
function interp(xs, ys, x) {
  if (x <= xs[0]) return ys[0];
  for (let i = 1; i < xs.length; i++) if (x <= xs[i]) return lerp(ys[i - 1], ys[i], (x - xs[i - 1]) / (xs[i] - xs[i - 1]));
  return ys[ys.length - 1];
}
function el(tag, attrs = {}, html) {
  const e = document.createElement(tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (html != null) e.innerHTML = html;
  return e;
}
function seeded(seed) { return () => (seed = (seed * 16807) % 2147483647) / 2147483647; }
function niceTicks(min, max, n = 5) {
  const span = max - min, step0 = span / n, mag = Math.pow(10, Math.floor(Math.log10(step0)));
  const step = [1, 2, 2.5, 5, 10].map(m => m * mag).find(s => span / s <= n) || 10 * mag;
  const out = []; for (let v = Math.ceil(min / step - 1e-9) * step; v <= max + 1e-9; v += step) out.push(+v.toFixed(10));
  return out;
}
const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
};
let uid = 0;

/* ---------- couleurs du thème pour les canvas ---------- */
const C = {};
function readColors() {
  const cs = getComputedStyle(document.documentElement);
  ["bg", "surface", "ink", "muted", "line", "steel", "rebar", "sage", "alert", "water", "hydrate", "grain", "sand", "stone", "magma", "ice", "sea", "veg", "clay"]
    .forEach(k => C[k] = cs.getPropertyValue("--" + k).trim());
}
readColors();
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", readColors);
new MutationObserver(readColors).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });

/* ---------- contrôles (curseurs et choix) ---------- */
function buildControls(params, p, onChange, box) {
  params.forEach(par => {
    p[par.id] = par.value;
    const c = el("div", { class: "ctrl" });
    const id = "c" + (++uid) + "-" + par.id;
    if (par.type === "choix") {
      c.append(el("span", { class: "lab" }, par.label));
      const seg = el("div", { class: "seg", role: "group", "aria-label": par.label });
      par.options.forEach(o => {
        const b = el("button", { type: "button", id: id + "-" + String(o.v).replace(/\W/g, ""), "aria-pressed": String(o.v === par.value) }, o.label);
        b.addEventListener("click", () => {
          p[par.id] = o.v;
          seg.querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", String(x === b)));
          onChange();
        });
        seg.append(b);
      });
      c.append(seg);
    } else {
      const out = el("output", { for: id });
      const lab = el("label", { for: id }); lab.append(document.createTextNode(par.label), out);
      const inp = el("input", { type: "range", id, min: par.min, max: par.max, step: par.step, value: par.value });
      const dec = String(par.step).includes(".") ? String(par.step).split(".")[1].length : 0;
      const show = () => out.textContent = fr(p[par.id], dec) + (par.unit || "");
      inp.addEventListener("input", () => { p[par.id] = +inp.value; show(); onChange(); });
      show(); c.append(lab, inp);
    }
    box.append(c);
  });
}

/* ---------- badge de source ---------- */
const BADGES = {
  cours: ["Données du cours", "Valeurs et exemples tirés des notes : à connaître."],
  calcul: ["Calcul exact", "Formule exacte : les valeurs calculées sont fiables."],
  modele: ["Modèle illustratif", "Courbe schématique pour voir la tendance : ne mémorise pas les valeurs."]
};
function badge(k) { const b = BADGES[k] || BADGES.modele; return el("span", { class: "badge " + k, title: b[1] }, b[0]); }

/* ---------- graphique interactif ---------- */
function buildChart(cfg) {
  const box = el("div", { class: "chart" });
  const top = el("div", { class: "chart-top" });
  const ro = el("div", { class: "readout", "aria-live": "polite" });
  const tt = el("div", { class: "titre" }); tt.append(el("h3", {}, cfg.titre));
  if (cfg.source) tt.append(badge(cfg.source));
  top.append(tt, ro);
  const body = el("div", { class: "chart-body" });
  const plot = el("div", { class: "plot" });
  const ctrls = el("div", { class: "ctrls" });
  body.append(plot);
  if (cfg.params && cfg.params.length) body.append(ctrls); else body.style.gridTemplateColumns = "1fr";
  const legend = el("div", { class: "legend" });
  box.append(top, body, legend);
  if (cfg.note) box.append(el("p", { class: "note" }, cfg.note));

  const p = {};
  buildControls(cfg.params || [], p, () => draw(), ctrls);

  const small = innerWidth < 640, W = small ? 400 : 600, H = small ? 300 : 340, m = { l: 50, r: 14, t: 16, b: 46 };
  const ns = "http://www.w3.org/2000/svg";
  const svg = document.createElementNS(ns, "svg");
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`); svg.setAttribute("role", "img"); svg.setAttribute("aria-label", cfg.titre);
  plot.append(svg);
  const tip = el("div", { class: "tip", hidden: "" }); plot.append(tip);
  let last = null, X, Y, sx, sy;

  function scales() {
    X = typeof cfg.x === "function" ? cfg.x(p) : cfg.x;
    Y = typeof cfg.y === "function" ? cfg.y(p) : cfg.y;
    const lx = v => X.log ? Math.log10(v) : v;
    sx = v => m.l + (lx(v) - lx(X.min)) / (lx(X.max) - lx(X.min)) * (W - m.l - m.r);
    sy = v => H - m.b - (v - Y.min) / (Y.max - Y.min) * (H - m.t - m.b);
  }
  const cx = v => clamp(v, X.min, X.max), cy = v => clamp(v, Y.min, Y.max);
  const path = pts => pts.map((q, i) => (i ? "L" : "M") + sx(cx(q[0])).toFixed(1) + " " + sy(cy(q[1])).toFixed(1)).join("");
  const ft = v => Math.abs(v) >= 1000 ? Math.round(v).toLocaleString("fr-CA") : (+v.toFixed(4)).toLocaleString("fr-CA");

  function draw() {
    scales();
    const r = cfg.calc(p); last = r;
    let s = "";
    (Y.ticks || niceTicks(Y.min, Y.max)).forEach(v => s += `<line class="gr" x1="${m.l}" x2="${W - m.r}" y1="${sy(v)}" y2="${sy(v)}"/><text x="${m.l - 8}" y="${sy(v) + 4}" text-anchor="end">${Y.tickFmt ? Y.tickFmt(v) : ft(v)}</text>`);
    if (r.barres) {
      const n = r.barres.length, slot = (W - m.l - m.r) / n, bw = Math.min(56, slot * 0.62);
      r.barres.forEach((b, i) => {
        const x = m.l + slot * (i + 0.5), y0 = sy(Math.max(Y.min, 0)), y1 = sy(cy(b.val));
        s += `<rect class="bar${b.style ? "-" + b.style : ""}" x="${x - bw / 2}" y="${Math.min(y0, y1)}" width="${bw}" height="${Math.abs(y0 - y1)}" rx="2"><title>${b.nom} : ${b.txt || fx(b.val)}</title></rect>`;
        s += `<text class="lbl" x="${x}" y="${y1 - 6}" text-anchor="middle">${b.txt || fx(b.val)}</text>`;
        s += `<text x="${x}" y="${H - m.b + 18}" text-anchor="middle" style="${n > 6 ? "font-size:" + (W < 500 ? 8.5 : 10) + "px" : ""}">${b.nom}</text>`;
        if (b.sous) s += `<text x="${x}" y="${H - m.b + 32}" text-anchor="middle" font-size="10">${b.sous}</text>`;
      });
    } else {
      (X.ticks || niceTicks(X.min, X.max, 6)).forEach(v => s += `<line class="gr" y1="${m.t}" y2="${H - m.b}" x1="${sx(v)}" x2="${sx(v)}" opacity=".5"/><text x="${sx(v)}" y="${H - m.b + 18}" text-anchor="middle">${X.tickFmt ? X.tickFmt(v) : ft(v)}</text>`);
      s += `<text x="${(W + m.l) / 2}" y="${H - 6}" text-anchor="middle">${X.label}</text>`;
    }
    s += `<line class="ax" x1="${m.l}" x2="${W - m.r}" y1="${sy(Math.max(Y.min, Math.min(0, Y.max)))}" y2="${sy(Math.max(Y.min, Math.min(0, Y.max)))}"/><line class="ax" x1="${m.l}" x2="${m.l}" y1="${m.t}" y2="${H - m.b}"/>`;
    s += `<text transform="translate(13 ${(H - m.b + m.t) / 2}) rotate(-90)" text-anchor="middle">${Y.label}</text>`;
    (r.bandes || []).forEach(b => {
      const d = path(b.haut) + b.bas.slice().reverse().map(q => "L" + sx(cx(q[0])).toFixed(1) + " " + sy(cy(q[1])).toFixed(1)).join("") + "Z";
      s += `<path class="${b.style || "band"}" d="${d}"/>`;
    });
    (r.courbes || []).forEach(c => {
      if (c.style === "main" && !r.bandes && c.aire !== false) {
        const base = sy(Math.max(Y.min, 0));
        s += `<path class="area" d="${path(c.pts)}L${sx(cx(c.pts.at(-1)[0]))} ${base}L${sx(cx(c.pts[0][0]))} ${base}Z"/>`;
      }
      s += `<path class="c-${c.style}" d="${path(c.pts)}"/>`;
    });
    (r.seuils || []).forEach(t => {
      if (t.axe === "x") { const x = sx(cx(t.v)); s += `<line class="seuil" x1="${x}" x2="${x}" y1="${m.t}" y2="${H - m.b}"/><text class="seuil-t" x="${x + 4}" y="${m.t + 10 + (t.dy || 0)}">${t.nom}</text>`; }
      else { const y = sy(cy(t.v)); s += `<line class="seuil" x1="${m.l}" x2="${W - m.r}" y1="${y}" y2="${y}"/><text class="seuil-t" x="${W - m.r - 4}" y="${y - 5}" text-anchor="end">${t.nom}</text>`; }
    });
    (r.marqueurs || []).forEach(k => {
      const x = sx(cx(k.x)), y = sy(cy(k.y));
      s += `<line class="mk-line" x1="${x}" x2="${x}" y1="${y}" y2="${sy(Math.max(Y.min, 0))}"/><circle class="mk" cx="${x}" cy="${y}" r="5"/>`;
      if (k.nom) s += `<text class="lbl" x="${x + (k.gauche ? -8 : 8)}" y="${y - 8}" text-anchor="${k.gauche ? "end" : "start"}">${k.nom}</text>`;
    });
    svg.innerHTML = s;
    ro.innerHTML = (r.lecture || []).map(([k, v, cls]) => `<span class="${cls || ""}">${k} <b>${v}</b></span>`).join("");
    const leg = (r.courbes || []).filter(c => c.nom).map(c => `<span><i class="${c.style}"></i>${c.nom}</span>`)
      .concat((r.bandes || []).filter(b => b.nom).map(b => `<span><i class="band"></i>${b.nom}</span>`));
    legend.innerHTML = leg.join("");
  }

  svg.addEventListener("pointermove", e => {
    if (!last || last.barres) return;
    const main = (last.courbes || []).find(c => c.style === "main"); if (!main) return;
    const rect = svg.getBoundingClientRect(), xv = (e.clientX - rect.left) / rect.width * W;
    if (xv < m.l || xv > W - m.r) { tip.hidden = true; return; }
    let best = main.pts[0], bd = Infinity;
    main.pts.forEach(q => { const d = Math.abs(sx(cx(q[0])) - xv); if (d < bd) { bd = d; best = q; } });
    tip.hidden = false;
    tip.style.left = (sx(cx(best[0])) / W * 100) + "%"; tip.style.top = (sy(cy(best[1])) / H * 100) + "%";
    tip.textContent = `${X.tipFmt ? X.tipFmt(best[0]) : fr(best[0], 2)} → ${Y.tipFmt ? Y.tipFmt(best[1]) : fx(best[1])}`;
  });
  svg.addEventListener("pointerleave", () => tip.hidden = true);
  draw();
  return box;
}

/* ---------- scènes animées ---------- */
const stages = [];
function buildStage(anim) {
  const wrap = el("div", { class: "stage" });
  const cv = el("canvas", { role: "img", "aria-label": anim.alt || "Animation" }); wrap.append(cv);
  const btn = el("button", { class: "play", type: "button" }); wrap.append(btn);
  const st = { cv, anim, visible: true, playing: !reduceMotion, t0: performance.now(), tPause: reduceMotion ? (anim.still || 5) : 0 };
  btn.textContent = st.playing ? "Pause" : "Lecture";
  btn.addEventListener("click", () => {
    st.playing = !st.playing;
    if (st.playing) st.t0 = performance.now() - st.tPause * 1000;
    btn.textContent = st.playing ? "Pause" : "Lecture";
  });
  stages.push(st);
  new IntersectionObserver(es => es.forEach(e => st.visible = e.isIntersecting)).observe(wrap);
  return wrap;
}
function frame(now) {
  stages.forEach(st => {
    if (!st.cv.isConnected || (!st.visible && st.drawn)) return;
    if (!st.playing && st.drawn && st.drawnW === st.cv.clientWidth) return;
    const w = st.cv.clientWidth || 400, h = Math.round(w * st.anim.ratio), dpr = Math.min(2, devicePixelRatio || 1);
    if (st.cv.width !== Math.round(w * dpr)) { st.cv.width = Math.round(w * dpr); st.cv.height = Math.round(h * dpr); st.cv.style.height = h + "px"; }
    const t = Math.max(0, st.playing ? (now - st.t0) / 1000 : st.tPause);
    if (st.playing) st.tPause = t;
    const ctx = st.cv.getContext("2d");
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, w, h);
    D._q = [];
    try { st.anim.draw(ctx, t, w, h); D.flushText(ctx); } catch (err) { console.error(err); st.playing = false; D._q = null; }
    st.drawn = true; st.drawnW = w;
  });
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
/* redessiner les scènes en pause quand le thème change */
function invalidateStages() { stages.forEach(s => s.drawn = false); }
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", invalidateStages);
new MutationObserver(invalidateStages).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });

/* ---------- aides au dessin ---------- */
const D = {
  font(sz = 11, w = 400) { return `${w} ${sz}px 'IBM Plex Mono', ui-monospace, monospace`; },
  /* Texte : pendant une image d'animation, les étiquettes sont mises en file puis dessinées
     ensemble à la fin (flushText) : celles qui se chevauchent sur une même ligne sont réduites,
     et toutes restent dans la largeur du canevas. Hors animation, dessin immédiat. */
  text(ctx, s, x, y, o = {}) {
    const lab = { s: String(s), x, y, size: o.size || 11, color: o.color || C.muted, weight: o.weight || 400, align: o.align || "left", base: o.base || "alphabetic" };
    if (D._q) { lab.alpha = ctx.globalAlpha; lab.tf = ctx.getTransform ? ctx.getTransform() : null; D._q.push(lab); return; }
    D._fit(ctx, [lab]); D._draw(ctx, lab);
  },
  _draw(ctx, l) {
    ctx.fillStyle = l.color; ctx.font = D.font(l.size, l.weight);
    ctx.textAlign = l.align; ctx.textBaseline = l.base; ctx.fillText(l.s, l.x, l.y);
  },
  _fit(ctx, labs) {
    const tr = ctx.getTransform && ctx.getTransform(), dpr = (tr && tr.a) || 1, W = (ctx.canvas && ctx.canvas.width || 0) / dpr;
    const kR = { left: 1, center: .5, right: 0 }, kL = { left: 0, center: .5, right: 1 };
    labs.forEach(l => {   // position en px CSS (translation et échelle simples seulement)
      const m = l.tf, ok = !m || (Math.abs(m.b) < 1e-6 && Math.abs(m.c) < 1e-6);
      l.sc = m && ok ? m.a / dpr : 1; l.ax = m && ok ? (m.a * l.x + m.e) / dpr : l.x; l.ay = m && ok ? (m.d * l.y + m.f) / dpr : l.y; l.free = !ok;
      ctx.font = D.font(l.size, l.weight); l.w = ctx.measureText(l.s).width * l.sc;
    });
    for (let pass = 0; pass < 3; pass++) for (let i = 0; i < labs.length; i++) for (let j = 0; j < labs.length; j++) {
      const a = labs[i], b = labs[j];
      if (i === j || a.free || b.free || a.ax >= b.ax || a.base !== b.base) continue;
      const hgt = Math.min(a.size, b.size) * Math.min(a.sc, b.sc);
      if (Math.abs(a.ay - b.ay) > hgt * .9) continue;
      const room = b.ax - a.ax - 6, need = a.w * kR[a.align] + b.w * kL[b.align];
      if (need <= room || room < 12) continue;
      const f = room / need;
      [a, b].forEach(l => { if (kR[l.align] + kL[l.align] === 0) return; const ns = Math.max(7, l.size * f); l.w *= ns / l.size; l.size = ns; });
    }
    labs.forEach(l => {   // rester dans le canevas
      if (!W || l.free) return;
      const avail = l.align === "left" ? W - l.ax - 4 : l.align === "right" ? l.ax - 4 : 2 * Math.min(l.ax, W - l.ax) - 8;
      if (l.w > avail && avail > 24) { const ns = Math.max(7, l.size * avail / l.w); l.w *= ns / l.size; l.size = ns; }
    });
  },
  flushText(ctx) {
    const q = D._q; D._q = null; if (!q || !q.length) return;
    D._fit(ctx, q);
    const keep = ctx.getTransform && ctx.getTransform(), ga = ctx.globalAlpha;
    q.forEach(l => { if (l.tf) ctx.setTransform(l.tf); ctx.globalAlpha = l.alpha; D._draw(ctx, l); });
    if (keep) ctx.setTransform(keep); ctx.globalAlpha = ga;
  },
  arrow(ctx, x1, y1, x2, y2, color, wdt = 2, head = 7) {
    ctx.strokeStyle = color; ctx.fillStyle = color; ctx.lineWidth = wdt;
    ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
    const a = Math.atan2(y2 - y1, x2 - x1);
    ctx.beginPath(); ctx.moveTo(x2, y2);
    ctx.lineTo(x2 - head * Math.cos(a - 0.45), y2 - head * Math.sin(a - 0.45));
    ctx.lineTo(x2 - head * Math.cos(a + 0.45), y2 - head * Math.sin(a + 0.45)); ctx.closePath(); ctx.fill();
  },
  circle(ctx, x, y, r, fill, stroke, lw = 1) {
    ctx.beginPath(); ctx.arc(x, y, Math.max(0, r), 0, Math.PI * 2);
    if (fill) { ctx.fillStyle = fill; ctx.fill(); }
    if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = lw; ctx.stroke(); }
  },
  rect(ctx, x, y, w, h, fill, stroke, lw = 1) {
    if (fill) { ctx.fillStyle = fill; ctx.fillRect(x, y, w, h); }
    if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = lw; ctx.strokeRect(x, y, w, h); }
  },
  line(ctx, pts, color, lw = 1.5, dash) {
    ctx.strokeStyle = color; ctx.lineWidth = lw; ctx.setLineDash(dash || []);
    ctx.beginPath(); pts.forEach((q, i) => ctx[i ? "lineTo" : "moveTo"](q[0], q[1])); ctx.stroke(); ctx.setLineDash([]);
  },
  poly(ctx, pts, fill, stroke, lw = 1) {
    ctx.beginPath(); pts.forEach((q, i) => ctx[i ? "lineTo" : "moveTo"](q[0], q[1])); ctx.closePath();
    if (fill) { ctx.fillStyle = fill; ctx.fill(); }
    if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = lw; ctx.stroke(); }
  },
  rock(ctx, x, y, r, seed, fill, stroke, angular = 0.25) {
    const rnd = seeded(seed), n = 9, pts = [];
    for (let i = 0; i < n; i++) { const a = i / n * Math.PI * 2 + rnd() * 0.3; const rr = r * (1 - angular / 2 + rnd() * angular); pts.push([x + Math.cos(a) * rr, y + Math.sin(a) * rr]); }
    D.poly(ctx, pts, fill, stroke, 1);
  },
  alpha(ctx, a, fn) { ctx.save(); ctx.globalAlpha = a; fn(); ctx.restore(); },
  legend(ctx, items, x, y, gap = 100) {
    items.forEach(([c, l], i) => { ctx.fillStyle = c; ctx.fillRect(x + i * gap, y - 9, 10, 10); D.text(ctx, l, x + 14 + i * gap, y, { color: C.ink }); });
  },
  /* mini-graphe dans un canvas */
  axes(ctx, x, y, w, h, lx, ly) {
    D.line(ctx, [[x, y], [x, y + h], [x + w, y + h]], C.muted, 1);
    if (ly) D.text(ctx, ly, x - 4, y - 6, { align: "left" });
    if (lx) D.text(ctx, lx, x + w, y + h + 14, { align: "right" });
  }
};
const cyc = (t, T) => (t % T) / T;                 // phase 0→1
const seg = (u, a, b) => clamp((u - a) / (b - a), 0, 1); // sous-phase

/* Barres de plages (utilisées dans plusieurs modules) */
function plagesWidget(box, cfg) {
  box.append(el("div", { class: "chart-top" }, `<h3>${cfg.titre}</h3>`));
  const ro = el("div", { class: "readout", "aria-live": "polite" });
  const W = innerWidth < 640 ? 420 : 600, rowH = 46, H = cfg.rows.length * rowH + 30, m = { l: innerWidth < 640 ? 118 : 150, r: 56 };
  const ns = "http://www.w3.org/2000/svg";
  const svg = document.createElementNS(ns, "svg");
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`); svg.setAttribute("role", "img"); svg.setAttribute("aria-label", cfg.titre);
  svg.style.width = "100%"; svg.style.height = "auto";
  const wrap = el("div", { class: "plot" }); wrap.append(svg);
  const lg = v => Math.log10(v);
  const sx = v => m.l + (lg(v) - lg(cfg.min)) / (lg(cfg.max) - lg(cfg.min)) * (W - m.l - m.r);
  const p = {};
  const ctrls = el("div", { class: "ctrls" });
  const val = () => cfg.slider && cfg.slider.log ? Math.pow(10, p.lv) : p.v;
  const fmt = v => v >= 100 ? fr(v, 0) : v >= 1 ? fr(v, 1) : v >= 0.01 ? fr(v, 3) : fr(v, 4);
  function draw() {
    const V = val();
    let s = "";
    (cfg.ticks).forEach(v => s += `<line class="gr" x1="${sx(v)}" x2="${sx(v)}" y1="6" y2="${H - 24}"/><text x="${sx(v)}" y="${H - 8}" text-anchor="middle">${v.toLocaleString("fr-CA")}</text>`);
    cfg.rows.forEach((r, i) => {
      const y = 10 + i * rowH, hit = cfg.slider && V >= r.min && V <= r.max;
      s += `<text class="lbl" x="0" y="${y + 18}">${r.nom}</text>`;
      if (r.sous) s += `<text x="0" y="${y + 32}" font-size="10">${r.sous}</text>`;
      s += `<rect class="${hit ? "bar-alt" : (r.style ? "bar-" + r.style : "bar")}" x="${sx(r.min)}" y="${y + 6}" width="${Math.max(3, sx(r.max) - sx(r.min))}" height="20" rx="3"><title>${r.nom} : ${r.min} à ${r.max} ${cfg.unite}</title></rect>`;
      s += `<text x="${sx(r.max) + 6}" y="${y + 20}">${r.min.toLocaleString("fr-CA")}–${r.max.toLocaleString("fr-CA")}</text>`;
    });
    if (cfg.slider) s += `<line class="seuil" x1="${sx(V)}" x2="${sx(V)}" y1="4" y2="${H - 24}"/>`;
    svg.innerHTML = s;
    if (cfg.slider) {
      const hits = cfg.rows.filter(r => V >= r.min && V <= r.max);
      if (cfg.slider.log) { const o = ctrls.querySelector("output"); if (o) o.textContent = fmt(V) + (cfg.slider.unit || ""); }
      ro.innerHTML = `<span>${fmt(V)} ${cfg.unite} → <b>${hits.length ? hits.map(h => h.nom).join(", ") : "hors des plages"}</b></span>` + (hits[0] && hits[0].usage ? `<span>${hits[0].usage}</span>` : "");
    }
  }
  if (cfg.slider) buildControls([cfg.slider.log ? Object.assign({}, cfg.slider, { id: "lv", min: Math.log10(cfg.slider.min), max: Math.log10(cfg.slider.max), step: 0.01, value: Math.log10(cfg.slider.value) }) : cfg.slider], p, draw, ctrls);
  box.append(ro);
  const body = el("div", { class: "chart-body" });
  body.append(wrap); if (cfg.slider) body.append(ctrls); else body.style.gridTemplateColumns = "1fr";
  box.append(body);
  if (cfg.note) box.append(el("p", { class: "note" }, cfg.note));

}


/* Exercice de tri : chaque élément se classe dans une catégorie, correction immédiate */
function triWidget(box, cfg) {
  box.append(el("div", { class: "chart-top" }, `<h3>${cfg.titre}</h3>`));
  const score = el("div", { class: "readout", "aria-live": "polite" });
  box.append(score);
  if (cfg.consigne) box.append(el("p", { class: "note" }, cfg.consigne));
  const list = el("div", { style: "display:grid;gap:8px" });
  const st = cfg.items.map(() => null);
  cfg.items.forEach((it, i) => {
    const row = el("div", { style: "display:grid;grid-template-columns:minmax(0,1fr);gap:6px;padding:8px 10px;border:1px solid var(--line);border-radius:4px;background:var(--bg)" });
    const lab = el("div", { style: "font-size:.9rem" }, it.nom);
    const seg = el("div", { class: "seg" });
    const fb = el("div", { class: "note", hidden: "" });
    cfg.cats.forEach(c => {
      const b = el("button", { type: "button", "aria-pressed": "false" }, c);
      b.addEventListener("click", () => {
        st[i] = c;
        seg.querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", String(x === b)));
        const ok = c === it.rep;
        fb.hidden = false;
        fb.innerHTML = `<b style="color:var(${ok ? "--sage" : "--alert"})">${ok ? "Exact." : "Non : " + it.rep + "."}</b> ${it.pourquoi || ""}`;
        upd();
      });
      seg.append(b);
    });
    row.append(lab, seg, fb); list.append(row);
  });
  function upd() {
    const done = st.filter(x => x != null).length, good = st.filter((x, i) => x === cfg.items[i].rep).length;
    score.innerHTML = `<span>répondu <b>${done} / ${cfg.items.length}</b></span><span class="${good === done ? "ok" : "bad"}">bonnes réponses <b>${good}</b></span>`;
  }
  const reset = el("button", { class: "btn", type: "button" }, "Recommencer");
  reset.addEventListener("click", () => { box.innerHTML = ""; triWidget(box, cfg); });
  box.append(list, el("div", {}, ""), reset); upd();
}

/* Frise / sélecteur d'étapes : un curseur parcourt des étapes décrites */
function etapesWidget(box, cfg) {
  box.append(el("div", { class: "chart-top" }, `<h3>${cfg.titre}</h3>`));
  const p = {}, ctrls = el("div", { class: "ctrls" });
  const card = el("div", { class: "key", style: "min-height:6em" });
  buildControls([{ id: "k", label: cfg.label || "Étape", min: 0, max: cfg.etapes.length - 1, step: 1, value: cfg.depart || 0, unit: "" }], p, draw, ctrls);
  const out = ctrls.querySelector("output");
  function draw() {
    const e = cfg.etapes[clamp(Math.round(p.k), 0, cfg.etapes.length - 1)];
    if (out) out.textContent = e.court;
    card.innerHTML = `<b>${e.court}</b>${e.texte}`;
    if (cfg.onStep) cfg.onStep(clamp(Math.round(p.k), 0, cfg.etapes.length - 1));
  }
  box.append(card, ctrls); draw();
}

let _hyd = null;
function drawPaste(ctx, x0, y0, w, h, grains, p, opts = {}) {
  ctx.save(); ctx.beginPath(); ctx.rect(x0, y0, w, h); ctx.clip();
  D.alpha(ctx, 0.6, () => D.rect(ctx, x0, y0, w, h, C.water));
  const e = ease(p);
  grains.forEach(g => {
    const R = g.r * (1 + (opts.grow || 0.9) * e), gx = x0 + g.x * w, gy = y0 + g.y * h;
    D.alpha(ctx, 0.55, () => D.circle(ctx, gx, gy, R, C.hydrate));
    ctx.strokeStyle = C.hydrate; ctx.lineWidth = 1;
    const n = Math.floor(18 * e);
    for (let i = 0; i < n; i++) {
      const a = g.a + i * 2.4, r1 = g.r * 0.9, r2 = R * (0.92 + 0.12 * Math.sin(i * 3.1));
      ctx.beginPath(); ctx.moveTo(gx + Math.cos(a) * r1, gy + Math.sin(a) * r1); ctx.lineTo(gx + Math.cos(a) * r2, gy + Math.sin(a) * r2); ctx.stroke();
    }
  });
  grains.forEach(g => D.circle(ctx, x0 + g.x * w, y0 + g.y * h, g.r * (1 - 0.35 * e), C.grain));
  if (opts.ch && p > 0.45) {
    const q = Math.min(1, (p - 0.45) / 0.4);
    ctx.strokeStyle = C.rebar; ctx.lineWidth = 1.5;
    opts.ch.forEach(c => { ctx.beginPath(); for (let i = 0; i < 6; i++) { const a = Math.PI / 3 * i; ctx[i ? "lineTo" : "moveTo"](x0 + c.x * w + c.s * q * Math.cos(a), y0 + c.y * h + c.s * q * Math.sin(a)); } ctx.closePath(); ctx.stroke(); });
  }
  ctx.restore();
}
function animHydratation(ctx, t, w, h) {
  if (!_hyd) {
    const r = seeded(7); _hyd = { g: [], ch: [] };
    for (let i = 0; i < 26; i++) _hyd.g.push({ x: 0.06 + r() * 0.88, y: 0.14 + r() * 0.72, r: 0, k: 0.6 + r() * 0.7, a: r() * 6 });
    for (let i = 0; i < 7; i++) _hyd.ch.push({ x: 0.1 + r() * 0.8, y: 0.18 + r() * 0.66, s: 5 + r() * 5 });
  }
  const base = Math.min(w, h) * 0.045;
  _hyd.g.forEach(g => g.r = base * g.k);
  const p = Math.min(1, cyc(t, 9) / 0.82);
  drawPaste(ctx, 0, 0, w, h - 34, _hyd.g, p, { grow: 1.1, ch: _hyd.ch });
  const labels = ["0 h", "1 j", "7 j", "28 j"], y = h - 14;
  D.line(ctx, [[16, y - 8], [w - 16, y - 8]], C.line, 2);
  D.line(ctx, [[16, y - 8], [16 + (w - 32) * p, y - 8]], C.steel, 2);
  labels.forEach((l, i) => D.text(ctx, l, 16 + (w - 32) * i / 3, y + 6, { align: i === 0 ? "left" : i === 3 ? "right" : "center" }));
  D.rect(ctx, 0, 0, w, 24, C.surface + "dd");
  D.legend(ctx, [[C.grain, "anhydre"], [C.hydrate, "C-S-H"], [C.rebar, "CH"], [C.water, "eau"]], 10, 17, Math.min(100, (w - 20) / 4));
}
let _ec = null;
function animEC(ctx, t, w, h) {
  const half = (w - 12) / 2, ph = h - 44;
  if (!_ec || _ec.w !== w) {
    const make = (cols, rows, jit, seed) => { const r = seeded(seed), g = [];
      for (let i = 0; i < cols; i++) for (let j = 0; j < rows; j++) g.push({ x: (i + 0.5 + (r() - 0.5) * jit) / cols, y: (j + 0.5 + (r() - 0.5) * jit) / rows, r: 0, a: r() * 6 });
      return g; };
    _ec = { w, low: make(7, 5, 0.5, 3), high: make(5, 4, 0.6, 11) };
  }
  const base = Math.min(half, ph) * 0.075;
  _ec.low.forEach(g => g.r = base); _ec.high.forEach(g => g.r = base);
  const p = Math.min(1, cyc(t, 8) / 0.82);
  drawPaste(ctx, 0, 0, half, ph, _ec.low, p, { grow: 0.95 });

}

/* ===================== Module 6 — Propriétés mécaniques ===================== */
function drawCylinder(ctx, cx, top, bot, cw, load, opts = {}) {
  const ew = cw / 2, eh = cw * 0.14, squash = 6 * load, t2 = top + squash, bulge = 3 * load;
  D.rect(ctx, cx - ew - 14, t2 - eh - 12, cw + 28, 10, C.ink);
  D.rect(ctx, cx - ew - 14, bot + eh + 2, cw + 28, 10, C.ink);
  ctx.beginPath();
  ctx.moveTo(cx - ew, t2);
  ctx.quadraticCurveTo(cx - ew - bulge * 2, (t2 + bot) / 2, cx - ew, bot);
  ctx.ellipse(cx, bot, ew, eh, 0, Math.PI, 0, true);
  ctx.quadraticCurveTo(cx + ew + bulge * 2, (t2 + bot) / 2, cx + ew, t2);
  ctx.closePath(); ctx.fillStyle = C.hydrate + "66"; ctx.fill(); ctx.strokeStyle = C.ink; ctx.lineWidth = 1.4; ctx.stroke();
  ctx.beginPath(); ctx.ellipse(cx, t2, ew, eh, 0, 0, Math.PI * 2); ctx.stroke();
  if (opts.cracks && load > 0.45) {
    const n = Math.floor((load - 0.45) / 0.55 * 9), r = seeded(opts.seed || 5);
    ctx.strokeStyle = C.rebar; ctx.lineWidth = 1.4;
    for (let i = 0; i < n; i++) { const x = cx + (r() - 0.5) * cw * 0.8, y = t2 + 10 + r() * (bot - t2 - 20); ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + (r() - 0.5) * 8, y + 8 + r() * 8); ctx.stroke(); }
  }
  if (opts.broken) {
    ctx.strokeStyle = C.rebar; ctx.lineWidth = 2.2; ctx.beginPath();
    ctx.moveTo(cx - ew, t2 + 4); ctx.lineTo(cx, (t2 + bot) / 2); ctx.lineTo(cx + ew, t2 + 4);
    ctx.moveTo(cx - ew, bot - 4); ctx.lineTo(cx, (t2 + bot) / 2); ctx.lineTo(cx + ew, bot - 4); ctx.stroke();
  }
}

  [-0.5, 0, 0.5].forEach(k => D.arrow(ctx, cx + k * cw * 0.7, top - 44, cx + k * cw * 0.7, top - 22, C.rebar, 2));
  const gx = w * 0.56, gy = h * 0.16, gw = w * 0.38, gh = h * 0.62;
  D.axes(ctx, gx, gy, gw, gh, "ε", "σ");

/* ===================== Module 10 — Dosage des mélanges ===================== */
/* Tableaux du cours (diapos 5.2 · DCMB ch. 12) */
const CLASSES = {
  "C-XL": { el: 0.40, fc: 50, air: 1, desc: "béton armé exposé aux chlorures, attentes de durabilité élevées" },
  "C-1": { el: 0.40, fc: 35, air: 1, desc: "béton armé exposé aux chlorures, avec ou sans gel-dégel" },
  "C-2": { el: 0.45, fc: 32, air: 1, desc: "béton non armé exposé aux chlorures et au gel-dégel" },
  "C-3": { el: 0.50, fc: 30, air: 2, desc: "exposition continue aux chlorures, sans gel-dégel" },
  "C-4": { el: 0.55, fc: 25, air: 2, desc: "béton non armé, chlorures, sans gel-dégel" },
  "F-1": { el: 0.50, fc: 30, air: 1, desc: "gel-dégel en condition saturée, sans chlorures" },
  "F-2": { el: 0.55, fc: 25, air: 2, desc: "gel-dégel, condition non saturée, sans chlorures" }
};
const EL_FC = [15, 20, 25, 30, 35, 40, 45];
const EL_SANS = [0.79, 0.69, 0.61, 0.54, 0.47, 0.42, 0.38];
const EL_AIR = [0.70, 0.60, 0.52, 0.45, 0.39, 0.34, 0.30];
const DMAX = [10, 14, 20, 28, 40, 56, 80, 150];
const EAU = { "25–50": [181, 175, 168, 160, 150, 142, 122, 107], "75–100": [202, 193, 184, 175, 165, 157, 133, 119], "150–175": [216, 205, 197, 184, 174, 166, 154, null] };
const AIR_T = { 1: { 10: [6, 9], 14: [5, 8], 20: [5, 8], 28: [4, 7], 40: [4, 7] }, 2: { 10: [5, 8], 14: [4, 7], 20: [4, 7], 28: [3, 6], 40: [3, 6] } };
const GG_MF = [2.4, 2.6, 2.8, 3.0];
const GG = { 10: [0.50, 0.48, 0.46, 0.44], 14: [0.59, 0.57, 0.55, 0.53], 20: [0.66, 0.64, 0.62, 0.60], 28: [0.71, 0.69, 0.67, 0.65], 40: [0.75, 0.73, 0.71, 0.69] };

function fcr(fc, s) {
  if (s > 0) return Math.max(fc + 1.4 * s, fc + 2.4 * s - 3.5);
  return fc < 21 ? fc + 7 : fc <= 35 ? fc + 8.5 : fc + 10;
}
const elResist = (f, air) => interp(EL_FC, air ? EL_AIR : EL_SANS, f);
const fcrRule = (fc, s) => s > 0 ? (fc + 1.4 * s >= fc + 2.4 * s - 3.5 ? "f′c + 1,4 s" : "f′c + 2,4 s − 3,5") : (fc < 21 ? "f′c + 7,0" : fc <= 35 ? "f′c + 8,5" : "f′c + 10,0");

function dosage(p) {
  const cl = CLASSES[p.classe], r = {};
  r.fcr = fcr(p.fc, p.s);
  r.elR = elResist(r.fcr, true);
  r.elC = cl.el;
  r.el = Math.floor(Math.min(r.elR, r.elC) * 100 + 1e-9) / 100;
  r.cat = cl.air;
  r.airRange = AIR_T[r.cat][p.d];
  r.air = r.airRange[1];
  r.eau0 = EAU[p.aff][DMAX.indexOf(p.d)];
  r.eau = r.eau0 - (p.arr ? 25 : 0);
  r.eau = r.eau * (1 - p.re / 100);
  r.liant = r.eau / r.el;
  r.liantMin = p.classe.startsWith("C") ? 335 : 0;
  r.liantF = Math.max(r.liant, r.liantMin);
  r.vGG = interp(GG_MF, GG[p.d], p.mf);
  r.mGG = r.vGG * p.pil;
  r.V = { eau: r.eau / 1000, liant: r.liantF / 3150, air: r.air / 100, gros: r.mGG / (p.dg * 1000) };
  r.V.sable = 1 - r.V.eau - r.V.liant - r.V.air - r.V.gros;
  r.mSable = r.V.sable * p.ds * 1000;
  r.hG = r.mGG * (1 + p.thg / 100); r.hS = r.mSable * (1 + p.ths / 100);
  r.eauLibre = r.mGG * (p.thg - p.absg) / 100 + r.mSable * (p.ths - p.abss) / 100;
  r.eauC = r.eau - r.eauLibre;
  return r;
}

function normCdf(z) { const t = 1 / (1 + 0.2316419 * Math.abs(z)), d = 0.3989423 * Math.exp(-z * z / 2);
  const p = d * t * (0.3193815 + t * (-0.3565638 + t * (1.781478 + t * (-1.821256 + t * 1.330274)))); return z > 0 ? 1 - p : p; }
function randn(r) { let u = 0, v = 0; while (u === 0) u = r(); while (v === 0) v = r(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); }

      if (k === 4) for (let i = 0; i < 6; i++) D.alpha(ctx, 0.7 * u, () => D.rect(ctx, lerp(x0, x1, 0.25) + i * 6 - 20, y0, 18, y1 - y0, C.ink));

    }},
    texte: [
      "La température de pose doit être homogène : un enrobé qui refroidit inégalement (zones froides, arrêts-départs du finisseur) se compacte mal par endroits. Plus l'air est froid, plus l'enrobé refroidit vite et plus le temps disponible pour compacter est court. D'où des dates butoirs de pose en fin de saison.",
      "Les dommages typiques : ornières de fluage (l'enrobé se déplace sous les roues) et d'usure, fissuration thermique (retrait au froid), fissures de fatigue sous les charges répétées, ressuage (bitume en surface), désenrobage (le bitume se détache des granulats), pelade (décollement de la couche de surface) et nids-de-poule.",
      "Ils viennent des matériaux, de la formulation, de la mise en œuvre, du climat et du trafic : c'est pourquoi tout le processus, du choix des composants à la pose, est contrôlé."
    ],
    cle: { label: "Récapitulation du cours", html: "Choix des composants selon l'usage (bitume : plage de performance ; granulats : compétence et granularité) → formulation (proportions volumétriques, maniabilité, performance) → dimensionnement (module dynamique, déformation au bas de la couche, épaisseur)." },
    graphique: {
      titre: "Temps disponible pour compacter", source: "modele",
      x: { label: "Temps après l'épandage (min)", min: 0, max: 90 },

        { id: "ta", label: "Température de l'air", min: -5, max: 30, step: 1, value: 20, unit: " °C" },

/* Ton (couleurs) propre à une partie : "tons" dans course.json, CSS produit par build.py sur :root[data-partie] */

const quizOf = (mod, i) => (mod.sections[i].quiz || ((QUIZ[mod.id] || {})[i]) || []);
