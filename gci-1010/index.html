<!doctype html>
<html lang="fr-CA">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Révision GCI-1010</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Mise en page : carnet d'étude — bande d'en-tête, notions empilées (animation | texte), outil interactif pleine largeur, puis « Teste-toi » */
:root{
  --bg:#eef2f6; --surface:#fbfcfd; --ink:#13233a; --muted:#4f5f73; --line:#b7c4d2; --steel:#1d5b9a; --rebar:#c0392b; --sage:#3c7d4f; --alert:#b42d2d; --water:#7fb3dc; --hydrate:#8b97a6; --grain:#3d4b5e; --sand:#d6c08a; --stone:#8f969e; --magma:#d05a2c; --ice:#dbe7f3; --sea:#2f6aa3; --veg:#5b8a3a; --clay:#a6896a;
  --display:"Barlow Condensed","Arial Narrow",sans-serif;
  --body:"IBM Plex Sans",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0d2846;--surface:#123459;--ink:#eaf2fb;--muted:#a9c0d8;--line:#2e5379;--steel:#8cc4f0;--rebar:#ff9a7f;--sage:#8fd19e;--alert:#ff8a80;--water:#4f8fc6;--hydrate:#8ea3ba;--grain:#cfdcea;--sand:#c9b27a;--stone:#93a2b3;--magma:#f08050;--ice:#1d4670;--sea:#6fa8dc;--veg:#88c070;--clay:#b8987a;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d2846;--surface:#123459;--ink:#eaf2fb;--muted:#a9c0d8;--line:#2e5379;--steel:#8cc4f0;--rebar:#ff9a7f;--sage:#8fd19e;--alert:#ff8a80;--water:#4f8fc6;--hydrate:#8ea3ba;--grain:#cfdcea;--sand:#c9b27a;--stone:#93a2b3;--magma:#f08050;--ice:#1d4670;--sea:#6fa8dc;--veg:#88c070;--clay:#b8987a;color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.6 var(--body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 56px}
.wrap{max-width:1040px;margin:0 auto}
h1,h2,h3{font-family:var(--display);font-weight:600;line-height:1.1;text-wrap:balance;margin:0}
h1{font-size:clamp(2.2rem,6vw,3.4rem);letter-spacing:.01em}
h2{font-size:1.75rem}
h3{font-size:1.25rem}
p{margin:0}
.eyebrow{font:500 .72rem/1.2 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
a{color:var(--steel)}
button,input,select{font:inherit}
:focus-visible{outline:2px solid var(--steel);outline-offset:2px}

.masthead{padding-block:36px 24px;border-bottom:2px solid var(--ink);display:grid;gap:10px}
.masthead p{color:var(--muted);max-width:62ch}
.masthead .src{font:.75rem var(--mono);color:var(--muted)}

/* Accueil */
.part{margin-top:34px;display:grid;gap:14px}
.part-head{display:flex;align-items:baseline;gap:12px;border-bottom:1px solid var(--line);padding-bottom:6px}
.part-head h2{font-size:1.4rem}
.part-head span{font:.75rem var(--mono);color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.card{display:grid;gap:8px;align-content:start;text-align:left;cursor:pointer;position:relative;
  background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:18px;color:var(--ink);transition:border-color .15s,transform .15s}
.card:hover{border-color:var(--steel);transform:translateY(-2px)}
.card .code{font:500 .75rem var(--mono);color:var(--rebar)}
.card h3{font-size:1.4rem}
.card p{color:var(--muted);font-size:.9rem}
.card .meta{font:.72rem var(--mono);color:var(--muted);display:flex;gap:12px;flex-wrap:wrap}
.card .done{position:absolute;top:14px;right:14px;font:500 .68rem var(--mono);color:var(--sage);border:1px solid var(--sage);border-radius:999px;padding:1px 8px}
.progress{font:.8rem var(--mono);color:var(--muted)}
.progress b{color:var(--sage);font-weight:500}

/* Module */
.topbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:24px;flex-wrap:wrap}
.link{background:none;border:0;padding:0;color:var(--steel);cursor:pointer;font:500 .85rem var(--mono)}
.toggle-done{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px 12px;font:.78rem var(--mono);color:var(--ink);cursor:pointer}
.toggle-done[aria-pressed="true"]{border-color:var(--sage);color:var(--sage)}
.toc{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}
.toc button{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-size:.82rem;color:var(--ink);cursor:pointer}
.toc button:hover{border-color:var(--steel)}
.sec{padding-block:40px;border-bottom:1px solid var(--line);display:grid;gap:24px}
.sec-head{display:flex;gap:14px;align-items:baseline}
.sec-num{font:600 2.4rem/1 var(--display);color:var(--rebar);font-variant-numeric:tabular-nums}
.duo{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:28px;align-items:start}
@media (max-width:760px){.duo{grid-template-columns:1fr}}
.stage{background:var(--surface);border:1px solid var(--line);border-radius:4px;overflow:hidden;position:relative;display:grid}
.stage canvas{display:block;width:100%;height:auto}
.stage .play{justify-self:end;margin:0 8px 8px;background:var(--bg);border:1px solid var(--line);border-radius:3px;padding:2px 10px;font:.72rem var(--mono);color:var(--ink);cursor:pointer;opacity:.85}
.text{display:grid;gap:12px;min-width:0}
.text p{max-width:62ch}
.key{border-left:3px solid var(--steel);padding:8px 12px;background:var(--surface);font-size:.9rem}
.key b{display:block;font:500 .7rem var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--steel);margin-bottom:2px}
.key ul{margin:4px 0 0;padding-left:18px}
.formula{font-family:var(--mono);font-size:.86rem}
.next{margin-top:28px;display:flex;justify-content:flex-end}
.next button{background:var(--ink);color:var(--bg);border:0;border-radius:3px;padding:10px 16px;font:500 .9rem var(--body);cursor:pointer}

/* Graphique */
.chart{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:18px;display:grid;gap:14px;min-width:0}
.chart-top{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:baseline}
.chart-top h3{font-size:1.15rem}
.readout{font:.8rem var(--mono);color:var(--ink);font-variant-numeric:tabular-nums;display:flex;gap:6px 14px;flex-wrap:wrap}
.readout span b{color:var(--rebar);font-weight:500}
.readout span.ok b{color:var(--sage)}
.readout span.bad b{color:var(--alert)}
.chart-body{display:grid;grid-template-columns:minmax(0,1fr) 240px;gap:20px}
@media (max-width:720px){.chart-body{grid-template-columns:1fr}}
.plot{min-width:0;position:relative}
.plot svg{width:100%;height:auto;display:block;overflow:visible;touch-action:pan-y}
.ctrls{display:grid;gap:14px;align-content:start;min-width:0}
.ctrl{display:grid;gap:4px}
.ctrl label,.ctrl .lab{font-size:.82rem;display:flex;justify-content:space-between;gap:8px}
.ctrl output{font:.8rem var(--mono);color:var(--steel);font-variant-numeric:tabular-nums;white-space:nowrap}
.ctrl input[type=range]{width:100%;accent-color:var(--steel)}
.seg{display:flex;flex-wrap:wrap;gap:4px}
.seg button{background:var(--bg);border:1px solid var(--line);border-radius:3px;padding:3px 9px;font-size:.78rem;color:var(--ink);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--steel);border-color:var(--steel);color:var(--surface)}
.legend{display:flex;gap:6px 14px;flex-wrap:wrap;font-size:.78rem;color:var(--muted)}
.legend i{display:inline-block;width:18px;height:0;border-top:2.5px solid var(--steel);vertical-align:middle;margin-right:6px}
.legend i.ref{border-top:2px dashed var(--muted)}
.legend i.alt{border-top-color:var(--rebar)}
.legend i.c3{border-top-color:var(--sage)}
.legend i.band{border-top:8px solid var(--steel);opacity:.25}
.note{font-size:.8rem;color:var(--muted);max-width:78ch}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--bg);font:.75rem var(--mono);padding:3px 7px;border-radius:3px;white-space:nowrap;transform:translate(-50%,-130%)}
svg text{fill:var(--muted);font:11px var(--mono)}
svg .ax{stroke:var(--ink);stroke-width:1}
svg .gr{stroke:var(--line);stroke-width:1}
svg .c-main{stroke:var(--steel);stroke-width:2.5;fill:none}
svg .c-alt{stroke:var(--rebar);stroke-width:2.2;fill:none}
svg .c-c3{stroke:var(--sage);stroke-width:2.2;fill:none}
svg .c-ref{stroke:var(--muted);stroke-width:1.5;fill:none;stroke-dasharray:5 4}
svg .area{fill:var(--steel);opacity:.08}
svg .band{fill:var(--steel);opacity:.16}
svg .band-alt{fill:var(--rebar);opacity:.16}
svg .mk{fill:var(--rebar);stroke:var(--surface);stroke-width:2}
svg .mk-line{stroke:var(--rebar);stroke-width:1;stroke-dasharray:3 3}
svg .seuil{stroke:var(--alert);stroke-width:1.2;stroke-dasharray:6 3}
svg .seuil-t{fill:var(--alert);font-size:10.5px}
svg .lbl{fill:var(--ink);font-size:11px}
svg .bar{fill:var(--steel);opacity:.75}
svg .bar-alt{fill:var(--rebar);opacity:.85}
svg .bar-ref{fill:var(--muted);opacity:.35}
svg .bar-c3{fill:var(--sage);opacity:.8}

/* Widgets maison */
.calc-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px}
.steps{display:grid;gap:0;border:1px solid var(--line);border-radius:4px;overflow:hidden}
.step{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:10px;padding:9px 12px;border-top:1px solid var(--line);align-items:baseline;font-size:.88rem}
.step:first-child{border-top:0}
.step .n{font:600 1.1rem var(--display);color:var(--rebar)}
.step .why{color:var(--muted);font-size:.8rem;display:block}
.step .val{font:500 .86rem var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap;text-align:right}
.stack{display:flex;height:34px;border-radius:3px;overflow:hidden;border:1px solid var(--line)}
.stack div{display:grid;place-items:center;font:.68rem var(--mono);color:#fff;min-width:0;overflow:hidden;white-space:nowrap}
.stack-legend{display:flex;flex-wrap:wrap;gap:6px 14px;font:.75rem var(--mono);color:var(--muted)}
.stack-legend i{display:inline-block;width:10px;height:10px;margin-right:5px;vertical-align:-1px;border-radius:2px}
.checks{display:grid;gap:8px}
.checks label{display:flex;gap:10px;align-items:center;font-size:.9rem;cursor:pointer}
.checks input{width:18px;height:18px;accent-color:var(--steel)}
.verdict{font:600 1.3rem var(--display);padding:10px 14px;border-radius:3px;border:1px solid var(--line)}
.verdict.ok{color:var(--sage);border-color:var(--sage)}
.verdict.bad{color:var(--alert);border-color:var(--alert)}
.tbl-wrap{overflow-x:auto}
table.res{border-collapse:collapse;font:.8rem var(--mono);font-variant-numeric:tabular-nums;min-width:100%}
table.res th,table.res td{border-bottom:1px solid var(--line);padding:5px 8px;text-align:right;white-space:nowrap}
table.res th:first-child,table.res td:first-child{text-align:left}
table.res th{font-weight:500;color:var(--muted)}
table.res td.bad{color:var(--alert)}
table.res td.ok{color:var(--sage)}
.btn{background:var(--bg);border:1px solid var(--line);border-radius:3px;padding:5px 12px;font-size:.82rem;color:var(--ink);cursor:pointer}
.btn:hover{border-color:var(--steel)}
.btn:disabled{opacity:.5;cursor:default}
/* Diagramme à compléter (diagrammeWidget) */
.dg{display:grid;gap:12px;justify-items:center}
.dg-plan{position:relative;width:100%;max-width:640px;container-type:inline-size;user-select:none;-webkit-user-select:none}
.dg-plan svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none}
.dg-zone{position:absolute;transform:translate(-50%,-50%);display:flex;align-items:center;justify-content:center;box-sizing:border-box;padding:1px;border:1.5px dashed var(--muted);border-radius:6px;background:var(--bg);color:var(--ink);font:600 clamp(9.5px,2.3cqw,14px)/1.12 var(--body);text-align:center;cursor:pointer;hyphens:auto;-webkit-hyphens:auto}
.dg-zone.fleche{border-radius:999px;background:var(--surface);font-weight:500;letter-spacing:-.01em}
.dg-zone.plein{border-style:solid;border-color:var(--steel);touch-action:none;cursor:grab}
.dg-zone:focus-visible{outline:2px solid var(--steel);outline-offset:2px}
.dg.choix .dg-zone:not(.plein),.dg-zone.cible{border-color:var(--steel);background:color-mix(in srgb,var(--steel) 14%,var(--bg))}
.dg-zone.pris{box-shadow:0 0 0 3px color-mix(in srgb,var(--steel) 45%,transparent)}
.dg-zone.ok{border-color:var(--sage);box-shadow:0 0 0 2px color-mix(in srgb,var(--sage) 40%,transparent)}
.dg-zone.faux,.dg-zone.vide{border-color:var(--alert);box-shadow:0 0 0 2px color-mix(in srgb,var(--alert) 40%,transparent)}
.dg-zone.faux span{text-decoration:line-through;text-decoration-color:var(--alert)}
.dg-zone.sol{border-style:solid;border-color:var(--sage);cursor:default}
.dg-banque{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;align-items:center;width:100%;max-width:640px;min-height:44px;box-sizing:border-box;padding:8px;border:1px dashed var(--line);border-radius:6px}
.dg-eti{background:var(--surface);border:1px solid var(--steel);border-radius:999px;padding:6px 12px;font:500 .84rem var(--body);color:var(--ink);cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none}
.dg-eti[aria-pressed="true"]{background:var(--steel);color:var(--surface)}
.dg-fantome{position:fixed;z-index:60;pointer-events:none;transform:translate(-50%,-50%);box-shadow:0 4px 14px rgba(0,0,0,.25);cursor:grabbing}
.dg-act{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.dg-msg{text-align:center;margin:0;min-height:1.2em}
@media (max-width:640px){svg text{font-size:12px}}

/* Badges de source des graphiques */
.badge{display:inline-block;font:500 .66rem/1.5 var(--mono);letter-spacing:.06em;text-transform:uppercase;padding:1px 8px;border-radius:999px;border:1px solid currentColor;white-space:nowrap}
.badge.cours{color:var(--sage)}
.badge.calcul{color:var(--steel)}
.badge.modele{color:var(--rebar);border-style:dashed}
.chart-top .titre{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
/* Pour aller plus loin */
details.plus{border-top:1px dashed var(--line);padding-top:8px}
details.plus summary{cursor:pointer;font:500 .8rem var(--mono);color:var(--steel)}
details.plus p{margin-top:8px;font-size:.92rem;color:var(--ink);max-width:62ch}
/* Teste-toi */
.test{border:1px solid var(--line);border-left:4px solid var(--rebar);border-radius:4px;background:var(--surface);padding:14px 16px;display:grid;gap:14px}
.test-head{display:flex;justify-content:space-between;gap:10px;align-items:baseline;flex-wrap:wrap}
.test-head h3{font-size:1.1rem}
.q{display:grid;gap:8px}
.q-text{font-weight:500;font-size:.95rem}
.q-opts{display:grid;gap:6px}
.q-opts button{text-align:left;background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:7px 10px;font-size:.88rem;color:var(--ink);cursor:pointer}
.q-opts button:hover:not(:disabled){border-color:var(--steel)}
.q-opts button.good{border-color:var(--sage);background:color-mix(in srgb,var(--sage) 14%,var(--bg))}
.q-opts button.bad{border-color:var(--alert);background:color-mix(in srgb,var(--alert) 12%,var(--bg))}
.q-opts button:disabled{cursor:default}
.q-fb{font-size:.86rem;color:var(--ink);max-width:70ch}
.q-fb b.ok{color:var(--sage)}
.q-fb b.no{color:var(--alert)}
.q-row{display:flex;gap:8px;flex-wrap:wrap}
/* Accueil : actions et progression */
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}
.action{background:var(--ink);color:var(--bg);border:0;border-radius:3px;padding:9px 14px;font:500 .9rem var(--body);cursor:pointer}
.action.alt{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.card .qprog{font:.72rem var(--mono);color:var(--steel)}
/* Fiche de synthèse */
.fiche{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px;margin-top:24px}
.fiche-bloc{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:14px 16px;display:grid;gap:8px;align-content:start;min-width:0}
.fiche-bloc h3{font-size:1.2rem}
.fiche-bloc dl{display:grid;grid-template-columns:minmax(0,1fr);gap:6px;margin:0}
.fiche-bloc dt{font:500 .72rem var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.fiche-bloc dd{margin:0 0 4px;font-size:.92rem}
/* Quiz aléatoire */
.quiz-page{display:grid;gap:16px;margin-top:20px;max-width:760px}
.quiz-meta{font:.8rem var(--mono);color:var(--muted);display:flex;gap:14px;flex-wrap:wrap}
.quiz-meta b{color:var(--ink);font-weight:500}
[hidden]{display:none!important}
/* Confiance et maîtrise des notions */
.q-opts button.pick{border-color:var(--steel);box-shadow:inset 0 0 0 1px var(--steel)}
.conf{display:grid;gap:6px;max-width:460px;padding:10px 12px;border:1px solid var(--line);border-radius:4px;background:var(--surface)}
.conf > label{font:500 .72rem var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.conf output{font:500 .95rem var(--mono);font-variant-numeric:tabular-nums;color:var(--steel)}
.conf-ligne{display:flex;gap:8px;align-items:center}
.conf-ligne input{flex:1;min-width:0;accent-color:var(--steel)}
.conf-bout{font:.7rem var(--mono);color:var(--muted)}
.conf-ok{justify-self:start;background:var(--ink);color:var(--bg);border:0;border-radius:3px;padding:6px 14px;font:500 .85rem var(--body);cursor:pointer}
.q-fb .piege{display:block;margin-top:6px;padding-left:10px;border-left:2px solid var(--alert);color:var(--muted)}
.q-fb .cas{display:block;font:500 .72rem var(--mono);letter-spacing:.06em;text-transform:uppercase;margin-bottom:2px}
.q-type{font:500 .7rem var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--steel)}
.q-rappel,.q-a{padding:10px 12px;border:1px dashed var(--steel);border-radius:4px}
.q-consigne{margin:0;max-width:70ch;padding-left:10px;border-left:2px solid var(--steel);font-size:.84rem;color:var(--muted)}
.q-ecrit{width:100%;max-width:460px;box-sizing:border-box;font:inherit;font-size:.9rem;padding:7px 10px;border:1px solid var(--line);border-radius:4px;background:var(--bg);color:var(--ink);resize:vertical}
.q-ecrit[readonly]{border-style:dashed;color:var(--muted)}
.q-insiste{margin:0;font-size:.84rem;color:var(--alert)}
.q-fb .q-corrige{display:block;font:500 .72rem var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:2px}
.q-assoc{display:grid;gap:6px;max-width:620px}
.q-paire{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:4px 10px;align-items:center;padding:6px 8px;border:1px solid var(--line);border-radius:4px;background:var(--bg);font-size:.88rem}
.q-paire select{width:100%;min-width:0;font:inherit;font-size:.85rem;padding:5px 6px;border:1px solid var(--line);border-radius:3px;background:var(--surface);color:var(--ink)}
.q-paire.good{border-color:var(--sage);background:color-mix(in srgb,var(--sage) 10%,var(--bg))}
.q-paire.bad{border-color:var(--alert);background:color-mix(in srgb,var(--alert) 8%,var(--bg))}
.q-corr{grid-column:2;font-size:.8rem;color:var(--sage);font-weight:500}
.q-liste{display:grid;gap:8px}
.q-liste-ok{justify-self:start}
.q-liste-res{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:6px}
.q-item{border:1px solid var(--line);border-radius:3px;padding:4px 9px;font:inherit;font-size:.84rem;background:var(--bg);color:var(--ink);cursor:pointer}
.q-item.good{border-color:var(--sage);background:color-mix(in srgb,var(--sage) 12%,var(--bg))}
.q-item.bad{border-color:var(--alert);background:color-mix(in srgb,var(--alert) 8%,var(--bg))}

      par.options.forEach(o => {
        const b = el("button", { type: "button", id: id + "-" + String(o.v).replace(/\W/g, ""), "aria-pressed": String(o.v === par.value) }, o.label);
        b.addEventListener("click", () => {

/* Exercice de tri : chaque élément se classe dans une catégorie, correction immédiate */
function triWidget(box, cfg) {
  box.append(el("div", { class: "chart-top" }, `<h3>${cfg.titre}</h3>`));
  const score = el("div", { class: "readout", "aria-live": "polite" });
  box.append(score);
  if (cfg.consigne) box.append(el("p", { class: "note" }, cfg.consigne));
  const list = el("div", { style: "display:grid;gap:8px" });
  const st = cfg.items.map(() => null);
  cfg.items.forEach((it, i) => {
    const row = el("div", { style: "display:grid;grid-template-columns:minmax(0,1fr);gap:6px;padding:8px 10px;border:1px solid var(--line);border-radius:4px;background:var(--bg)" });
    const lab = el("div", { style: "font-size:.9rem" }, it.nom);
    const seg = el("div", { class: "seg" });
    const fb = el("div", { class: "note", hidden: "" });
    cfg.cats.forEach(c => {
      const b = el("button", { type: "button", "aria-pressed": "false" }, c);
      b.addEventListener("click", () => {
        st[i] = c;
        seg.querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", String(x === b)));
        const ok = c === it.rep;
        fb.hidden = false;
        fb.innerHTML = `<b style="color:var(${ok ? "--sage" : "--alert"})">${ok ? "Exact." : "Non : " + it.rep + "."}</b> ${it.pourquoi || ""}`;

    row.append(lab, seg, fb); list.append(row);
  });

    const done = st.filter(x => x != null).length, good = st.filter((x, i) => x === cfg.items[i].rep).length;
    score.innerHTML = `<span>répondu <b>${done} / ${cfg.items.length}</b></span><span class="${good === done ? "ok" : "bad"}">bonnes réponses <b>${good}</b></span>`;
  }
  const reset = el("button", { class: "btn", type: "button" }, "Recommencer");
  reset.addEventListener("click", () => { box.innerHTML = ""; triWidget(box, cfg); });
  box.append(list, el("div", {}, ""), reset); upd();
}

      const d = zEl[z.id], i = vue[z.id], v = i == null ? null : (solution ? i : banqueTx[i]);
      d.innerHTML = v == null ? "" : `<span>${v}</span>`;
      d.className = "dg-zone " + z.type + (v != null ? " plein" : "") + (sel && sel.zone === z.id ? " pris" : "")
        + (solution ? " sol" : verif ? (v == null ? " vide" : juste(z, v) ? " ok" : " faux") : "");
      d.setAttribute("aria-label", (z.type === "case" ? "Case" : "Flèche") + (v == null ? " vide" : " : " + v) + (verif && v != null ? (juste(z, v) ? " (juste)" : " (à revoir)") : ""));
    });
    banque.innerHTML = "";
    if (!solution) ordre.forEach(i => { if (prise(i)) return;
      const b = el("button", { class: "dg-eti", type: "button", "aria-pressed": String(!!(sel && sel.i === i)) }, banqueTx[i]);
      b.addEventListener("click", () => { if (dg.dataset.glisse || solution) return; sel = sel && sel.i === i ? null : { i }; rendre(); });
      b.addEventListener("pointerdown", e => { if (!solution) glisser(e, { i }, b); });
      banque.append(b);
    });
    if (!banque.children.length) banque.append(el("span", { class: "note" }, solution ? "Solution affichée." : "Toutes les étiquettes sont placées."));
    dg.classList.toggle("choix", !!sel);
    const n = zones.length, pl = zones.filter(z => pose[z.id] != null).length, bons = zones.filter(z => juste(z, banqueTx[pose[z.id]])).length;
    score.innerHTML = `<span>placées <b>${pl} / ${n}</b></span>` + (verif ? `<span class="${bons === n ? "ok" : "bad"}">bonnes réponses <b>${bons} / ${n}</b></span>` : "");
    msg.innerHTML = solution ? (cfg.note || "") : verif ? (bons === n ? "<b style=\"color:var(--sage)\">Bravo !</b> Le diagramme est complet et juste."
      : `<b style="color:var(--alert)">${n - bons} case${n - bons > 1 ? "s" : ""} à revoir</b> (en rouge${pl < n ? " ou vides" : ""}). Déplace les étiquettes, puis vérifie de nouveau.`)
      : sel ? "Touche maintenant une case" + (sel.zone ? ", ou la banque pour retirer l'étiquette." : ".") : "";
    bS.textContent = solution ? "Revenir à mon diagramme" : "Voir la solution";
    bV.disabled = !!solution;
  }
  bV.addEventListener("click", () => { verif = true; sel = null; rendre(); });
  bS.addEventListener("click", () => { solution = solution ? null : Object.fromEntries(zones.map(z => [z.id, txt(z.rep)])); sel = null; rendre(); });
  bR.addEventListener("click", () => { pose = {}; sel = null; verif = false; solution = null; melange(); rendre(); });
  rendre();
}

/* GCI-1010 : petits dessins réutilisés par les animations (instrument sur trépied, mire, flèche du nord, maison en isométrique) */
const G = {
  /* trépied + instrument ; x = centre, y = sol ; renvoie la hauteur de l'axe de visée */
  trepied(ctx, x, y, h, type = "niveau", col) {
    col = col || C.ink;
    D.line(ctx, [[x, y - h + 10], [x - h * 0.28, y]], col, 1.6); D.line(ctx, [[x, y - h + 10], [x + h * 0.28, y]], col, 1.6); D.line(ctx, [[x, y - h + 10], [x + 3, y]], col, 1.6);
    if (type === "niveau") D.rect(ctx, x - 16, y - h - 2, 32, 12, C.steel, col, 1);
    else { D.rect(ctx, x - 9, y - h - 10, 18, 22, C.steel, col, 1); D.circle(ctx, x, y - h, 4, C.surface, col, 1); }
    return y - h + 4;
  },
  /* mire graduée posée en (x, y) vers le haut, hauteur H px ; lecture à la hauteur yl éventuelle */
  mire(ctx, x, y, H, col) {
    D.rect(ctx, x - 4, y - H, 8, H, C.surface, col || C.rebar, 1.2);
    for (let i = 1; i < 10; i++) D.line(ctx, [[x - 4, y - H * i / 10], [x + (i % 2 ? 0 : 4), y - H * i / 10]], col || C.rebar, 1);
  },
  /* jalon avec prisme */
  jalon(ctx, x, y, H) {
    D.line(ctx, [[x, y], [x, y - H]], C.ink, 2);
    D.circle(ctx, x, y - H, 6, C.rebar, C.ink, 1);
  },
  /* flèche du nord */
  nord(ctx, x, y, L, ang, label, col) {
    const a = (ang || 0) * Math.PI / 180, x2 = x + L * Math.sin(a), y2 = y - L * Math.cos(a);
    D.arrow(ctx, x, y, x2, y2, col || C.ink, 1.8);
    if (label) D.text(ctx, label, x2 + (ang < 0 ? -4 : 4), y2 - 4, { color: col || C.ink, size: 11, align: ang < 0 ? "right" : "left" });
  },
  /* arc d'angle mesuré dans le sens horaire depuis la direction a0 (degrés, 0 = haut) jusqu'à a1 */
  arc(ctx, x, y, r, a0, a1, col) {
    ctx.save(); ctx.strokeStyle = col || C.rebar; ctx.lineWidth = 2; ctx.beginPath();
    ctx.arc(x, y, r, (a0 - 90) * Math.PI / 180, (a1 - 90) * Math.PI / 180, a1 < a0); ctx.stroke(); ctx.restore();
  },
  /* point en isométrique : axes X (vers la droite-bas), Y (vers la gauche-bas), Z (haut) */
  iso(ox, oy, k) { const c = Math.cos(Math.PI / 6) * k, s = Math.sin(Math.PI / 6) * k; return (x, y, z) => [ox + (x - y) * c, oy + (x + y) * s - z * k]; },
  /* petite maison isométrique (corps + toit à deux versants) */
  maison(ctx, ox, oy, k, o = {}) {
    const P = G.iso(ox, oy, k), L = 4, Pr = 3, Hm = 2, Ht = 3.3;
    const f = (pts, fill) => D.poly(ctx, pts.map(q => P(...q)), fill, C.ink, 1.2);
    f([[0, Pr, 0], [L, Pr, 0], [L, Pr, Hm], [0, Pr, Hm]], o.face || C.water + "aa");          // façade avant (y = Pr)
    f([[L, 0, 0], [L, Pr, 0], [L, Pr, Hm], [L, 0, Hm]], o.cote || C.hydrate + "88");         // côté droit
    f([[L, 0, Hm], [L, Pr / 2, Ht], [L, Pr, Hm]], o.cote || C.hydrate + "88");
    f([[0, Pr, Hm], [L, Pr, Hm], [L, Pr / 2, Ht], [0, Pr / 2, Ht]], o.toit || C.rebar + "99");
    f([[1.5, Pr, 0], [2.3, Pr, 0], [2.3, Pr, 1.3], [1.5, Pr, 1.3]], C.surface);              // porte
    return P;
  }
};

/* Question du diagnostic : question dédiée (section.diag ou DIAG_DATA), sinon la première « Teste-toi » à choix */
function diagOf(mod, i) {
  const d = mod.sections[i].diag || (DIAG[mod.id] || {})[i];
  if (d) return { q: d, id: `${mod.id}:${i}:d`, mod, sec: i };
  const qs = actives(mod, i), x = qs.find(x => x.q.o) || qs[0];
  return x ? { q: x.q, id: `${mod.id}:${i}:${x.k}`, mod, sec: i } : null;
}

/* ---------- une question : réponse, puis confiance, puis correction ---------- */
/* Types de questions : à choix { o, r } (r = tableau → « cochez la ou les réponses exactes »), vrai/faux par énoncé { vf },
   association { a }, rappel { e seul }. L'étiquette « une seule réponse » n'apparaît que si le cours a aussi des choix multiples. */
let avecMulti = null;
const aDesMulti = () => avecMulti != null ? avecMulti : (avecMulti = allQuestions().some(x => Array.isArray(x.q.r) || (x.q.vf && x.q.forme && x.q.forme !== "vrai")) || Object.values(DIAG).some(m => Object.values(m).some(d => Array.isArray(d.r))));
/* Série d'énoncés { vf, forme } posée comme le prof : forme "faux" → « le(s)quel(s) est (sont) faux ? » (choix multiple) ;
   forme "vrai" → « lequel est vrai ? » (un vrai tiré au hasard parmi les vrais + tous les faux, réponse unique) ;
   forme "vrais" → « le(s)quel(s) est (sont) vrai(s) ? » (choix multiple). Sans forme : boutons V/F énoncé par énoncé. */
function vfEnChoix(q) {
  const L = q.vf.map(([t, v, pq]) => ({ t, v: !!v, pq: pq ? pq.charAt(0).toUpperCase() + pq.slice(1) : "" }));
  const sujet = q.q ? q.q + " : d" : "D";
  if (q.forme === "vrai") {
    const vrais = L.filter(x => x.v), un = vrais[Math.floor(Math.random() * vrais.length)];
    const o = [un, ...L.filter(x => !x.v)];
    return Object.assign({}, q, { vf: null, q: `${sujet}ans les énoncés suivants, <b>lequel est vrai</b> ?`, o: o.map(x => x.t), r: 0, oe: o.map(x => x.pq) });
  }
  const cherche = q.forme === "faux" ? false : true;
  return Object.assign({}, q, { vf: null, q: `${sujet}ans les énoncés suivants, <b>${cherche ? "le(s)quel(s) est (sont) vrai(s)" : "le(s)quel(s) est (sont) faux"}</b> ?`,
    o: L.map(x => x.t), r: L.map((x, j) => x.v === cherche ? j : -1).filter(j => j >= 0), oe: L.map(x => x.pq), cible: cherche ? "vrai" : "faux" });

    function valider(p, r) {

function testBlock(mod, i) {
  const qs = actives(mod, i); if (!qs.length) return null;
  const box = el("div", { class: "test" });
  const head = el("div", { class: "test-head" }, `<h3>Teste-toi</h3><span class="note">Réponds, règle ta confiance de 0 à 100 %, puis compare.</span>`);
  box.append(head);
  qs.forEach(({ q, k }) => box.append(questionEl({ q, id: `${mod.id}:${i}:${k}`, mod, sec: i }, () => refreshEtats(mod))));

}
/* met à jour les pastilles de la page d'un sujet */
function refreshEtats(mod) {
  mod.sections.forEach((s, i) => {
    const e = etatNotion(mod, i);
    document.querySelectorAll(`[data-etat="${i}"]`).forEach(x => { x.className = "dot" + (e ? " s-" + e : ""); x.title = e ? ETATS[e].label : "Pas encore évalué"; });

  });
}

/* ---------- quiz diagnostique en tête de sujet ---------- */
function diagPanel(mod, secs, onFin) {
  if (COURSE.diagnostic === false) return null;      // diagnostic désactivé pour ce cours
  const items = mod.sections.map((s, i) => s.niveau === "survol" ? null : diagOf(mod, i)).filter(Boolean);
  if (!items.length) return null;
  const box = el("div", { class: "diag" });
  const accueil = () => {
    box.innerHTML = "";

      el("p", {}, `Avant d'étudier : ${items.length} question${items.length > 1 ? "s" : ""}, une par notion. Pour chacune, dis aussi à quel point tu es sûr. On verra ensuite par où commencer.`

    box.append(el("h3", {}, vus.length ? "Ton bilan pour ce sujet" : "Diagnostic passé"));
    if (vus.length) {
      const ordre = evals.slice().sort((a, b) => poidsNiv(mod, a.i) - poidsNiv(mod, b.i) || (a.e ? ETATS[a.e].rang : 1.5) - (b.e ? ETATS[b.e].rang : 1.5) || a.i - b.i);
      const prem = ordre.find(x => x.e !== "vert");
      box.append(el("p", { class: "note" }, prem ? (avecNiveaux() ? "Étudie dans cet ordre : les notions d'examen d'abord (idées à corriger, puis lacunes, puis ce qui est fragile), le survol à la fin." : "Étudie dans cet ordre : les idées à corriger d'abord, puis les lacunes, puis ce qui est fragile.") : "Tout est juste et sûr. Survole les notions et fais les Teste-toi pour confirmer."));
      const ul = el("ul", { class: "diag-list" });
      ordre.forEach(x => {
        const li = el("li"); li.innerHTML = dot(x.e);
        const a = el("button", { class: "link", type: "button" }, `${x.i + 1}. ${x.s.titre} ${x.s.niveau ? NIVEAUX[x.s.niveau].ic : ""}`);
        a.addEventListener("click", () => secs[x.i].scrollIntoView({ behavior: reduceMotion ? "auto" : "smooth" }));
        li.append(a, el("small", {}, x.e ? ETATS[x.e].label : "pas évalué")); ul.append(li);
      });
      box.append(ul);
      if (prem) { const b = el("button", { class: "action", type: "button" }, `Commencer par : ${prem.s.titre} →`); b.addEventListener("click", () => secs[prem.i].scrollIntoView({ behavior: reduceMotion ? "auto" : "smooth" })); box.append(b); }
    } else box.append(el("p", { class: "note" }, "Les pastilles apparaîtront au fil de tes réponses aux Teste-toi."));
    const redo = el("button", { class: "link", type: "button" }, "Refaire le diagnostic");
    redo.addEventListener("click", () => questionN(0));
    box.append(legendeEtats(), redo);
  };
  diagFait[mod.id] ? bilan() : accueil();
  return box;
}

/* ---------- calibration : la confiance est-elle justifiée ? ---------- */
function calibration() {
  const rep = Object.values(conf).filter(x => x && x.ok != null);
  if (rep.length < 8) return null;
  const moy = Math.round(rep.reduce((a, x) => a + pctDe(x), 0) / rep.length), reussi = Math.round(100 * rep.filter(x => x.ok).length / rep.length);
  const sur = rep.filter(x => pctDe(x) >= SEUIL_SUR), ecart = moy - reussi;
  let txt = `Confiance moyenne <b>${moy} %</b>, réussite réelle <b>${reussi} %</b> (${rep.length} réponses).`;
  txt += ecart > 10 ? " Tu te surestimes : reprends en priorité les idées à corriger (faux, mais confiance élevée)." : ecart < -10 ? " Tu te sous-estimes : tu en sais plus que tu le crois." : " Ta confiance est bien calibrée.";
  if (sur.length >= 5) txt += ` Quand tu te dis sûr (≥ ${SEUIL_SUR} %), tu as raison ${Math.round(100 * sur.filter(x => x.ok).length / sur.length)} % du temps.`;
  return el("p", { class: "calib" }, txt);
}

        <span class="meta"><span>${mod.sections.length} notion${mod.sections.length > 1 ? "s" : ""}</span><span>${nt} outil${nt > 1 ? "s" : ""} interactif${nt > 1 ? "s" : ""}</span>${nx ? `<span title="${NIVEAUX.examen.titre}">🎯 ${nx} d'examen</span>` : ""}${ns ? `<span title="${NIVEAUX.survol.titre}">💤 ${ns} survol</span>` : ""}</span>
        ${st.n ? `<span class="qprog">quiz : ${st.ok} / ${st.n} réussies</span>` : ""}
        ${ets.some(Boolean) ? `<span class="dots" aria-label="Maîtrise des notions">${ets.map(dot).join("")}</span>` : ""}
        ${doneSet.has(mod.id) ? '<span class="done">révisé</span>' : ""}`;

/* ---------- page d'un sujet ---------- */
function renderModule(mod, cible) {
  stages.length = 0;
  app.innerHTML = "";
  const idx = MODULES.indexOf(mod);
  const bar = el("div", { class: "topbar" });
  const back = el("button", { class: "link", type: "button" }, "← Tous les sujets");
  back.addEventListener("click", () => go(""));
  const tog = el("button", { class: "toggle-done", type: "button", "aria-pressed": String(doneSet.has(mod.id)) });
  const setTog = () => { const on = doneSet.has(mod.id); tog.setAttribute("aria-pressed", String(on)); tog.textContent = on ? "✓ Révisé" : "Marquer comme révisé"; };
  tog.addEventListener("click", () => { doneSet.has(mod.id) ? doneSet.delete(mod.id) : doneSet.add(mod.id); saveDone(); setTog(); });
  setTog();
  bar.append(back, tog);
  const head = el("header", { class: "masthead" });
  head.append(el("span", { class: "eyebrow" }, `Sujet ${idx + 1} · ${PARTIES.find(p => p.id === mod.partie).titre}`),
    el("h1", {}, mod.titre), el("p", {}, mod.resume));
  if (mod.sources) head.append(el("span", { class: "src" }, "Sources : " + mod.sources));
  if (mod.sections.some(s => s.niveau)) head.append(legendeNiveaux());
  const toc = el("nav", { class: "toc", "aria-label": "Notions du sujet" });
  ton(mod.partie); decor("sujet", head, mod);
  app.append(bar, head, toc);
  const secs = [];
  const contenu = [toc];                                 // masqué jusqu'à la fin du diagnostic si COURSE.diagAvant
  const devoiler = () => contenu.forEach(x => x.hidden = false);
  const dp = diagPanel(mod, secs, devoiler); if (dp) app.append(dp);

  mod.sections.forEach((s, i) => {
    const sec = el("section", { class: "sec" + (s.niveau === "survol" ? " survol" : "") });
    const hd = el("div", { class: "sec-head" });
    const e0 = etatNotion(mod, i), lab = el("span", { class: e0 ? "etat s-" + e0 : "etat", "data-etat-label": i }, e0 ? ETATS[e0].label : "");
    if (!e0) lab.hidden = true;
    hd.append(el("span", { class: "sec-num" }, i + 1), el("h2", {}, s.titre + (s.niveau ? " " + nivBadge(s.niveau) : "")), lab);
    sec.append(hd);
    if (s.niveau === "survol") sec.append(el("p", { class: "note" }, TXT.survol));
    if (s.prof) sec.append(el("div", { class: "prof" }, `<span class="lab">${TXT.prof}</span>${s.prof}`));
    if (s.examen) sec.append(el("div", { class: "exam" }, `<span class="lab">${TXT.examen}</span>${s.examen}`));
    if (s.ajout) sec.append(el("p", { class: "note ajout" }, TXT.ajout));
    const duo = el("div", { class: "duo" });
    const text = el("div", { class: "text" });
    s.texte.slice(0, 2).forEach(t => text.append(el("p", {}, t)));
    const plus = (s.texte.slice(2)).concat(s.plus || []);
    if (s.cle) text.append(el("div", { class: "key" }, `<b>${s.cle.label}</b>${s.cle.html}`));
    if (plus.length) { const d = el("details", { class: "plus" }); d.append(el("summary", {}, "Pour aller plus loin")); plus.forEach(t => d.append(el("p", {}, t))); text.append(d); }
    if (s.anim) duo.append(buildStage(s.anim)); else duo.style.gridTemplateColumns = "1fr";
    duo.append(text);
    sec.append(duo);
    if (s.graphique) sec.append(buildChart(s.graphique));
    if (s.widget) { const w = el("div", { class: "chart" }); s.widget(w); sec.append(w); }
    const tb = testBlock(mod, i); if (tb) sec.append(tb);
    app.append(sec); secs.push(sec); contenu.push(sec);
    const b = el("button", { type: "button", class: s.niveau ? "t-" + s.niveau : "" }, `<span class="dot${e0 ? " s-" + e0 : ""}" data-etat="${i}"></span>${i + 1}. ${s.titre}${s.niveau && s.niveau !== "utile" ? " " + NIVEAUX[s.niveau].ic : ""}`);
    b.addEventListener("click", () => sec.scrollIntoView({ behavior: reduceMotion ? "auto" : "smooth" }));
    toc.append(b);
  });
  if (MODULES[idx + 1]) {
    const nx = el("div", { class: "next" });
    const b = el("button", { type: "button" }, `Sujet ${idx + 2} : ${MODULES[idx + 1].titre} →`);
    b.addEventListener("click", () => go(MODULES[idx + 1].id));
    nx.append(b); app.append(nx); contenu.push(nx);
  }
  if (cible != null && secs[cible]) { requestAnimationFrame(() => secs[cible].scrollIntoView()); return; }   // arrivée depuis la liste du prof : contenu visible
  if (COURSE.diagAvant && dp && !diagFait[mod.id]) contenu.forEach(x => x.hidden = true);
  scrollTo(0, 0);
}

/* ---------- liste d'examen du prof ---------- */
const cibles = it => (it.cible ? (Array.isArray(it.cible[0]) ? it.cible : [it.cible]) : []).map(([id, i]) => ({ mod: MODULES.find(m => m.id === id), i })).filter(x => x.mod && x.mod.sections[x.i]);
function renderExamen() {
  stages.length = 0;
  app.innerHTML = "";
  const back = el("button", { class: "link", type: "button" }, "← Tous les sujets");
  back.addEventListener("click", () => go(""));
  const bar = el("div", { class: "topbar" }); bar.append(back);
  const head = el("header", { class: "masthead" });
  const tous = COURSE.examen.flatMap(b => b.items), avec = tous.filter(it => cibles(it).length);
  const etatItem = it => { const es = cibles(it).map(c => etatNotion(c.mod, c.i)); return es.some(e => !e) ? null : es.reduce((a, e) => ETATS[e].rang < ETATS[a].rang ? e : a, "vert"); };
  const nv = avec.filter(it => etatItem(it) === "vert").length;
  head.append(el("span", { class: "eyebrow" }, `${COURSE.code} · ${TXT.listeEyebrow}`), el("h1", {}, TXT.listeTitre),
    el("p", {}, COURSE.examenIntro || TXT.listeIntro),
    el("span", { class: "progress" }, `<b>${nv}</b> / ${avec.length} points maîtrisés (juste et sûr)`), legendeEtats());
  const grid = el("div", { class: "fiche" });
  COURSE.examen.forEach(b => {
    const bloc = el("div", { class: "fiche-bloc" });
    bloc.append(el("h3", {}, b.titre));
    const ul = el("ul", { class: "diag-list exam-list" });
    b.items.forEach(it => {
      const li = el("li"), cs = cibles(it), e = cs.length ? etatItem(it) : null;
      li.innerHTML = cs.length ? dot(e) : `<span class="dot" style="visibility:hidden"></span>`;
      const corps = el("div", { class: "exam-item" }, `<span>${it.t}</span>` + (it.sous ? `<span class="note">${it.sous.join(" · ")}</span>` : "") + (it.note ? `<span class="exam-note">${it.note}</span>` : ""));
      const liens = el("span", { class: "exam-liens" });
      cs.forEach(c => { const a = el("button", { class: "link", type: "button" }, `→ ${MODULES.indexOf(c.mod) + 1}.${c.i + 1} ${c.mod.sections[c.i].titre}`); a.addEventListener("click", () => go(`${c.mod.id}/${c.i}`)); liens.append(a); });
      corps.append(liens); li.append(corps); ul.append(li);
    });
    bloc.append(ul); grid.append(bloc);
  });
  ton(null); decor("page", head, "examen");
  app.append(bar, head, grid);
  scrollTo(0, 0);
}

/* ---------- quiz aléatoire ---------- */
function shuffle(a, seed) { const r = seeded(seed); const b = a.slice(); for (let i = b.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [b[i], b[j]] = [b[j], b[i]]; } return b; }
function renderQuiz() {
  stages.length = 0;
  app.innerHTML = "";
  const back = el("button", { class: "link", type: "button" }, "← Tous les sujets");
  back.addEventListener("click", () => go(""));
  const bar = el("div", { class: "topbar" }); bar.append(back);
  const head = el("header", { class: "masthead" });
  head.append(el("span", { class: "eyebrow" }, `${COURSE.code} · quiz aléatoire`), el("h1", {}, "Quiz aléatoire"),
    el("p", {}, "Des questions tirées de tous les sujets, une à la fois. « À travailler » reprend d'abord tes idées à corriger, puis tes lacunes, puis ce qui est fragile."));
  const page = el("div", { class: "quiz-page" });
  const p = {}, ctrls = el("div", { class: "ctrls" });
  const opts = [{ v: "tout", label: "Tout" }].concat(avecNiveaux() ? [{ v: "examen", label: TXT.liste }] : []).concat(PARTIES.map(x => ({ v: x.id, label: x.titre.split("·")[0].trim() || x.titre }))).concat([{ v: "travail", label: "À travailler" }]);
  buildControls([{ id: "f", label: "Questions", type: "choix", value: "tout", options: opts }, { id: "n", label: "Nombre", type: "choix", value: 15, options: [10, 15, 25].map(v => ({ v, label: String(v) })) }], p, start, ctrls);
  const meta = el("div", { class: "quiz-meta" }), zone = el("div", {});
  page.append(ctrls, meta, zone);
  ton(null); decor("page", head, "quiz");
  app.append(bar, head, page);
  let list = [], k = 0, ok = 0, missed = [];
  function start() {
    const rang = x => { const e = etatNotion(x.mod, x.sec); return e && e !== "vert" ? ETATS[e].rang : results[x.id] === false ? 1 : 9; };
    const pool = allQuestions().filter(x => p.f === "tout" ? true : p.f === "examen" ? nivDe(x.mod, x.sec) === "examen" : p.f === "travail" ? rang(x) < 9 && nivDe(x.mod, x.sec) !== "survol" : x.mod.partie === p.f);
    list = shuffle(pool, Date.now() % 100000 + 1);
    if (p.f === "travail") list.sort((a, b) => poidsNiv(a.mod, a.sec) - poidsNiv(b.mod, b.sec) || rang(a) - rang(b));   // tri stable : priorité, puis hasard
    list = list.slice(0, p.n); k = 0; ok = 0; missed = [];
    show();
  }
  function show() {
    zone.innerHTML = "";
    if (!list.length) { meta.innerHTML = ""; zone.append(el("p", { class: "note" }, p.f === "travail" ? "Rien à travailler pour l'instant. Bravo, ou fais d'abord le diagnostic d'un sujet." : "Aucune question pour ce choix.")); return; }
    if (k >= list.length) {
      meta.innerHTML = `<span>Terminé : <b>${ok} / ${list.length}</b> (${Math.round(100 * ok / list.length)} %)</span>`;
      if (missed.length) { zone.append(el("p", { class: "q-text" }, "À revoir :")); const ul = el("ul"); missed.forEach(x => { const li = el("li"); const a = el("button", { class: "link", type: "button" }, `${x.mod.titre} › ${x.mod.sections[x.sec].titre}`); a.addEventListener("click", () => go(x.mod.id)); li.append(a); ul.append(li); }); zone.append(ul); }
      const again = el("button", { class: "action", type: "button" }, "Nouveau tirage"); again.addEventListener("click", start); zone.append(again);
      return;
    }
    const item = list[k];
    meta.innerHTML = `<span>Question <b>${k + 1} / ${list.length}</b></span><span>score <b>${ok}</b></span><span>${item.mod.titre}</span>`;
    const next = el("button", { class: "action", type: "button", hidden: "" }, k + 1 < list.length ? "Suivante →" : "Voir le résultat");
    next.addEventListener("click", () => { k++; show(); });
    zone.append(questionEl(item, good => { if (good) ok++; else missed.push(item); next.hidden = false; meta.querySelector("b:nth-of-type(2)") && (meta.innerHTML = `<span>Question <b>${k + 1} / ${list.length}</b></span><span>score <b>${ok}</b></span><span>${item.mod.titre}</span>`); }), next);
  }
  start();
  scrollTo(0, 0);
}

function go(id) { try { history.replaceState(null, "", id ? "#" + id : location.pathname + location.search); } catch (e) {} route(id); }
function route(id) {
  if (id === "fiche" && COURSE.fiche) return renderFiche();
  if (id === "quiz") return renderQuiz();
  if (id === "examen" && COURSE.examen) return renderExamen();
  const [mid, si] = id.split("/");
  const mod = MODULES.find(m => m.id === mid); mod ? renderModule(mod, si != null && si !== "" ? +si : null) : renderHome();
}
window.addEventListener("hashchange", () => route(location.hash.slice(1)));
route(location.hash.slice(1));
